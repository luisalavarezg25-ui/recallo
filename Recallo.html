    return buildImport(parsed, { keepProgress, zip, zstd, mediaMap, fallbackDeckName });
  };

  function readCollection(db) {
    const hasNotetypes = rows(db, "SELECT name FROM sqlite_master WHERE type='table' AND name='notetypes'").length > 0;
    const col = rows(db, 'SELECT * FROM col')[0] || {};
    const crt = col.crt || 0;
    const deckNames = {};
    const models = {};

    if (hasNotetypes) {
      for (const d of rows(db, 'SELECT id, name FROM decks')) deckNames[d.id] = String(d.name).split('\x1f').join('::');
      const tcount = {};
      for (const t of rows(db, 'SELECT ntid, COUNT(*) AS n FROM templates GROUP BY ntid')) tcount[t.ntid] = t.n;
      for (const m of rows(db, 'SELECT id, name, config FROM notetypes')) {
        models[m.id] = { name: m.name, cloze: isClozeConfig(m.config), tmplCount: tcount[m.id] || 1 };
      }
    } else {
      const ds = JSON.parse(col.decks || '{}');
      for (const k in ds) deckNames[k] = ds[k].name;
      const ms = JSON.parse(col.models || '{}');
      for (const k in ms) models[k] = { name: ms[k].name, cloze: ms[k].type === 1, tmplCount: (ms[k].tmpls || []).length || 1 };
    }

    const notes = rows(db, 'SELECT id, guid, mid, tags, flds FROM notes ORDER BY id');
    const cards = rows(db, 'SELECT id, nid, did, ord, type, queue, due, ivl, factor, reps, lapses FROM cards ORDER BY due, id');
    return { crt, deckNames, models, notes, cards };
  }

  async function buildImport(parsed, { keepProgress, zip, zstd, mediaMap, fallbackDeckName }) {
    const { crt, deckNames, models } = parsed;
    const cardsByNote = new Map();
    for (const c of parsed.cards) {
      if (!cardsByNote.has(c.nid)) cardsByNote.set(c.nid, []);
      cardsByNote.get(c.nid).push(c);
    }

    const deckIdMap = {};
    const decksUsed = new Set();
    const getDeck = async (did) => {
      if (deckIdMap[did]) return deckIdMap[did];
      let name = deckNames[did] || fallbackDeckName;
      if (name === 'Default' || name === 'Predeterminado') name = fallbackDeckName;
      const d = await S.ensureDeck(name);
      decksUsed.add(d.id);
      return (deckIdMap[did] = d.id);
    };

    const newNotes = [], newCards = [];
    let skipped = 0;
    const now = Date.now();

    for (const n of parsed.notes) {
      if (S.hasGuid(n.guid)) { skipped++; continue; }
      const ankiCards = cardsByNote.get(n.id) || [];
      if (!ankiCards.length) continue;
      const m = models[n.mid] || { cloze: false, tmplCount: 1 };
      const flds = String(n.flds).split('\x1f');
      const rest = flds.slice(1).filter((x) => x.trim());
      const isCloze = m.cloze || /\{\{c\d+::/.test(flds[0] || '');

      let type, fields;
      if (isCloze) {
        type = 'cloze';
        fields = { text: flds[0] || '', extra: rest.join('<br>') };
      } else {
        type = m.tmplCount >= 2 && ankiCards.some((c) => c.ord === 1) ? 'reverse' : 'basic';
        fields = { front: flds[0] || '', back: rest.join('<br>') };
      }

      const deckId = await getDeck(ankiCards[0].did);
      const note = {
        id: U.newId(), guid: n.guid, deckId, type, fields,
        tags: String(n.tags || '').trim().split(/\s+/).filter(Boolean),
        created: n.id, mod: now
      };
      newNotes.push(note);

      for (const ord of C.ordsFor(note)) {
        const card = S.makeCard(note, ord);
        const ac = ankiCards.find((c) => c.ord === ord);
        if (ac) {
          card.deckId = await getDeck(ac.did);
          if (keepProgress) applyProgress(card, ac, crt);
        }
        newCards.push(card);
      }
    }

    // Multimedia
    const newMedia = [];
    for (const [zipName, realName] of Object.entries(mediaMap)) {
      if (!realName || S.hasMedia(realName)) continue;
      const f = zip.file(zipName);
      if (!f) continue;
      let data = await f.async('uint8array');
      if (zstd) {
        try { data = window.fzstd.decompress(data); } catch { /* archivo sin comprimir */ }
      }
      newMedia.push({ name: realName, blob: new Blob([data], { type: U.mimeFor(realName) }) });
    }

    await S.importBatch({ notes: newNotes, cards: newCards, media: newMedia });
    return { notes: newNotes.length, cards: newCards.length, decks: decksUsed.size, media: newMedia.length, skipped };
  }

  function applyProgress(card, ac, crt) {
    card.reps = ac.reps || 0;
    card.lapses = ac.lapses || 0;
    if (ac.queue === -1) card.suspended = true;
    if (ac.type === 2 || ac.type === 3) {
      // Repaso (o reaprendizaje): due son días desde la creación de la colección,
      // salvo en reaprendizaje intradía, donde es una marca de tiempo en segundos.
      const ivl = Math.max(1, ac.ivl || 1);
      const dueTs = ac.due > 1e9 ? ac.due * 1000 : crt * 1000 + ac.due * 86400000;
      card.state = 'review';
      card.interval = ivl;
      if (ac.factor) card.ease = ac.factor / 1000;
      card.due = U.dayStart(0, dueTs);
    } else if (ac.type === 1) {
      card.state = 'learning';
      card.step = 0;
      card.due = Date.now();
    }
  }

  // ================= EXPORTAR =================
  const SCHEMA = `
    CREATE TABLE col (id integer primary key, crt integer not null, mod integer not null, scm integer not null, ver integer not null, dty integer not null, usn integer not null, ls integer not null, conf text not null, models text not null, decks text not null, dconf text not null, tags text not null);
    CREATE TABLE notes (id integer primary key, guid text not null, mid integer not null, mod integer not null, usn integer not null, tags text not null, flds text not null, sfld integer not null, csum integer not null, flags integer not null, data text not null);
    CREATE TABLE cards (id integer primary key, nid integer not null, did integer not null, ord integer not null, mod integer not null, usn integer not null, type integer not null, queue integer not null, due integer not null, ivl integer not null, factor integer not null, reps integer not null, lapses integer not null, left integer not null, odue integer not null, odid integer not null, flags integer not null, data text not null);
    CREATE TABLE revlog (id integer primary key, cid integer not null, usn integer not null, ease integer not null, ivl integer not null, lastIvl integer not null, factor integer not null, time integer not null, type integer not null);
    CREATE TABLE graves (usn integer not null, oid integer not null, type integer not null);
    CREATE INDEX ix_notes_usn on notes (usn);
    CREATE INDEX ix_cards_usn on cards (usn);
    CREATE INDEX ix_revlog_usn on revlog (usn);
    CREATE INDEX ix_cards_nid on cards (nid);
    CREATE INDEX ix_cards_sched on cards (did, queue, due);
    CREATE INDEX ix_revlog_cid on revlog (cid);
    CREATE INDEX ix_notes_csum on notes (csum);
  `;

  // Ids fijos para que Anki reconozca nuestros tipos de nota en importaciones sucesivas.
  const MODEL_IDS = { basic: 1731000000001, reverse: 1731000000002, cloze: 1731000000003 };
  const MODEL_CSS = '.card { font-family: arial; font-size: 20px; text-align: center; color: black; background-color: white; }\n.cloze { font-weight: bold; color: blue; }\n.nightMode .cloze { color: lightblue; }';
  const LATEX_PRE = '\\documentclass[12pt]{article}\n\\special{papersize=3in,5in}\n\\usepackage[utf8]{inputenc}\n\\usepackage{amssymb,amsmath}\n\\pagestyle{empty}\n\\setlength{\\parindent}{0in}\n\\begin{document}\n';

  function modelJson(id, name, type, fieldNames, tmpls, nowS) {
    return {
      id, name, type, mod: nowS, usn: -1, sortf: 0, did: 1,
      tmpls: tmpls.map(([tn, qfmt, afmt], ord) => ({ name: tn, ord, qfmt, afmt, did: null, bqfmt: '', bafmt: '' })),
      flds: fieldNames.map((f, ord) => ({ name: f, ord, sticky: false, rtl: false, font: 'Arial', size: 20, media: [] })),
      css: MODEL_CSS, latexPre: LATEX_PRE, latexPost: '\\end{document}', latexsvg: false,
      req: tmpls.map((t, i) => [i, 'any', [type === 1 ? 0 : i]]),
      tags: [], vers: []
    };
  }

  function deckJson(id, name, nowS) {
    return {
      id, name, mod: nowS, usn: -1, desc: '', dyn: 0, conf: 1, collapsed: false, browserCollapsed: false,
      extendNew: 0, extendRev: 0, newToday: [0, 0], revToday: [0, 0], lrnToday: [0, 0], timeToday: [0, 0]
    };
  }

  const DCONF = {
    1: {
      id: 1, name: 'Default', mod: 0, usn: 0, maxTaken: 60, autoplay: true, timer: 0, replayq: true, dyn: false,
      new: { delays: [1, 10], ints: [1, 4, 7], initialFactor: 2500, order: 1, perDay: 20, bury: false, separate: true },
      lapse: { delays: [10], mult: 0, minInt: 1, leechFails: 8, leechAction: 1 },
      rev: { perDay: 200, ease4: 1.3, fuzz: 0.05, minSpace: 1, ivlFct: 1, maxIvl: 36500, bury: false, hardFactor: 1.2 }
    }
  };

  /**
   * @param {number|null} deckId  mazo a exportar (con submazos) o null para todo
   */
  A.exportApkg = async (deckId, { includeProgress = true } = {}) => {
    await ensureLibs();
    const deckIds = deckId ? S.deckFamilyIds(deckId) : new Set(S.decks().map((d) => d.id));
    const cards = S.allCards().filter((c) => deckIds.has(c.deckId));
    const noteIds = new Set(cards.map((c) => c.noteId));
    const notes = S.allNotes().filter((n) => noteIds.has(n.id));
    if (!notes.length) throw new Error('No hay tarjetas que exportar en este mazo.');

    const now = Date.now();
    const nowS = Math.floor(now / 1000);
    const crtTs = U.dayStart(0, new Date(2020, 0, 1, 12).getTime());
    const crtDay = U.dayIndex(crtTs);

    const models = {
      [MODEL_IDS.basic]: modelJson(MODEL_IDS.basic, `${App.config.appName} Básica`, 0, ['Anverso', 'Reverso'],
        [['Tarjeta 1', '{{Anverso}}', '{{FrontSide}}\n\n<hr id=answer>\n\n{{Reverso}}']], nowS),
      [MODEL_IDS.reverse]: modelJson(MODEL_IDS.reverse, `${App.config.appName} Básica y reverso`, 0, ['Anverso', 'Reverso'], [
        ['Tarjeta 1', '{{Anverso}}', '{{FrontSide}}\n\n<hr id=answer>\n\n{{Reverso}}'],
        ['Tarjeta 2', '{{Reverso}}', '{{FrontSide}}\n\n<hr id=answer>\n\n{{Anverso}}']
      ], nowS),
      [MODEL_IDS.cloze]: modelJson(MODEL_IDS.cloze, `${App.config.appName} Rellenar huecos`, 1, ['Texto', 'Extra'],
        [['Cloze', '{{cloze:Texto}}', '{{cloze:Texto}}<br>\n{{Extra}}']], nowS)
    };

    const decksOut = { 1: deckJson(1, 'Default', nowS) };
    for (const id of deckIds) decksOut[id] = deckJson(id, S.deck(id).name, nowS);

    let maxPos = 0;
    cards.forEach((c) => { if (c.position > maxPos) maxPos = c.position; });
    const conf = {
      activeDecks: [1], curDeck: 1, newSpread: 0, collapseTime: 1200, timeLim: 0, estTimes: true, dueCounts: true,
      curModel: null, nextPos: maxPos + 1, sortType: 'noteFld', sortBackwards: false, addToCur: true
    };

    const db = new SQL.Database();
    try {
      db.run(SCHEMA);
      db.run('INSERT INTO col VALUES (1,?,?,?,11,0,0,0,?,?,?,?,?)', [
        Math.floor(crtTs / 1000), now, now, JSON.stringify(conf), JSON.stringify(models),
        JSON.stringify(decksOut), JSON.stringify(DCONF), '{}'
      ]);

      const mediaRefs = new Set();
      db.run('BEGIN');
      const insNote = db.prepare('INSERT INTO notes VALUES (?,?,?,?,?,?,?,?,?,?,?)');
      for (const n of notes) {
        const flds = n.type === 'cloze' ? [n.fields.text || '', n.fields.extra || ''] : [n.fields.front || '', n.fields.back || ''];
        flds.forEach((f) => C.mediaRefs(f).forEach((r) => mediaRefs.add(r)));
        const sfld = U.stripHtml(flds[0]);
        const tags = (n.tags || []).length ? ` ${n.tags.join(' ')} ` : '';
        insNote.run([n.id, n.guid, MODEL_IDS[n.type], Math.floor(n.mod / 1000), -1, tags, flds.join('\x1f'), sfld, await U.ankiChecksum(sfld), 0, '']);
      }
      insNote.free();

      const insCard = db.prepare('INSERT INTO cards VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)');
      for (const c of cards) {
        let type = 0, queue = 0, due = c.position, ivl = 0, factor = 0;
        if (includeProgress && (c.state === 'review' || c.state === 'relearning') && c.interval > 0) {
          type = 2; queue = 2; ivl = c.interval; factor = Math.round((c.ease || 2.5) * 1000);
          due = c.state === 'review' ? U.dayIndex(c.due) - crtDay : U.dayIndex(now) - crtDay;
        }
        if (c.suspended) queue = -1;
        insCard.run([c.id, c.noteId, c.deckId, c.ord, Math.floor(c.mod / 1000), -1, type, queue, due, ivl, factor,
          includeProgress ? c.reps || 0 : 0, includeProgress ? c.lapses || 0 : 0, 0, 0, 0, 0, '']);
      }
      insCard.free();
      db.run('COMMIT');

      const zip = new window.JSZip();
      zip.file('collection.anki2', db.export());
      const mediaIndex = {};
      let i = 0;
      for (const name of mediaRefs) {
        const blob = S.mediaBlob(name);
        if (!blob) continue;
        zip.file(String(i), blob);
        mediaIndex[i] = name;
        i++;
      }
      zip.file('media', JSON.stringify(mediaIndex));
      const out = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
      const name = deckId ? S.deck(deckId).name.split('::').pop() : `${App.config.appName} - todo`;
      U.download(out, `${U.safeFilename(name)}.apkg`);
      return { notes: notes.length, cards: cards.length, media: i };
    } finally {
      db.close();
    }
  };
})(window.App);

</script>
  <script>
/* Componentes de interfaz reutilizables: cabecera, diálogos, avisos, iconos. */
(function (App) {

  const $ = (sel, el = document) => el.querySelector(sel);

  UI.icons = {
    back: svg('<path d="M15 18l-6-6 6-6"/>'),
    settings: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    more: svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'),
    upload: svg('<path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>'),
    download: svg('<path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>'),
    edit: svg('<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
    trash: svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
    undo: svg('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
    check: svg('<path d="M20 6L9 17l-5-5"/>'),
    play: svg('<path d="M7 4l13 8-13 8z"/>'),
    list: svg('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
    folder: svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
    image: svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>'),
    cards: svg('<rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>')
  };

  // ---------- Cabecera ----------
  UI.setHeader = ({ title = App.config.appName, back = null, actions = [] } = {}) => {
    const backBtn = $('#hdr-back');
    backBtn.innerHTML = UI.icons.back;
    backBtn.hidden = !back;
    backBtn.onclick = () => {
      if (back === 'history') history.length > 1 ? history.back() : (location.hash = '#/');
      else location.hash = back;
    };
    $('#hdr-title').textContent = title;
    document.title = title === App.config.appName ? title : `${title} · ${App.config.appName}`;
    const box = $('#hdr-actions');
    box.innerHTML = '';
    for (const a of actions) {
      const b = document.createElement('button');
      b.className = 'icon-btn';
      b.title = a.label;
      b.setAttribute('aria-label', a.label);
      b.innerHTML = UI.icons[a.icon] || '';
      if (a.id) b.id = a.id;
      b.onclick = a.onClick;
      box.appendChild(b);
    }
  };

  UI.render = (html) => {
    const v = $('#view');
    v.innerHTML = html;
    window.scrollTo(0, 0);
    return v;
  };

  // Funciones a ejecutar al salir de la vista actual (p. ej. quitar atajos de teclado).
  let cleanups = [];
  UI.onLeave = (fn) => cleanups.push(fn);
  UI.runCleanups = () => {
    cleanups.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
    cleanups = [];
  };

  // ---------- Avisos ----------
  /** Aviso breve. action: { label, onClick } añade un botón (p. ej. «Deshacer»). */
  UI.toast = (msg, ms = 2600, action = null) => {
    const t = $('#toast');
    // Vaciar y reescribir en el siguiente ciclo: así el lector anuncia también un mensaje repetido.
    t.textContent = '';
    t.classList.toggle('has-action', !!action);
    clearTimeout(t._a);
    t._a = setTimeout(() => {
      t.textContent = msg;
      if (action) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'toast-action';
        b.textContent = action.label;
        b.onclick = () => {
          clearTimeout(t._h);
          t.classList.remove('show', 'has-action');
          t.textContent = '';
          action.onClick();
        };
        t.append(' ', b);
      }
    }, 60);
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show', 'has-action'), ms);
  };

  /** Plural en español: UI.plural(1, 'tarjeta') → «1 tarjeta»; UI.plural(2, 'mazo') → «2 mazos». */
  UI.plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
  /** Minutos legibles: «<1 min» por debajo del minuto. */
  UI.fmtMin = (ms) => (ms < 60000 ? '<1 min' : `${Math.round(ms / 60000)} min`);

  /** Capa «trabajando…»: se anuncia (role=status), marca la vista como ocupada,
   *  deja inerte lo de detrás y devuelve el foco al cerrarse. */
  UI.busy = (msg = 'Cargando…') => {
    const box = $('#busy');
    const behind = ['.topbar', '#view'].map((s) => $(s)).filter(Boolean);
    const prev = document.activeElement;
    // El texto se escribe tras mostrar la capa: así la región viva lo anuncia.
    $('#busy-msg').textContent = '';
    box.hidden = false;
    let current = msg;
    setTimeout(() => { if (!box.hidden) $('#busy-msg').textContent = current; }, 50);
    behind.forEach((el) => { el.inert = true; });
    $('#view').setAttribute('aria-busy', 'true');
    const panel = box.querySelector('.busy-box');
    if (panel) panel.focus({ preventScroll: true });
    return {
      close: () => {
        box.hidden = true;
        behind.forEach((el) => { el.inert = false; });
        $('#view').removeAttribute('aria-busy');
        // Devolver el foco a donde estaba (o a la vista, si era el cuerpo o ya no existe).
        const back = prev && prev !== document.body && prev.isConnected && typeof prev.focus === 'function' ? prev : $('#view');
        back.focus({ preventScroll: true });
      },
      update: (m) => { current = m; $('#busy-msg').textContent = m; }
    };
  };

  // ---------- Diálogos ----------
  // Un único <dialog id="modal"> compartido. Cada apertura es una «sesión» que se cierra
  // siempre por session.close(): cierra el diálogo, lo vacía y resuelve en el acto (sin
  // esperar al evento «close», que llega tarde o no llega si la página no se está pintando).
  // Así la acción elegida corre exactamente una vez, justo al cerrar, aunque otro diálogo
  // se abra a continuación. Si se abre otro antes de terminar, el anterior se resuelve como
  // cancelado; un «close» rezagado de una sesión previa se ignora.
  let activeDialog = null;
  function openDialog(html, onFinish) {
    const dlg = $('#modal');
    if (activeDialog) activeDialog.close();
    else if (dlg.open) dlg.close();
    dlg.innerHTML = html;
    let done = false;
    const session = {
      close: () => {
        if (done) return;
        done = true;
        if (activeDialog === session) activeDialog = null;
        if (dlg.open) dlg.close();
        dlg.innerHTML = '';
        onFinish();
      }
    };
    activeDialog = session;
    dlg.onclick = (e) => { if (e.target === dlg) session.close(); };
    dlg.oncancel = (e) => { e.preventDefault(); session.close(); }; // Escape
    dlg.onclose = () => { if (!dlg.open && activeDialog === session) session.close(); }; // cierre externo
    dlg.setAttribute('aria-labelledby', 'modal-title');
    dlg.showModal();
    return { dlg, session };
  }
  /** Cierra el diálogo abierto (como «Cancelar»). */
  UI.closeDialog = () => { if (activeDialog) activeDialog.close(); };

  /**
   * actions: [{ label, value, primary, danger, collect(dlg), validate(dlg) → mensaje|'' }]
   * El primer botón primario es el que se activa con Enter (y queda a la derecha).
   * Si una acción es destructiva (danger) o se pide focusSafe, el foco inicial va al botón
   * seguro. Enter dentro de un campo nunca dispara una acción destructiva: el diálogo sigue
   * abierto, el foco pasa al botón (si ya está activo) y una línea explica qué falta.
   * validate: si devuelve un mensaje, el diálogo no se cierra (el mensaje lo muestra quien valida).
   */
  UI.modal = ({ title, body = '', actions = [{ label: 'Cerrar', value: null }], onOpen, focusSafe = false } = {}) =>
    new Promise((resolve) => {
      const ordered = [...actions].sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0));
      const danger = actions.find((a) => a.danger);
      let result = null;
      const { dlg, session } = openDialog(`
        <form method="dialog" class="modal">
          <h2 id="modal-title">${U.esc(title)}</h2>
          <div class="modal-body">${body}</div>
          ${danger ? '<p class="modal-enter-hint" id="modal-enter-hint" role="status" aria-live="polite"></p>' : ''}
          <div class="modal-actions">
            ${ordered.map((a) => `<button value="${actions.indexOf(a)}" class="btn ${a.primary ? 'btn-primary' : ''} ${a.danger ? 'btn-danger' : ''}" ${a.primary ? '' : 'formnovalidate'}>${U.esc(a.label)}</button>`).join('')}
          </div>
        </form>`, () => resolve(result));
      const form = dlg.querySelector('form');
      const dangerBtn = danger ? form.querySelector(`.modal-actions [value="${actions.indexOf(danger)}"]`) : null;
      const hint = form.querySelector('#modal-enter-hint');
      if (danger) {
        // Enter en un campo de un diálogo destructivo: no se envía ni se cierra.
        form.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' || !(e.target instanceof HTMLInputElement)) return;
          e.preventDefault();
          if (dangerBtn && !dangerBtn.disabled) {
            hint.textContent = `Pulsa «${danger.label}» para confirmar.`;
            dangerBtn.focus();
          } else {
            hint.textContent = `Completa el campo para activar «${danger.label}».`;
          }
        });
      }
      form.onsubmit = (e) => {
        const idx = e.submitter ? +e.submitter.value : actions.findIndex((a) => a.primary);
        const a = actions[idx];
        // Envío implícito: nunca ejecuta una acción destructiva (y no cierra el diálogo).
        e.preventDefault(); // el cierre lo hace la sesión, no el formulario
        if (!e.submitter && a && a.danger) return;
        const msg = a && a.validate ? a.validate(dlg) : '';
        if (msg) return;
        result = a ? (a.collect ? a.collect(dlg) : a.value) : null;
        session.close();
      };
      if (danger || focusSafe) {
        const btns = [...dlg.querySelectorAll('.modal-actions .btn')];
        const safe = btns.find((b) => !actions[+b.value].danger && !actions[+b.value].primary)
          || btns.find((b) => !actions[+b.value].danger);
        if (safe) safe.focus();
      }
      if (onOpen) onOpen(dlg);
    });

  UI.alert = (title, message) => UI.modal({ title, body: `<p>${U.esc(message)}</p>`, actions: [{ label: 'Entendido', value: true, primary: true }] });

  /** opts: { focusSafe } — empezar en «Cancelar» aunque la acción no sea destructiva. */
  UI.confirm = async (title, message, okLabel = 'Aceptar', danger = false, opts = {}) =>
    (await UI.modal({
      title,
      body: `<p>${U.esc(message)}</p>`,
      focusSafe: !!opts.focusSafe,
      actions: [{ label: okLabel, value: true, primary: true, danger }, { label: 'Cancelar', value: false }]
    })) === true;

  /** opts: { okLabel, hint, validate(valor) → mensaje|'', caretEnd }
   *  validate: si devuelve un mensaje, el diálogo sigue abierto, el campo queda marcado
   *  (aria-invalid) y el mensaje se lee junto a él. caretEnd: cursor al final en vez de
   *  seleccionar el texto (p. ej. «Padre::» ya escrito). */
  UI.prompt = (title, label, value = '', placeholder = '', opts = {}) => {
    const described = [opts.hint ? 'prompt-hint' : '', 'prompt-err'].filter(Boolean).join(' ');
    return UI.modal({
      title,
      body: `<label class="field"><span>${U.esc(label)}</span><input name="v" value="${U.esc(value)}" placeholder="${U.esc(placeholder)}" required autocomplete="off" aria-describedby="${described}">`
        + (opts.hint ? `<small class="field-hint" id="prompt-hint">${U.esc(opts.hint)}</small>` : '')
        + '<small class="field-error" id="prompt-err" aria-live="polite"></small></label>',
      actions: [
        {
          label: opts.okLabel || 'Aceptar', primary: true,
          validate: (d) => {
            const input = d.querySelector('[name=v]');
            const msg = opts.validate ? opts.validate(input.value.trim()) || '' : '';
            d.querySelector('#prompt-err').textContent = msg;
            if (msg) { input.setAttribute('aria-invalid', 'true'); input.focus(); } else input.removeAttribute('aria-invalid');
            return msg;
          },
          collect: (d) => d.querySelector('[name=v]').value.trim()
        },
        { label: 'Cancelar', value: null }
      ],
      onOpen: (d) => {
        const i = d.querySelector('input');
        i.focus();
        if (opts.caretEnd) i.setSelectionRange(i.value.length, i.value.length); else i.select();
        i.addEventListener('input', () => {
          if (!i.hasAttribute('aria-invalid')) return;
          i.removeAttribute('aria-invalid');
          d.querySelector('#prompt-err').textContent = '';
        });
      }
    });
  };

  /** Menú de opciones (hoja de acciones). items: [{label, icon, danger, onClick} | { divider: true }] */
  UI.sheet = (title, items) => {
    let chosen = null;
    const { dlg, session } = openDialog(`
      <div class="modal sheet">
        <h2 id="modal-title">${U.esc(title)}</h2>
        <div class="sheet-list">
          ${items.map((it, i) => it.divider ? '<hr class="sheet-sep">'
            : `<button type="button" class="sheet-item ${it.danger ? 'danger' : ''}" data-i="${i}">${UI.icons[it.icon] || ''}<span>${U.esc(it.label)}</span></button>`).join('')}
        </div>
        <div class="modal-actions"><button type="button" class="btn" data-close>Cancelar</button></div>
      </div>`, () => { if (chosen) chosen.onClick(); });
    dlg.querySelectorAll('.sheet-item').forEach((b) => (b.onclick = () => { chosen = items[+b.dataset.i]; session.close(); }));
    dlg.querySelector('[data-close]').onclick = () => session.close();
  };

  /** Abre el selector de archivos; resuelve null si se cancela (evento «cancel» o,
   *  en navegadores sin él, al volver el foco a la ventana sin archivo elegido). */
  UI.pickFile = (accept) => new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    let done = false;
    const finish = (file) => {
      if (done) return;
      done = true;
      window.removeEventListener('focus', onFocus);
      resolve(file);
    };
    const onFocus = () => setTimeout(() => finish(input.files[0] || null), 500);
    input.onchange = () => finish(input.files[0] || null);
    input.addEventListener('cancel', () => finish(null));
    window.addEventListener('focus', onFocus);
    input.click();
  });

  // Cada contador lleva su nombre accesible ("6 nuevas") y la cola actual se marca con aria-current.
  // Opción { labels: true }: etiqueta visible y discreta junto a cada cifra (pantalla de estudio).
  // Lo visible va con aria-hidden; el lector de pantalla solo lee el texto oculto ("6 nuevas").
  UI.countsHtml = (c, active, opts = {}) => {
    const item = (cls, n, key, label, title, short) => {
      const on = active === key;
      return `<span role="listitem" class="${cls} ${n ? '' : 'zero'} ${on ? 'active' : ''}" title="${title}"${on ? ' aria-current="true"' : ''}>`
        + `<span class="count-n" aria-hidden="true">${n}</span>`
        + (opts.labels ? `<span class="count-label" aria-hidden="true">${short}</span>` : '')
        + `<span class="visually-hidden">${n} ${label}${on ? ' (actual)' : ''}</span></span>`;
    };
    return `
    <span class="counts${opts.labels ? ' counts-labeled' : ''}" role="list" aria-label="Tarjetas pendientes">
      ${item('c-new', c.new, 'new', 'nuevas', 'Nuevas', 'nuevas')}
      ${item('c-learn', c.learn, 'learn', 'en aprendizaje', 'Aprendiendo', 'aprendiendo')}
      ${item('c-due', c.review, 'review', 'por repasar', 'Por repasar', 'repaso')}
    </span>`;
  };

  UI.applyTheme = () => {
    const t = App.store.settings().theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    else delete document.documentElement.dataset.theme;
  };
})(window.App);

</script>
  <script>
/* Pantallas: inicio (lista de mazos) y detalle de mazo. Acciones de importar/exportar. */
(function (App) {
  'use strict';
  const U = App.util, S = App.store, UI = App.ui;
  const V = App.views;

  const pendingOf = (c) => c.new + c.learn + c.review;
  const SUBDECK_HINT = 'Para un submazo, usa «Padre::Hijo»';
  const UNDO_MS = 8000;

  // ---------- Borrado con «Deshacer» ----------
  // El mazo se oculta al instante y se borra de verdad pasados UNDO_MS, al salir del
  // inicio o al cerrar la página. «Deshacer» cancela el borrado: nada llega a escribirse.
  App.session = App.session || {};
  const pendingDel = (App.session.pendingDeckDeletes = App.session.pendingDeckDeletes || new Map()); // id → timer
  const deleting = new Set();                                                                         // ids en curso
  const isPendingDelete = (id) => pendingDel.has(id) || deleting.has(id);
  /** Ids ocultos: los mazos pendientes de borrar y todos sus submazos. */
  function hiddenIds() {
    const out = new Set();
    for (const id of [...pendingDel.keys(), ...deleting]) for (const x of S.deckFamilyIds(id)) out.add(x);
    return out;
  }
  async function commitDelete(id) {
    if (!pendingDel.has(id)) return;
    clearTimeout(pendingDel.get(id));
    pendingDel.delete(id);
    deleting.add(id);
    try { if (S.deck(id)) await S.deleteDeck(id); } finally { deleting.delete(id); }
  }
  const commitAllDeletes = () => Promise.all([...pendingDel.keys()].map(commitDelete));
  V.commitPendingDeletes = commitAllDeletes;
  const onHome = () => location.hash === '' || location.hash === '#/' || location.hash === '#';
  window.addEventListener('hashchange', () => { if (!onHome()) commitAllDeletes(); });
  window.addEventListener('pagehide', () => { commitAllDeletes(); });

  // ---------- Plegado de submazos (recordado en este dispositivo) ----------
  const FOLD_KEY = 'recallo.collapsedDecks';
  const readFolded = () => { try { return new Set(JSON.parse(localStorage.getItem(FOLD_KEY) || '[]')); } catch { return new Set(); } };
  const saveFolded = (set) => { try { localStorage.setItem(FOLD_KEY, JSON.stringify([...set])); } catch { /* sin almacenamiento */ } };

  // ---------- Nombres de mazo ----------
  /** Mensaje de error para un nombre, o '' si vale. except: el nombre actual (al renombrar). */
  const deckNameError = (v, except = null) => {
    if (!v) return 'Escribe un nombre.';
    if (v.split('::').some((p) => !p.trim())) return 'Cada parte del nombre necesita texto, por ejemplo «Padre::Hijo».';
    if (v !== except && S.deckByName(v)) return 'Ya existe un mazo con ese nombre.';
    return '';
  };

  // ---------- Filas de la lista ----------
  /** Cabecera de columnas: etiquetas una sola vez, alineadas sobre las cifras.
   *  En pantallas estrechas se muestra una sola columna, «pendientes». */
  const countHead = (withMore, withSlot) => `
    <div class="count-head${withMore ? ' with-more' : ''}${withSlot ? ' with-slot' : ''}" aria-hidden="true">
      <span class="count-cols"><span>nuevas</span><span>aprendiendo</span><span>repaso</span></span>
      <span class="count-cols-total"><span>pendientes</span></span>
    </div>`;

  /** Nombre accesible de una fila: el nombre corto y, si es submazo, de quién cuelga. */
  const rowName = (d) => {
    const parts = d.name.split('::');
    const parent = parts.length > 1 ? parts[parts.length - 2] : '';
    return `<span class="deck-name">${U.esc(S.shortName(d))}${parent ? `<span class="visually-hidden">, submazo de ${U.esc(parent)}</span>` : ''}</span>`;
  };

  /** Cifras de una fila: reparto en 3 columnas (pantallas anchas) o total pendiente
   *  (estrechas); un mazo sin tarjetas dice «vacío» en lugar de «0 0 0». */
  const rowCounts = (d, c) => {
    if (!S.deckCardCount(d.id)) return '<span class="count-empty">vacío</span>';
    const n = pendingOf(c);
    return `${UI.countsHtml(c, null)}<span class="count-total${n ? '' : ' zero'}"><span aria-hidden="true">${n}</span><span class="visually-hidden">${n} pendientes</span></span>`;
  };

  /** Error comprensible con un paso siguiente; el detalle técnico queda plegado. */
  const failDialog = (title, message, err) => UI.modal({
    title,
    body: `<p>${U.esc(message)}</p>
      <details class="tech-detail"><summary>Detalle técnico</summary><code>${U.esc((err && err.message) || String(err))}</code></details>`,
    actions: [{ label: 'Entendido', value: true, primary: true }]
  });

  // ---------- Inicio ----------
  V.home = () => {
    UI.setHeader({
      title: App.config.appName,
      actions: [
        { icon: 'list', label: 'Todas las notas', onClick: () => (location.hash = '#/browse/all') },
        { icon: 'settings', label: 'Ajustes', onClick: () => (location.hash = '#/settings') }
      ]
    });

    const hidden = hiddenIds();
    const decks = S.decks().filter((d) => !hidden.has(d.id));
    const roots = decks.filter((d) => !d.name.includes('::'));
    const total = { new: 0, learn: 0, review: 0 };
    const counts = new Map();
    for (const d of decks) counts.set(d.id, S.studyState(d.id).counts);
    for (const r of roots) { const c = counts.get(r.id); total.new += c.new; total.learn += c.learn; total.review += c.review; }
    const today = S.todayStats();
    const pending = pendingOf(total);

    // «Estudiar»: el mazo raíz con más tarjetas pendientes (si hay varios con pendientes, se nombra).
    const withPending = roots.map((r) => ({ deck: r, n: pendingOf(counts.get(r.id)) })).filter((x) => x.n > 0)
      .sort((a, b) => b.n - a.n);
    const target = withPending[0];
    const cta = target ? `
        <a class="btn btn-primary btn-lg btn-block today-cta" href="#/study/${target.deck.id}">${UI.icons.play}<span>Estudiar${withPending.length > 1
          ? ` <span class="cta-deck">${U.esc(S.shortName(target.deck))}</span>` : ''} · ${target.n}</span></a>` : '';

    // Plegado: un mazo con submazos lleva un botón; los descendientes de uno plegado se ocultan.
    const folded = readFolded();
    const hasKids = (d) => decks.some((o) => o.name.startsWith(d.name + '::'));

    const rows = decks.map((d) => {
      const depth = d.name.split('::').length - 1;
      const kids = hasKids(d);
      const isFolded = kids && folded.has(d.id);
      const short = U.esc(S.shortName(d));
      return `
        <li class="deck-row ${depth ? 'is-child' : 'is-root'}" style="--depth:${depth}" data-id="${d.id}"${underFoldedNow(d, folded, decks) ? ' hidden' : ''}>
          <span class="deck-slot">${kids ? `<button type="button" class="deck-toggle" data-id="${d.id}" aria-expanded="${!isFolded}" aria-label="${isFolded ? 'Mostrar' : 'Ocultar'} submazos de ${short}">${UI.icons.back}</button>` : ''}</span>
          <a href="#/deck/${d.id}" class="deck-link">
            ${rowName(d)}
            ${rowCounts(d, counts.get(d.id))}
          </a>
          <button class="icon-btn deck-more" data-id="${d.id}" aria-label="Opciones de ${short}">${UI.icons.more}</button>
        </li>`;
    }).join('');

    const summary = `
      <section class="summary today" aria-labelledby="today-h">
        <p class="eyebrow" id="today-h">Hoy</p>
        <p class="summary-main">${pending
          ? `<strong class="summary-num">${pending}</strong> ${pending === 1 ? 'tarjeta pendiente' : 'tarjetas pendientes'}`
          : 'Estás al día'}</p>
        <p class="muted summary-sub">${today.reviews
          ? `${UI.plural(today.reviews, 'repaso hecho', 'repasos hechos')} · ${UI.fmtMin(today.timeMs)}`
          : 'Aún no has estudiado hoy'}</p>
        ${pending ? UI.countsHtml(total, null, { labels: true }) : ''}
        ${cta}
      </section>`;

    UI.render(decks.length ? `
      ${summary}

      <div class="list-head deck-head">
        <h2 id="decks-h">Mazos</h2>
        <div class="list-actions">
          <button class="btn btn-quiet" id="btn-new-deck">${UI.icons.folder}<span>Nuevo mazo</span></button>
          <button class="btn btn-quiet" id="btn-import">${UI.icons.upload}<span>Importar</span></button>
        </div>
      </div>
      ${countHead(true, true)}
      <ul class="deck-list has-slot" aria-labelledby="decks-h">${rows}</ul>

      <div class="bottom-bar home-bar">
        <div class="bottom-bar-inner">
          <a class="btn btn-paper btn-block" id="btn-add" href="#/add">${UI.icons.plus}<span>Añadir tarjeta</span></a>
        </div>
      </div>` : `
      <div class="empty home-empty">
        ${UI.icons.cards}
        <h2>Aún no tienes mazos</h2>
        <p>Crea tu primer mazo o importa uno de Anki.</p>
        <div class="empty-actions">
          <button class="btn btn-primary" id="btn-new-deck">${UI.icons.folder}<span>Nuevo mazo</span></button>
          <button class="btn" id="btn-import">${UI.icons.upload}<span>Importar de Anki</span></button>
        </div>
      </div>`);

    document.querySelectorAll('.deck-more').forEach((b) => (b.onclick = () => V.deckMenu(S.deck(+b.dataset.id))));
    document.querySelectorAll('.deck-toggle').forEach((b) => (b.onclick = () => {
      const id = +b.dataset.id;
      const set = readFolded();
      const fold = !set.has(id);
      if (fold) set.add(id); else set.delete(id);
      saveFolded(set);
      const d = S.deck(id);
      b.setAttribute('aria-expanded', String(!fold));
      b.setAttribute('aria-label', `${fold ? 'Mostrar' : 'Ocultar'} submazos de ${S.shortName(d)}`);
      // Mostrar u ocultar descendientes sin repintar (el foco se queda en el botón).
      const byId = new Map(decks.map((x) => [x.id, x]));
      document.querySelectorAll('.deck-list .deck-row').forEach((li) => {
        const x = byId.get(+li.dataset.id);
        if (x && x.name.startsWith(d.name + '::')) li.hidden = underFoldedNow(x, set, decks);
      });
    }));
    UI.$('#btn-new-deck').onclick = () => V.newDeck();
    UI.$('#btn-import').onclick = V.importFlow;
  };
  function underFoldedNow(d, set, decks) {
    const parts = d.name.split('::');
    for (let i = 1; i < parts.length; i++) {
      const anc = decks.find((o) => o.name === parts.slice(0, i).join('::'));
      if (anc && set.has(anc.id)) return true;
    }
    return false;
  }

  /** Nuevo mazo; con parent, nuevo submazo con «Padre::» ya escrito. */
  V.newDeck = async (parent = null) => {
    const prefix = parent ? parent.name + '::' : '';
    const name = await UI.prompt(parent ? 'Nuevo submazo' : 'Nuevo mazo', 'Nombre', prefix, parent ? '' : 'Ej.: Biología', {
      okLabel: parent ? 'Crear submazo' : 'Crear mazo',
      hint: parent ? `Dentro de «${parent.name.replace(/::/g, ' › ')}»` : SUBDECK_HINT,
      caretEnd: !!parent,
      validate: (v) => (parent && v === parent.name + '::' ? 'Escribe el nombre del submazo después de «::».' : deckNameError(v))
    });
    if (!name) return;
    const d = await S.ensureDeck(name);
    location.hash = `#/deck/${d.id}`;
  };

  /** Menú de un mazo. compact: el del detalle de mazo (sin lo que ya está a la vista). */
  V.deckMenu = (deck, { compact = false } = {}) => {
    const n = pendingOf(S.studyState(deck.id).counts);
    const manage = [
      { label: 'Renombrar', icon: 'edit', onClick: () => V.renameDeck(deck) },
      { label: 'Nuevo submazo', icon: 'folder', onClick: () => V.newDeck(deck) },
      { label: 'Exportar a Anki (.apkg)', icon: 'download', onClick: () => V.exportFlow(deck.id) },
      { divider: true },
      { label: 'Eliminar mazo', icon: 'trash', danger: true, onClick: () => V.deleteDeck(deck) }
    ];
    UI.sheet(deck.name.replace(/::/g, ' › '), compact ? manage : [
      { label: n ? `Estudiar · ${n}` : 'Estudiar', icon: 'play', onClick: () => (location.hash = `#/study/${deck.id}`) },
      { label: 'Añadir tarjeta', icon: 'plus', onClick: () => (location.hash = `#/add/${deck.id}`) },
      { label: 'Ver tarjetas', icon: 'list', onClick: () => (location.hash = `#/browse/${deck.id}`) },
      ...manage
    ]);
  };

  V.renameDeck = async (deck) => {
    const name = await UI.prompt('Renombrar mazo', 'Nombre', deck.name, '', {
      okLabel: 'Renombrar', hint: SUBDECK_HINT, validate: (v) => deckNameError(v, deck.name)
    });
    if (!name || name === deck.name) return;
    try {
      await S.renameDeck(deck.id, name);
      App.refresh();
    } catch (e) {
      UI.toast(e.message);
    }
  };

  V.deleteDeck = async (deck) => {
    const n = S.deckCardCount(deck.id);
    const ok = await UI.confirm('Eliminar mazo',
      `Se eliminará «${deck.name}»${n ? `, sus submazos y ${UI.plural(n, 'tarjeta')}` : ''}. Podrás deshacerlo durante unos segundos.`,
      'Eliminar', true);
    if (!ok) return;
    // Borrado diferido: se oculta ya y se escribe pasados UNDO_MS (o al salir del inicio).
    if (pendingDel.has(deck.id)) clearTimeout(pendingDel.get(deck.id));
    pendingDel.set(deck.id, setTimeout(() => { commitDelete(deck.id); }, UNDO_MS));
    const short = S.shortName(deck);
    if (onHome()) App.refresh(); else location.hash = '#/';
    UI.toast(`«${short}» eliminado`, UNDO_MS, {
      label: 'Deshacer',
      onClick: () => {
        if (!pendingDel.has(deck.id)) return UI.toast('Ya no se puede deshacer');
        clearTimeout(pendingDel.get(deck.id));
        pendingDel.delete(deck.id);
        if (onHome()) App.refresh();
        UI.toast(`«${short}» recuperado`);
      }
    });
  };

  // ---------- Detalle de mazo ----------
  V.deck = (deckId) => {
    const deck = S.deck(deckId);
    if (!deck || isPendingDelete(deckId)) return void (location.hash = '#/');
    const parts = deck.name.split('::');
    const parent = parts.length > 1 ? S.deckByName(parts.slice(0, -1).join('::')) : null;
    UI.setHeader({
      title: S.shortName(deck),
      back: parent ? `#/deck/${parent.id}` : '#/',
      actions: [{ icon: 'more', label: 'Opciones del mazo', onClick: () => V.deckMenu(deck, { compact: true }) }]
    });

    const { card, state } = S.nextCard(deckId);
    const c = state.counts;
    const pending = pendingOf(c);
    const total = S.deckCardCount(deckId);
    const children = S.decks().filter((d) => d.name.startsWith(deck.name + '::') && d.name.split('::').length === parts.length + 1);

    // El título ya está en la cabecera: el bloque principal abre con el estado de hoy.
    let headline, body;
    if (card) {
      headline = `${UI.plural(pending, 'tarjeta')} para hoy`;
      body = `<a class="btn btn-primary btn-lg btn-block" href="#/study/${deckId}">${UI.icons.play}<span>Estudiar · ${pending}</span></a>`;
    } else if (!total) {
      headline = 'Mazo vacío';
      body = `<div class="done-msg"><p>Este mazo aún no tiene tarjetas.</p>
        <a class="btn btn-primary" href="#/add/${deckId}">${UI.icons.plus}<span>Añadir tarjeta</span></a></div>`;
    } else if (state.learnLater.length) {
      const k = state.learnLater.length;
      headline = 'Pausa breve';
      body = `<p class="done-msg">${k === 1 ? 'Queda 1 tarjeta en aprendizaje; vuelve' : `Quedan ${k} tarjetas en aprendizaje; la primera vuelve`} en ${U.esc(U.fmtMinutes((state.learnLater[0].due - Date.now()) / 60000))}.</p>`;
    } else {
      headline = 'Al día';
      body = '<p class="done-msg">No quedan tarjetas para hoy en este mazo.</p>';
    }

    // Ruta de submazos: cada tramo enlaza a su mazo.
    let path = '';
    if (parent) {
      const crumbs = parts.slice(0, -1).map((_, i) => {
        const d = S.deckByName(parts.slice(0, i + 1).join('::'));
        return d ? `<a href="#/deck/${d.id}">${U.esc(parts[i])}</a>` : U.esc(parts[i]);
      });
      path = `<nav class="eyebrow deck-path" aria-label="Ruta del mazo">En ${crumbs.join(' › ')}</nav>`;
    }

    const stat = (cls, n, label) => `<div class="stat${n ? '' : ' zero'}"><span class="stat-num ${cls}">${n}</span><span class="stat-label">${label}</span></div>`;

    UI.render(`
      <section class="deck-hero" aria-labelledby="deck-state">
        ${path}
        <p class="deck-state" id="deck-state">${headline}</p>
        ${total ? `<div class="stat-row">
          ${stat('c-new', c.new, 'nuevas')}
          ${stat('c-learn', c.learn, 'aprendiendo')}
          ${stat('c-due', c.review, 'repaso')}
        </div>` : ''}
        ${body}
      </section>

      ${total ? `<div class="action-grid">
        <a class="tile" href="#/add/${deckId}">${UI.icons.plus}<span>Añadir tarjeta</span></a>
        <a class="tile" href="#/browse/${deckId}">${UI.icons.list}<span>Ver tarjetas <small>${total}${children.length ? ' (con submazos)' : ''}</small></span></a>
      </div>` : ''}

      <div class="list-head deck-head">
        <h2 id="sub-h">Submazos</h2>
        <div class="list-actions">
          <button class="btn btn-quiet" id="btn-new-sub">${UI.icons.folder}<span>Nuevo submazo</span></button>
        </div>
      </div>
      ${children.length ? `
        ${countHead(false, false)}
        <ul class="deck-list" aria-labelledby="sub-h">${children.map((d) => `
          <li class="deck-row is-child-list"><a href="#/deck/${d.id}" class="deck-link">${rowName(d)}${rowCounts(d, S.studyState(d.id).counts)}</a></li>`).join('')}
        </ul>` : '<p class="sub-empty">Aún no tiene submazos. Úsalos para dividir un tema en partes.</p>'}
    `);
    UI.$('#btn-new-sub').onclick = () => V.newDeck(deck);
  };

  // ---------- Importar / exportar ----------
  V.importFlow = async () => {
    const file = await UI.pickFile('.apkg,.colpkg');
    if (!file) return;
    if (!/\.(apkg|colpkg)$/i.test(file.name)) return UI.alert('Formato no válido', 'Elige un archivo .apkg o .colpkg exportado desde Anki.');
    const opts = await UI.modal({
      title: 'Importar de Anki',
      body: `
        <p class="file-pill">${UI.icons.cards}<span>${U.esc(file.name)}</span><small>${(file.size / 1048576).toFixed(1)} MB</small></p>
        <label class="check"><input type="checkbox" name="keep" checked><span>Conservar el progreso de estudio<small>Si lo desmarcas, todas las tarjetas empiezan como nuevas.</small></span></label>`,
      actions: [
        { label: 'Importar', primary: true, collect: (d) => ({ keepProgress: d.querySelector('[name=keep]').checked }) },
        { label: 'Cancelar', value: null }
      ]
    });
    if (!opts) return;
    const busy = UI.busy('Importando mazo…');
    try {
      const r = await App.anki.importApkg(file, opts);
      busy.close();
      await UI.modal({
        title: 'Importación completada',
        body: `<ul class="summary-list">
          <li><strong>${r.notes}</strong> ${r.notes === 1 ? 'nota' : 'notas'} · <strong>${r.cards}</strong> ${r.cards === 1 ? 'tarjeta' : 'tarjetas'}</li>
          <li><strong>${r.decks}</strong> ${r.decks === 1 ? 'mazo' : 'mazos'}</li>
          ${r.media ? `<li><strong>${r.media}</strong> ${r.media === 1 ? 'archivo multimedia' : 'archivos multimedia'}</li>` : ''}
          ${r.skipped ? `<li class="muted">${r.skipped === 1 ? '1 nota omitida porque ya existía' : `${r.skipped} notas omitidas porque ya existían`}</li>` : ''}
        </ul>`,
        actions: [{ label: 'Listo', value: true, primary: true }]
      });
      App.refresh();
    } catch (e) {
      busy.close();
      console.error(e);
      failDialog('No se pudo importar',
        'No hemos podido leer este archivo. Comprueba que es un mazo exportado desde Anki (Archivo › Exportar › «Paquete de mazos de Anki (.apkg)») y vuelve a intentarlo.', e);
    }
  };

  V.exportFlow = async (deckId) => {
    const deck = deckId ? S.deck(deckId) : null;
    const opts = await UI.modal({
      title: 'Exportar a Anki',
      body: `
        <p>${deck ? `Se exportará «${U.esc(deck.name)}» con sus submazos` : 'Se exportarán todos los mazos'} en un archivo .apkg que puedes abrir con Anki.</p>
        <label class="check"><input type="checkbox" name="prog" checked><span>Incluir el progreso de estudio</span></label>`,
      actions: [
        { label: 'Exportar', primary: true, collect: (d) => ({ includeProgress: d.querySelector('[name=prog]').checked }) },
        { label: 'Cancelar', value: null }
      ]
    });
    if (!opts) return;
    const busy = UI.busy('Generando archivo…');
    try {
      const r = await App.anki.exportApkg(deckId, opts);
      busy.close();
      UI.toast(r.cards === 1 ? 'Exportada 1 tarjeta' : `Exportadas ${r.cards} tarjetas`);
    } catch (e) {
      busy.close();
      console.error(e);
      failDialog('No se pudo exportar',
        'No hemos podido generar el archivo. Comprueba que el dispositivo tiene espacio libre y vuelve a intentarlo; si el mazo tiene mucho contenido multimedia, prueba a exportar un submazo.', e);
    }
  };
})(window.App);

</script>
  <script>
/* Pantalla de estudio: muestra la tarjeta, revela la respuesta y registra la valoración. */
(function (App) {
  'use strict';
  const U = App.util, S = App.store, UI = App.ui, C = App.cards, Sch = App.scheduler;
  const V = App.views;

  V.study = (deckId) => {
    const deck = S.deck(deckId);
    if (!deck) return void (location.hash = '#/');

    let current = null;
    let queue = null;
    let revealed = false;
    let shownAt = 0;
    let busy = false;
    let waitTimer = null;
    // Pila de deshacer por mazo: sobrevive SOLO a la ida y vuelta al editor (E → editar → volver).
    // Al entrar al estudio desde cualquier otro sitio empieza vacía: así Z nunca recupera
    // tarjetas de una visita anterior.
    App.session = App.session || {};
    App.session.undo = App.session.undo || {};
    for (const k of Object.keys(App.session.undo)) if (!S.deck(+k)) delete App.session.undo[k]; // mazos borrados
    if (App.session.undoKeep !== deckId) App.session.undo[deckId] = [];
    App.session.undoKeep = null;
    const undoStack = App.session.undo[deckId];
    let keyMsg = ''; // valoración hecha con teclado, pendiente de anunciar junto con la tarjeta siguiente
    // Pista «Toca la tarjeta»: contador local del dispositivo (no viaja en copias ni sincronización).
    const tapHints = () => { try { return +localStorage.getItem('recallo.tapHints') || 0; } catch { return 3; } };
    const bumpTapHints = () => { try { localStorage.setItem('recallo.tapHints', String(tapHints() + 1)); } catch { /* sin almacenamiento */ } };
    let sessionDone = 0; const sessionStart = Date.now(); const ratingsCount = { 1: 0, 2: 0, 3: 0, 4: 0 };
    let revealedAt = 0; // para ignorar una valoración de teclado justo después de revelar

    UI.setHeader({
      title: S.shortName(deck),
      back: `#/deck/${deckId}`,
      actions: [
        { icon: 'undo', label: 'Deshacer (Z)', id: 'btn-undo', onClick: () => undo() },
        { icon: 'more', label: 'Opciones de la tarjeta', id: 'btn-edit', onClick: () => cardMenu() }
      ]
    });

    const view = UI.render(`
      <div class="study">
        <div class="study-head">
          <div class="study-top" id="st-counts"></div>
          <div class="study-progress" id="st-progress" role="progressbar" aria-label="Progreso de la sesión" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span></span></div>
        </div>
        <div class="card-stage"><article class="flashcard" id="st-card"></article></div>
        <div class="answer-bar"><div class="answer-bar-inner" id="st-bar"></div></div>
      </div>`);
    const elCard = view.querySelector('#st-card');
    const elBar = view.querySelector('#st-bar');
    const elCounts = view.querySelector('#st-counts');
    // Tocar la tarjeta revela la respuesta (sin interferir con enlaces, audio ni selección de texto).
    elCard.addEventListener('click', (e) => {
      if (revealed || !current) return;
      if (e.target.closest('a, audio, video, button, input, select, textarea, summary')) return;
      const sel = window.getSelection && window.getSelection();
      if (sel && !sel.isCollapsed && elCard.contains(sel.anchorNode)) return;
      if (tapHints() < 3) bumpTapHints(); // la pista táctil se retira tras 3 toques
      reveal();
    });

    function updateToolbar() {
      UI.$('#btn-undo').disabled = !undoStack.length;
      UI.$('#btn-edit').disabled = !current;
    }

    function next() {
      clearTimeout(waitTimer);
      const r = S.nextCard(deckId);
      current = r.card;
      queue = r.queue;
      elCounts.innerHTML = UI.countsHtml(r.state.counts, queue, { labels: true });
      updateProgress(r.state);
      if (!current) return showDone(r.state);
      revealed = false;
      shownAt = Date.now();
      renderCard();
    }

    /** Al revelar: deja la respuesta (separador, o el primer hueco cloze) visible
     *  justo bajo la cabecera fija y por encima de la barra de respuesta. */
    function scrollToAnswer() {
      // (La clase .face-long de respuestas largas la pone renderCard, igual antes y después de revelar.)
      const target = elCard.querySelector('.answer-sep') || elCard.querySelector('.cloze') || elCard;
      // Medición síncrona (getBoundingClientRect fuerza el layout): sin rAF, que se
      // congela en pestañas en segundo plano.
      const hdr = document.querySelector('.topbar');
      const bar = document.querySelector('.answer-bar');
      // --bar-h = altura real de la barra sin el área segura (app.css la suma aparte).
      if (bar) {
        const safe = Math.max(0, parseFloat(getComputedStyle(bar).paddingBottom) - 12);
        document.documentElement.style.setProperty('--bar-h', Math.ceil(bar.offsetHeight - safe) + 'px');
      }
      const top = (hdr ? hdr.getBoundingClientRect().bottom : 0) + 16;
      const bottom = (bar ? bar.getBoundingClientRect().top : window.innerHeight) - 16;
      const r = target.getBoundingClientRect();
      // Hueco cloze: que se vea entero; separador: que quepan ~3 líneas de respuesta.
      const isSep = target.classList.contains('answer-sep');
      const need = isSep ? r.top + 100 : r.bottom;
      if (r.top >= top && need <= bottom) return;
      // Al hueco cloze le dejamos ~2 líneas de contexto por encima.
      const context = target.classList.contains('cloze') ? 64 : 0;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: Math.max(0, window.scrollY + r.top - top - context), behavior: reduce ? 'auto' : 'smooth' });
    }

    /** Marca la tarjeta con .is-overflowing si su contenido sigue por debajo de la
     *  barra de respuesta: solo entonces adapt.css muestra el degradado inferior. */
    function updateOverflow() {
      if (!elCard.isConnected) return;
      const bar = document.querySelector('.answer-bar');
      const limit = bar ? bar.getBoundingClientRect().top : window.innerHeight;
      // Altura viva de la barra (con área segura) para anclar el degradado justo encima.
      if (bar) elCard.style.setProperty('--answer-bar-live', bar.offsetHeight + 'px');
      elCard.classList.toggle('is-overflowing', elCard.getBoundingClientRect().bottom > limit + 1);
      // Las imágenes cambian la altura al cargar: recalcular cuando lleguen.
      elCard.querySelectorAll('img').forEach((img) => {
        if (!img.complete) img.addEventListener('load', updateOverflow, { once: true });
      });
    }
    // Recalcular también si cambia el tamaño de la tarjeta, de la barra o de la ventana.
    const overflowRO = typeof ResizeObserver === 'function' ? new ResizeObserver(() => updateOverflow()) : null;
    if (overflowRO) { overflowRO.observe(elCard); overflowRO.observe(elBar); }
    window.addEventListener('resize', updateOverflow);
    window.addEventListener('orientationchange', updateOverflow);
    UI.onLeave(() => {
      if (overflowRO) overflowRO.disconnect();
      window.removeEventListener('resize', updateOverflow);
      window.removeEventListener('orientationchange', updateOverflow);
    });

    // ---- Accesibilidad: región viva propia, texto hablado y foco ----
    const UNITS = { d: ['día', 'días'], h: ['hora', 'horas'], min: ['minuto', 'minutos'] };
    const spokenIvl = (s) => String(s).replace(/^(\S+) (d|h|min)$/, (m, n, u) => `${n} ${UNITS[u][n === '1' ? 0 : 1]}`);
    function faceText(face) {
      if (!face) return '';
      const sep = face.querySelector('.answer-sep');
      let t;
      if (sep) {
        const rg = document.createRange();
        rg.setStartAfter(sep);
        rg.setEnd(face, face.childNodes.length);
        t = rg.toString();
      } else t = face.textContent;
      t = t.replace(/\s+/g, ' ').trim();
      return t.length > 200 ? t.slice(0, 199).trimEnd() + '…' : t;
    }
    function announce(text) {
      let live = document.getElementById('st-live');
      if (!live) {
        live = document.createElement('div');
        live.id = 'st-live';
        live.className = 'visually-hidden';
        live.setAttribute('aria-live', 'polite');
        live.setAttribute('aria-atomic', 'true');
        view.appendChild(live);
      }
      live.textContent = '';
      setTimeout(() => { live.textContent = text; }, 120);
    }
    function settle(el, text) {
      if (el && el.isConnected) el.focus({ preventScroll: true });
      if (text) announce(text);
    }

    function renderCard() {
      const note = S.note(current.noteId);
      if (!note) { S.deleteNotes([current.noteId]); return next(); }
      const r = C.render(current, note);
      elCard.className = 'flashcard' + (revealed ? ' revealed' : '');
      elCard.classList.toggle('show-tap-hint', tapHints() < 3);
      elCard.innerHTML = revealed
        ? `<div class="face" role="region" aria-label="Respuesta">${C.toDisplayHtml(r.a)}</div>`
        : `<div class="face" id="st-face" role="region" aria-label="Pregunta">${C.toDisplayHtml(r.q)}</div>`;
      // Misma alineación antes y después de revelar (las respuestas largas van a la izquierda).
      const faceEl = elCard.querySelector('.face');
      // La alineación se decide por partes: una pregunta breve sigue centrada aunque la
      // respuesta sea larga; solo el texto largo va a la izquierda (adapt.css).
      const LONG = 140;
      const qLen = U.stripHtml(r.q).length;
      const aLen = note.type === 'cloze' ? U.stripHtml(r.a).length : Math.max(0, U.stripHtml(r.a).length - qLen);
      const qLong = note.type === 'cloze' ? aLen > LONG : qLen > LONG;
      faceEl.classList.toggle('face-long', qLong || aLen > LONG); // medida de 60ch, igual antes y después
      faceEl.classList.toggle('q-long', qLong);
      faceEl.classList.toggle('a-long', revealed && aLen > LONG);
      if (revealed) {
        const p = Sch.preview(current, S.settings());
        elBar.innerHTML = `<div class="rate-grid">${Sch.RATINGS.map((x) => `
          <button class="rate rate-${x.value}" data-r="${x.value}" data-spoken="${x.label} · vuelve en ${spokenIvl(p[x.value])}" aria-label="${x.label}, vuelve en ${spokenIvl(p[x.value])}" aria-keyshortcuts="${x.value}">
            <span class="rate-ivl">${p[x.value]}</span>
            <span class="rate-label">${x.label}</span>
            <kbd class="rate-key" aria-hidden="true">${x.value}</kbd>
          </button>`).join('')}</div>`;
        elBar.querySelectorAll('.rate').forEach((b) => (b.onclick = () => answer(+b.dataset.r)));
        scrollToAnswer();
      } else {
        elBar.innerHTML = `<button class="btn btn-primary btn-lg btn-block" id="btn-show">Mostrar respuesta</button>`;
        elBar.querySelector('#btn-show').onclick = reveal;
      }
      updateToolbar();
      // Accesibilidad: foco al siguiente paso lógico y anuncio breve (solo el texto relevante).
      if (revealed) settle(elBar.querySelector('.rate-3'), `Respuesta: ${faceText(elCard.querySelector('.face'))}`);
      else {
        const b = elBar.querySelector('#btn-show');
        if (keyMsg) {
          // Tras valorar con teclado: un solo mensaje con la valoración y la pregunta siguiente
          // (sin descripción en el botón, para que el foco no corte ni duplique el anuncio).
          settle(b, `${keyMsg}. Siguiente: ${faceText(elCard.querySelector('.face'))}`);
          keyMsg = '';
        } else {
          if (b) b.setAttribute('aria-describedby', 'st-face'); // la pregunta se lee una vez, como descripción del botón
          settle(b);
        }
      }
      updateOverflow();
    }

    /** Línea de progreso: respuestas de esta sesión frente a lo que queda hoy (sobrevive a deshacer). */
    function sessionLog() {
      const log = S.reviewsSince(sessionStart, S.deckFamilyIds(deckId));
      sessionDone = log.length;
      [1, 2, 3, 4].forEach((k) => (ratingsCount[k] = 0));
      log.forEach((l) => ratingsCount[l.rating]++);
      return log;
    }
    function updateProgress(state) {
      sessionLog();
      const c = state.counts;
      const total = sessionDone + c.new + c.learn + c.review;
      const el = view.querySelector('#st-progress');
      if (!el) return;
      el.setAttribute('aria-valuemax', String(Math.max(1, total)));
      el.setAttribute('aria-valuenow', String(sessionDone));
      el.setAttribute('aria-valuetext', `${sessionDone} de ${total} respuestas`);
      el.firstElementChild.style.transform = `scaleX(${total ? sessionDone / total : 0})`;
    }

    function nextReviewText() {
      const ids = S.deckFamilyIds(deckId);
      let due = Infinity;
      for (const c of S.allCards()) if (ids.has(c.deckId) && !c.suspended && c.state === 'review' && c.due < due) due = c.due;
      if (due === Infinity) return null;
      if (due < U.dayStart(1)) return 'hoy';
      if (due < U.dayStart(2)) return 'mañana';
      return U.fmtDate(due);
    }

    function showDone(state) {
      elCard.className = 'flashcard done';
      const log = sessionLog();
      // «Recordadas» por tarjeta: cuenta solo la primera respuesta de cada una en esta sesión
      // (los pasos de aprendizaje repetidos no inflan el porcentaje).
      const first = new Map();
      log.forEach((l) => { if (!first.has(l.cardId)) first.set(l.cardId, l.rating); });
      const cardsSeen = first.size;
      const recalledN = [...first.values()].filter((r) => r >= 2).length;
      const recalled = cardsSeen ? Math.round((recalledN / cardsSeen) * 100) : 0;
      const buried = S.buriedSiblingsCount ? S.buriedSiblingsCount(deckId) : 0;
      const secs = Math.round(log.reduce((s, l) => s + (l.timeMs || 0), 0) / 1000);
      const pending = state.learnLater.length > 0;
      const nextRev = nextReviewText();

      const title = pending ? 'Pausa breve' : 'Sesión completada';
      let line;
      const tarjetas = (n) => `${n} ${n === 1 ? 'tarjeta' : 'tarjetas'}`;
      if (pending) line = 'Quedan tarjetas en aprendizaje. Seguimos donde lo dejaste en cuanto vuelvan.';
      else if (!log.length) line = 'No hay nada pendiente hoy en este mazo.';
      // Sesiones pequeñas: frase neutra basada en el recuento (un solo fallo no es «exigente»).
      else if (cardsSeen <= 5) {
        const missed = cardsSeen - recalledN;
        line = missed
          ? `Has repasado ${tarjetas(cardsSeen)}; ${missed === 1 ? '1 volverá' : `${missed} volverán`} antes que las demás.`
          : `Has repasado ${tarjetas(cardsSeen)} y ${cardsSeen === 1 ? 'la recordaste' : 'las recordaste todas'}.`;
      }
      else if (recalled >= 85) line = 'Memoria firme hoy. Has repasado todo lo previsto en este mazo.';
      else if (recalled >= 60) line = 'Buen repaso. Lo que costó más volverá pronto para asentarse.';
      else line = 'Sesión exigente. Las que fallaste volverán antes: así es como se aprenden.';

      // Tiempo en la unidad que se lea con naturalidad: segundos si no llega al minuto.
      const time = secs < 60 ? [Math.max(1, secs), 's'] : [Math.round(secs / 60), 'min'];
      const recalledHtml = cardsSeen <= 5
        ? `${recalledN}<small> de ${cardsSeen}</small>` : `${recalled}<small>%</small>`;
      const stats = log.length ? `
        <dl class="recap">
          <div><dt>Tarjetas</dt><dd>${cardsSeen}</dd></div>
          <div><dt>Recordadas</dt><dd>${recalledHtml}</dd></div>
          <div><dt>Tiempo</dt><dd>${time[0]}<small> ${time[1]}</small></dd></div>
        </dl>` : '';
      const notes = [];
      if (log.length > cardsSeen) notes.push(`${log.length} respuestas en total`);
      const buriedText = buried ? `${buried} ${buried === 1 ? 'tarjeta hermana pospuesta' : 'tarjetas hermanas pospuestas'} a mañana` : '';
      if (buried) notes.push(buriedText);
      const notesLine = notes.length ? `<p class="recap-note">${notes.join(' · ')}</p>` : '';
      // Explicación visible (también en táctil y lector de pantalla) sin salir del resumen.
      const whyLine = buried ? `
        <details class="recap-why">
          <summary>¿Por qué se posponen?</summary>
          <p>Las tarjetas de una misma nota se reparten en días distintos para que una no te chive la respuesta de la otra. <a href="#/settings">Cambiar en Ajustes</a></p>
        </details>` : '';
      const nextLine = nextRev && !pending
        ? `<p class="recap-next">Próximo repaso: <strong>${U.esc(nextRev)}</strong></p>` : '';
      const wait = pending
        ? `<p class="recap-wait" aria-live="off">Continuamos en <strong class="recap-countdown" id="st-countdown"></strong></p>` : '';

      elCard.innerHTML = `<div class="face recap-face">
          <h2 class="recap-title">${title}</h2>
          <p class="recap-line">${line}</p>
          ${stats}${notesLine}${whyLine}${nextLine}${wait}
        </div>`;
      elBar.innerHTML = `<div class="recap-actions">
          <a class="btn btn-lg" href="#/">Inicio</a>
          <a class="btn btn-primary btn-lg" href="#/deck/${deckId}">Volver al mazo</a>
        </div>`;

      if (pending) {
        const resumeAt = Math.max(Date.now() + 1000, state.learnLater[0].due - S.settings().learnAheadMinutes * 60000);
        waitTimer = setTimeout(next, resumeAt - Date.now());
        const cd = elCard.querySelector('#st-countdown');
        const tick = () => {
          if (!cd.isConnected) return;
          const s = Math.max(0, Math.ceil((resumeAt - Date.now()) / 1000));
          cd.textContent = s >= 3600 ? U.fmtMinutes(s / 60) : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
          setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
        };
        tick();
      }
      updateToolbar();
      // a11y: foco en «Volver al mazo» y anuncio del resumen (no el «N de N respuestas», siempre igual).
      const spokenRecap = log.length
        ? ` ${tarjetas(cardsSeen)}, ${recalledN} ${recalledN === 1 ? 'recordada' : 'recordadas'}, ${time[0]} ${time[1] === 's' ? 'segundos' : 'minutos'}.${buriedText ? ' ' + buriedText + '.' : ''}`
        : '';
      settle(elBar.querySelector(`a[href="#/deck/${deckId}"]`), `${keyMsg ? keyMsg + '. ' : ''}${title}. ${line}${spokenRecap}`);
      keyMsg = '';
    }

    function reveal() {
      if (!current || revealed) return;
      revealed = true;
      revealedAt = Date.now();
      renderCard();
    }

    async function answer(rating) {
      if (!current || !revealed || busy) return;
      busy = true;
      try {
        let saved;
        try {
          saved = await S.answer(current.id, rating, Date.now() - shownAt);
        } catch (err) {
          // No se guardó: la tarjeta sigue a la vista y revelada para reintentar.
          console.error(err);
          UI.toast('No se pudo guardar la respuesta. Inténtalo de nuevo.', 4000);
          return;
        }
        undoStack.push(saved);
        if (undoStack.length > 50) undoStack.shift();
        next();
      } finally {
        busy = false;
      }
    }

    async function undo() {
      if (busy) return;
      const u = undoStack.pop();
      if (!u) { updateToolbar(); return UI.toast('No hay nada que deshacer'); }
      if (!S.card(u.prev.id)) {
        // La tarjeta se borró (o la nota se editó y ya no la genera): se descarta esa entrada.
        updateToolbar();
        return UI.toast('No se puede deshacer: la tarjeta ya no existe');
      }
      busy = true;
      try {
        await S.undo(u);
      } catch (err) {
        console.error(err);
        undoStack.push(u);
        updateToolbar();
        return UI.toast('No se pudo deshacer. Inténtalo de nuevo.');
      } finally {
        busy = false;
      }
      clearTimeout(waitTimer);
      current = S.card(u.prev.id);
      queue = u.prev.state === 'new' ? 'new' : u.prev.state === 'review' ? 'review' : 'learn';
      const st = S.studyState(deckId);
      elCounts.innerHTML = UI.countsHtml(st.counts, queue, { labels: true });
      updateProgress(st);
      revealed = false;
      shownAt = Date.now();
      renderCard();
      const undone = App.scheduler.RATINGS.find((x) => x.value === (u.log && u.log.rating));
      const note = S.note(current.noteId);
      const which = note ? ` · «${U.truncate(C.sortText(note), 30)}»` : '';
      UI.toast(undone ? `Deshecho: ${undone.label}${which}` : `Respuesta deshecha${which}`);
    }

    function edit() {
      if (!current) return;
      App.session.undoKeep = deckId; // al volver del editor se conserva el deshacer
      location.hash = `#/edit/${current.noteId}`;
    }

    /** Atajo de teclado: la valoración («Bien · vuelve en 10 minutos») se anuncia junto con la
     *  tarjeta siguiente (renderCard) o con el resumen final (showDone), en un solo mensaje. */
    function keyAnswer(rating) {
      if (!current || !revealed || busy) return;
      if (Date.now() - revealedAt < 300) return; // un doble Espacio no valora antes de leer la respuesta
      keyMsg = elBar.querySelector(`.rate-${rating}`)?.dataset.spoken || ''; // vista previa capturada antes de responder
      answer(rating).finally(() => { keyMsg = ''; });
    }

    // ---- Opciones de la tarjeta actual (menú «⋯» y atajos P, S, R, ?) ----
    async function bury() {
      if (!current || busy) return;
      await S.buryCard(current.id);
      UI.toast('Pospuesta hasta mañana');
      next();
    }
    async function suspend() {
      if (!current || busy) return;
      await S.setSuspended(current.noteId, true);
      UI.toast('Suspendida: no volverá hasta que la reactives desde el editor', 3500);
      next();
    }
    function replay() {
      const a = elCard.querySelector('audio');
      if (!a) return UI.toast('Esta tarjeta no tiene audio');
      a.currentTime = 0;
      a.play().catch(() => UI.toast('No se pudo reproducir el audio'));
    }
    function shortcuts() {
      const rows = [
        ['Espacio', 'Mostrar respuesta · valorar «Bien»'], ['1 – 4', 'Otra vez · Difícil · Bien · Fácil'],
        ['Z', 'Deshacer'], ['E', 'Editar la tarjeta'], ['P', 'Posponer hasta mañana'],
        ['S', 'Suspender'], ['R', 'Repetir audio'], ['?', 'Ver estos atajos']
      ];
      UI.modal({
        title: 'Atajos de teclado',
        body: `<dl class="shortcut-list">${rows.map(([k, v]) => `<div><dt><kbd>${k}</kbd></dt><dd>${v}</dd></div>`).join('')}</dl>`,
        actions: [{ label: 'Entendido', value: true, primary: true }]
      });
    }
    function cardMenu() {
      if (!current) return;
      const items = [
        { label: 'Editar tarjeta · E', icon: 'edit', onClick: edit },
        { label: 'Posponer hasta mañana · P', icon: 'cards', onClick: bury },
        { label: 'Suspender · S', icon: 'trash', onClick: suspend }
      ];
      if (elCard.querySelector('audio')) items.push({ label: 'Repetir audio · R', icon: 'play', onClick: replay });
      items.push({ label: 'Atajos de teclado · ?', icon: 'list', onClick: shortcuts });
      UI.sheet('Esta tarjeta', items);
    }

    function onKey(e) {
      if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
      const t = e.target instanceof Element ? e.target : document.body;
      // Campos de texto, listas y diálogos: ningún atajo.
      if (t.closest('input, select, textarea, [contenteditable]:not([contenteditable="false"]), dialog[open]')) return;
      if (e.key === ' ' || e.key === 'Enter') {
        // Enter/Espacio sobre un botón o enlace lo activan de forma nativa
        // (p. ej. Enter en «Otra vez» registra «Otra vez», no «Bien»).
        if (t.closest('button, a[href], [role="button"], [role="link"], summary')) return;
        e.preventDefault();
        if (e.repeat) return; // mantener pulsada la tecla no debe valorar varias tarjetas
        if (!revealed) reveal(); else keyAnswer(3);
      } else if (revealed && ['1', '2', '3', '4'].includes(e.key)) {
        keyAnswer(+e.key);
      } else if (e.key === 'z' || e.key === 'Z') {
        undo();
      } else if (e.key === 'e' || e.key === 'E') {
        edit();
      } else if (e.key === 'p' || e.key === 'P') {
        bury();
      } else if (e.key === 's' || e.key === 'S') {
        suspend();
      } else if (e.key === 'r' || e.key === 'R') {
        replay();
      } else if (e.key === '?') {
        shortcuts();
      }
    }
    document.addEventListener('keydown', onKey);
    UI.onLeave(() => { document.removeEventListener('keydown', onKey); clearTimeout(waitTimer); });

    next();
  };
})(window.App);

</script>
  <script>
/* Editor de notas: crear y editar tarjetas con texto enriquecido, imágenes y huecos (cloze). */
(function (App) {
  'use strict';
  const U = App.util, S = App.store, UI = App.ui, C = App.cards;
  const V = App.views;

  // Última pantalla que no era el editor: a ella se vuelve al guardar, eliminar o salir.
  // (Este script se carga antes que app.js, así que este oyente corre antes del enrutador.)
  let prevRoute = null;
  window.addEventListener('hashchange', (e) => {
    const old = new URL(e.oldURL).hash || '#/';
    if (!/^#\/(add|edit)\b/.test(old)) prevRoute = old;
  });

  // Borradores por nota en la pestaña (si se sale sin guardar por un enlace o el botón Atrás).
  const DRAFT = (key) => `recallo:draft:${key}`;
  const draftGet = (key) => { try { return JSON.parse(sessionStorage.getItem(DRAFT(key)) || 'null'); } catch (e) { return null; } };
  const draftSet = (key, d) => { try { sessionStorage.setItem(DRAFT(key), JSON.stringify(d)); } catch (e) { /* sin almacenamiento */ } };
  const draftDel = (key) => { try { sessionStorage.removeItem(DRAFT(key)); } catch (e) { /* sin almacenamiento */ } };

  // Quita la sintaxis de huecos dejando la respuesta: {{c1::París::capital}} → París
  const unCloze = (html) => String(html || '').replace(/\{\{c\d+::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g, '$1');
  const CLOZE_RE = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;

  V.editor = async ({ deckId = null, noteId = null }) => {
    const editing = noteId != null;
    const note = editing ? S.note(noteId) : null;
    if (editing && !note) return void (location.hash = '#/');

    const st = S.settings();
    let type = note ? note.type : C.TYPES[st.lastType] ? st.lastType : 'basic';
    let did = note ? note.deckId : deckId || st.lastDeckId;
    if (!S.deck(did)) did = S.decks()[0]?.id;
    if (!did) did = (await S.ensureDeck('Mi mazo')).id;

    // Valores actuales de los campos (se conservan al cambiar de tipo).
    const values = note ? { ...note.fields } : {};

    const cards = editing ? S.cardsOfNote(note.id) : [];
    let suspended = !!(cards.length && cards.every((c) => c.suspended));
    const draftKey = editing ? note.id : `new-${deckId || 'any'}`;
    // Adónde volver: la pantalla anterior (estudio, explorador, mazo…) o el mazo.
    const backTarget = prevRoute || (editing ? `#/deck/${note.deckId}` : deckId ? `#/deck/${deckId}` : '#/');

    UI.setHeader({
      title: editing ? 'Editar nota' : 'Nueva nota',
      back: backTarget,
      actions: editing ? [{ icon: 'more', label: 'Más acciones de la nota', id: 'ed-more', onClick: () => moreActions() }] : []
    });
    // El botón Atrás pregunta antes de descartar cambios sin guardar.
    UI.$('#hdr-back').onclick = () => leave(backTarget);

    const deckOptions = S.decks().map((d) => `<option value="${d.id}" ${d.id === did ? 'selected' : ''}>${U.esc(d.name.replace(/::/g, ' › '))}</option>`).join('');
    const typeOptions = Object.entries(C.TYPES).map(([k, t]) => `<option value="${k}" ${k === type ? 'selected' : ''}>${t.label}</option>`).join('');

    const view = UI.render(`
      <form class="editor" id="ed-form" autocomplete="off" novalidate>
        ${editing ? `<div class="ed-suspended" id="ed-suspended" hidden>
          <span class="ed-pill">Suspendida</span>
          <p>Sus tarjetas no aparecen al estudiar.</p>
          <button type="button" class="btn btn-sm" id="ed-reactivate">Reactivar</button>
        </div>` : ''}
        <div class="ed-draft" id="ed-draft" role="status" hidden>
          <span class="ed-draft-label">Borrador</span>
          <p>Tienes cambios sin guardar de la última vez.</p>
          <div class="ed-draft-actions">
            <button type="button" class="btn btn-sm" id="ed-draft-discard">Descartar</button>
            <button type="button" class="btn btn-sm btn-primary" id="ed-draft-restore">Recuperar</button>
          </div>
        </div>
        <div class="row2">
          <label class="field"><span>Mazo</span><select id="ed-deck">${deckOptions}</select></label>
          <label class="field"><span>Tipo</span><select id="ed-type" aria-describedby="ed-type-hint">${typeOptions}</select></label>
        </div>
        <div class="hint" id="ed-type-hint"></div>
        <div id="ed-fields"></div>
        <label class="field"><span>Etiquetas</span><input id="ed-tags" placeholder="Separadas por espacios o comas" autocapitalize="off" spellcheck="false" value="${U.esc((note?.tags || st.lastTags || []).join(' '))}"></label>
        ${editing ? `<p class="ed-meta muted small" id="ed-meta"></p>` : ''}
        <div class="ed-bar">
          <p class="muted small kbd-hint">Ctrl + Enter para guardar</p>
          <button type="submit" class="btn btn-primary btn-lg" id="ed-save">${editing ? 'Guardar cambios' : 'Añadir nota'}</button>
        </div>
      </form>`);

    const elFields = view.querySelector('#ed-fields');
    const hints = {
      basic: '<p>Una tarjeta: ves el anverso y recuerdas el reverso.</p>',
      reverse: '<p>Dos tarjetas: anverso → reverso y reverso → anverso.</p>',
      cloze: `<p>Selecciona palabras y pulsa <b>[ … ]</b> (Ctrl + Alt + C) para ocultarlas: cada hueco nuevo crea una tarjeta.</p>
        <p>Con <b>Mismo nº</b> (Ctrl + Alt + Mayús + C) el hueco se oculta junto al anterior, en la misma tarjeta. Para dar una pista, escríbela dentro del hueco tras dos pares de dos puntos: <i>París::capital</i>.</p>`
    };
    const fieldHelp = { extra: 'Opcional · se muestra al revelar la respuesta' };

    // Icono de pausa para «Suspender» (la hoja de acciones busca los iconos por nombre).
