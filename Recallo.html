/* ============ Tokens ============ */
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface-2: #eeece6;
  --text: #1c1b19;
  --muted: #6c6963;
  --border: #e0ddd5;
  --accent: #23406f;
  --accent-hover: #1a3157;
  --accent-ink: #ffffff;
  --accent-soft: #e5eaf2;
  --new: #4a4740;
  --learn: #9a4a1f;
  --due: #2f5d46;
  --again: #8a2f2a;
  --hard: #7d5f17;
  --good: #2f5d46;
  --easy: #4a5a6a;
  --danger: #8a2f2a;
  --danger-ink: #ffffff;
  --paper: color-mix(in srgb, var(--surface) 97%, #e9dcc0);
  --hairline: color-mix(in srgb, var(--border) 85%, var(--muted));
  --radius: 14px;
  --radius-lg: 20px;
  --shadow: 0 1px 2px rgba(28, 27, 25, .05), 0 6px 20px rgba(28, 27, 25, .06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --card-font: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  --bar-h: 76px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413;
    --surface: #1e1e1c;
    --surface-2: #2a2a27;
    --text: #ecebe6;
    --muted: #9b988f;
    --border: #34332f;
    --accent: #8eaedf;
    --accent-hover: #a8c1ea;
    --accent-ink: #0f1a2e;
    --accent-soft: #1f2a3d;
    --new: #c2bdb2;
    --learn: #dc9a6e;
    --due: #8fbf9f;
    --again: #d98b80;
    --hard: #cfae6a;
    --good: #8fbf9f;
    --easy: #a3b1c0;
    --danger: #e08f84;
    --danger-ink: #1f0d0c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141413;
  --surface: #1e1e1c;
  --surface-2: #2a2a27;
  --text: #ecebe6;
  --muted: #9b988f;
  --border: #34332f;
  --accent: #8eaedf;
  --accent-hover: #a8c1ea;
  --accent-ink: #0f1a2e;
  --accent-soft: #1f2a3d;
  --new: #c2bdb2;
  --learn: #dc9a6e;
  --due: #8fbf9f;
  --again: #d98b80;
  --hard: #cfae6a;
  --good: #8fbf9f;
  --easy: #a3b1c0;
  --danger: #e08f84;
  --danger-ink: #1f0d0c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 var(--font);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--accent); text-decoration: none; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
p { margin: 0; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 16px calc(var(--bar-h) + 32px + env(safe-area-inset-bottom));
}
main:focus { outline: none; }

/* ============ Cabecera ============ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
}
.topbar-inner {
  max-width: 760px; margin: 0 auto; height: 56px;
  display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px;
}
.topbar-inner:has(#hdr-back:not([hidden])) { padding-left: 4px; }
#hdr-title { flex: 1; min-width: 0; font-family: var(--card-font); font-size: 1.25rem; font-weight: 500; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; gap: 2px; }

.icon-btn {
  width: 44px; height: 44px; border-radius: 12px;
  display: inline-grid; place-items: center;
  background: none; border: 0; color: var(--text); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }

/* ============ Botones ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font: inherit; font-weight: 600; font-size: .9375rem; cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); }
.btn-danger:hover { background: var(--danger); filter: brightness(.95); }
.btn-danger-ghost { color: var(--danger); }
.btn-lg { min-height: 54px; font-size: 1.0625rem; border-radius: 14px; }
.btn-block { width: 100%; }
.btn-col { display: grid; gap: 8px; margin: 12px 0; }
.btn-col .btn { justify-content: flex-start; }

/* ============ Contadores ============ */
.counts { display: inline-flex; gap: 10px; font-variant-numeric: tabular-nums; font-weight: 650; font-size: .9375rem; }
.counts > span { min-width: 1.4em; text-align: right; }
.c-new { color: var(--new); }
.c-learn { color: var(--learn); }
.c-due { color: var(--due); }
.counts .zero { color: var(--muted); opacity: .45; font-weight: 500; }
.counts .active { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }

/* ============ Inicio ============ */
.summary {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 20px; box-shadow: var(--shadow); margin-bottom: 24px;
}
.summary-main { font-size: 1.375rem; font-weight: 600; margin: 2px 0; }
.summary-main strong { font-size: 1.75rem; }
.summary .counts { font-size: 1.125rem; }

.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 4px 10px; flex-wrap: wrap; }
.list-head h2 { font-family: var(--card-font); font-size: 1.25rem; font-weight: 500; }
.legend { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; margin-left: 6px; }

.deck-list { list-style: none; margin: 0 0 24px; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.deck-row { display: flex; align-items: center; border-top: 1px solid var(--border); }
.deck-row:first-child { border-top: 0; }
.deck-link {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px;
  padding: 14px 8px 14px calc(16px + var(--depth, 0) * 20px); color: var(--text); min-height: 56px;
}
.deck-link:hover { background: var(--surface-2); }
.deck-name { flex: 1; min-width: 0; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck-row[style*="--depth:1"] .deck-name, .deck-row[style*="--depth:2"] .deck-name, .deck-row[style*="--depth:3"] .deck-name { font-weight: 450; }
.deck-more { margin-right: 4px; color: var(--muted); }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); display: grid; justify-items: center; gap: 8px; }
.empty svg { width: 44px; height: 44px; stroke-width: 1.5; margin-bottom: 4px; }
.empty h2 { color: var(--text); font-size: 1.125rem; }
.empty .btn { margin-top: 12px; }
.empty.small { padding: 24px 16px; }

.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}
.bottom-bar-inner { max-width: 728px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; }
.bottom-bar .btn { padding: 0 10px; white-space: nowrap; }
@media (max-width: 400px) {
  .bottom-bar-inner { grid-template-columns: auto auto 1fr; }
  .bottom-bar .btn { font-size: .875rem; gap: 6px; }
}

/* ============ Mazo ============ */
.deck-hero {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 24px 20px 20px; box-shadow: var(--shadow); text-align: center; margin-bottom: 16px;
}
.deck-title { font-size: 1.5rem; margin: 4px 0 20px; overflow-wrap: anywhere; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.stat { display: grid; gap: 2px; }
.stat-num { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-label { font-size: .8125rem; color: var(--muted); }
.done-msg { padding: 14px; border-radius: 12px; background: var(--surface-2); color: var(--muted); }

.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
.tile {
  display: flex; align-items: center; gap: 10px; padding: 16px; min-height: 60px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-weight: 600;
}
.tile:hover { background: var(--surface-2); }
.tile svg { color: var(--accent); }
.tile small { color: var(--muted); font-weight: 500; margin-left: 4px; }

/* ============ Estudio ============ */
.study { display: flex; flex-direction: column; min-height: calc(100dvh - 56px - var(--bar-h) - 64px); }
.study-top { display: flex; justify-content: center; margin-bottom: 12px; }
.card-stage { flex: 1; display: flex; }
.flashcard {
  flex: 1; display: flex; align-items: center; justify-content: center;
  min-height: 46vh; padding: 32px 24px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 22px; box-shadow: var(--shadow);
  font-family: var(--card-font); font-size: 1.375rem; line-height: 1.5; text-align: center;
  overflow-wrap: anywhere;
}
.flashcard .face { width: 100%; max-width: 620px; animation: fade-up .22s ease-out; }
.flashcard.revealed .face { animation: none; }
.flashcard img { max-width: 100%; height: auto; border-radius: 8px; }
.flashcard audio { width: 100%; max-width: 320px; margin: 8px 0; }
.flashcard hr, .flashcard .answer-sep { border: 0; border-top: 1px dashed var(--border); margin: 22px 0; }
.flashcard .answer-sep ~ * , .flashcard .answer-sep + * { animation: fade-up .22s ease-out; }
.flashcard .extra { font-size: 1.0625rem; color: var(--muted); }
.flashcard ul, .flashcard ol { text-align: left; display: inline-block; margin: 0; }
.flashcard table { margin: 0 auto; border-collapse: collapse; }
.flashcard td, .flashcard th { border: 1px solid var(--border); padding: 4px 8px; }
.cloze { color: var(--accent); }
.flashcard.done { font-family: var(--font); font-size: 1.0625rem; color: var(--muted); }

@keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.answer-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}
.answer-bar-inner { max-width: 728px; margin: 0 auto; }
.rate-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate {
  display: grid; gap: 1px; justify-items: center; padding: 8px 4px; min-height: 54px;
  border-radius: 14px; border: 1px solid transparent; cursor: pointer; font: inherit;
  background: color-mix(in srgb, var(--c) 12%, var(--surface)); color: var(--c);
  transition: background .15s, transform .1s;
}
.rate:hover { background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
.rate:active { transform: scale(.97); }
.rate-1 { --c: var(--again); }
.rate-2 { --c: var(--hard); }
.rate-3 { --c: var(--good); }
.rate-4 { --c: var(--easy); }
.rate-ivl { font-size: .75rem; opacity: .85; font-variant-numeric: tabular-nums; }
.rate-label { font-weight: 650; font-size: .9375rem; color: var(--text); }

/* ============ Editor ============ */
.editor { display: grid; gap: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: grid; gap: 6px; }
.field > span, .field-head > span { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.field-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
input, select, .rich {
  width: 100%; font: inherit; color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 12px; min-height: 44px;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; } /* ≥4,5:1 en claro y oscuro */
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input:focus, select:focus, .rich:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.rich { min-height: 96px; line-height: 1.5; overflow-wrap: anywhere; cursor: text; }
.rich img { max-width: 100%; max-height: 260px; border-radius: 6px; vertical-align: middle; }
.toolbar { display: flex; gap: 2px; }
.toolbar button {
  min-width: 36px; height: 32px; padding: 0 8px; border-radius: 8px;
  border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; font-size: .9375rem;
  display: inline-grid; place-items: center;
}
.toolbar button:hover { background: var(--surface-2); color: var(--text); }
.toolbar svg { width: 18px; height: 18px; }
.toolbar .cloze-btn { color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.hint { font-size: .875rem; color: var(--muted); margin-top: -6px; }
.editor-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.editor-actions .btn-primary { min-width: 160px; }
.editor-actions .btn-danger-ghost { margin-right: auto; }

/* ============ Explorar ============ */
.search-box { position: sticky; top: calc(56px + env(safe-area-inset-top)); z-index: 5; background: var(--bg); padding: 4px 0 8px; }
.search-box input { min-height: 48px; }
.browse > .muted { margin: 4px 4px 10px; }
.note-list { list-style: none; margin: 0 0 16px; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.note-list li + li { border-top: 1px solid var(--border); }
.note-row { display: grid; gap: 4px; padding: 12px 16px; color: var(--text); }
.note-row:hover { background: var(--surface-2); }
.note-title { font-weight: 500; overflow-wrap: anywhere; }
.note-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .8125rem; color: var(--muted); }
.tag { padding: 1px 8px; border-radius: 999px; font-weight: 600; font-size: .75rem; background: var(--surface-2); }
.tag-new { color: var(--new); background: color-mix(in srgb, var(--new) 12%, transparent); }
.tag-learn { color: var(--learn); background: color-mix(in srgb, var(--learn) 12%, transparent); }
.tag-due { color: var(--due); background: color-mix(in srgb, var(--due) 12%, transparent); }
.tag-muted { color: var(--muted); }

/* ============ Ajustes ============ */
.settings { display: grid; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 16px 12px; }
.panel h2 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 4px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--border); }
.panel h2 + .setting { border-top: 0; }
.setting > span { display: grid; font-weight: 500; }
.setting small { color: var(--muted); font-weight: 400; font-size: .8125rem; }
.setting input { width: 120px; flex: none; text-align: right; }
.segmented { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 12px; }
.segmented label { position: relative; }
.segmented input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.segmented span { display: block; padding: 6px 12px; border-radius: 9px; font-size: .875rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.segmented input:checked + span { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.segmented input:focus-visible + span { outline: 2px solid var(--accent); }
.about { text-align: center; }

/* ============ Diálogos ============ */
dialog {
  border: 0; padding: 0; background: transparent; color: var(--text);
  width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
}
dialog::backdrop { background: rgba(10, 10, 8, .45); }
.modal { background: var(--surface); border-radius: var(--radius-lg); padding: 22px 20px 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: fade-up .18s ease-out; }
.modal h2 { font-size: 1.1875rem; margin-bottom: 12px; }
.modal-body { display: grid; gap: 14px; color: var(--text); }
.modal-body p { color: var(--muted); }
.modal-actions { display: flex; flex-direction: row-reverse; gap: 8px; margin-top: 20px; }
.modal-actions .btn { flex: 1; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; min-height: 0; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.check span { display: grid; font-weight: 500; }
.check small { color: var(--muted); font-weight: 400; }
.file-pill { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); color: var(--text) !important; }
.file-pill span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.file-pill small { color: var(--muted); }
.summary-list { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.sheet h2 { font-size: 1rem; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
.sheet-list { display: grid; }
.sheet-item {

.browse .note-body { display: grid; gap: 6px; min-width: 0; }
.browse .note-check { width: 20px; height: 20px; min-height: 0; margin: 3px 0 0; accent-color: var(--accent); }
.browse .is-selected {
  background: color-mix(in srgb, var(--accent) 12%, var(--paper, var(--surface)));
}
/* Sobre el tinte de selección el gris editorial se queda corto en oscuro: algo más de tinta. */
.browse .is-selected .note-meta,
.browse .is-selected .note-hit { color: color-mix(in srgb, var(--muted) 70%, var(--text)); }
.browse .is-selectable:has(.note-check:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }

.bulk-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  border-top: 1px solid var(--border);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}

.bulk-count { margin: 0; font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
#b-bulk-count:focus { outline: none; }
#b-bulk-count:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.browse .link-btn {
  border: 0; background: none; padding: 6px 2px; min-height: 32px; cursor: pointer;
  font: inherit; font-size: .875rem; color: var(--accent);
  text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;
}
.browse .link-btn:hover { text-decoration-thickness: 2px; }

/* Aviso con «Deshacer» (sobre la barra de selección). */
.browse-undo {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 16;
  bottom: calc(20px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
  padding: 8px 10px 8px 16px; border-radius: 12px;
  background: var(--text); color: var(--bg); font-size: .9375rem;
  box-shadow: 0 2px 6px rgba(28, 27, 25, .12), 0 8px 24px rgba(28, 27, 25, .14);
}
.browse-undo[hidden] { display: none; }
.browse-undo .link-btn { color: var(--bg); font-weight: 600; min-height: 36px; padding: 6px 8px; }
.is-selecting .browse-undo { bottom: calc(110px + env(safe-area-inset-bottom)); }
@media (max-width: 520px) { .is-selecting .browse-undo { bottom: calc(150px + env(safe-area-inset-bottom)); } }

/* Fila de filtros desplazable: degradado en el borde con contenido oculto. */
.filter-chips.fade-end { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
.filter-chips.fade-start { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); }
.filter-chips.fade-start.fade-end { -webkit-mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent); }
.bulk-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.bulk-actions .btn { min-height: 44px; padding: 0 12px; font-size: .9375rem; }
.bulk-actions .btn:disabled { opacity: .5; cursor: not-allowed; }
@media (max-width: 520px) {
  .bulk-inner { display: grid; }
  .bulk-actions { display: grid; grid-template-columns: repeat(4, 1fr); }
  .bulk-actions .btn { padding: 0 4px; font-size: .875rem; }
}
.is-selecting .browse { padding-bottom: 96px; }

/* ---------- Volver arriba ---------- */
.to-top {
  position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 14;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; cursor: pointer;
  background: var(--paper, var(--surface)); color: var(--accent);
  border: 1px solid var(--border);
  box-shadow: 0 1px 2px rgba(28, 27, 25, .06), 0 4px 14px rgba(28, 27, 25, .08);
}
.to-top[hidden] { display: none; }
.to-top svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.is-selecting .to-top { bottom: calc(150px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) { .to-top { right: calc(50% - 380px - 60px); } }

/* Estilos de la pantalla «settings» (se carga después del resto de hojas). */

/* ---------- Secciones: titular serif, en minúsculas de frase ---------- */
.settings { gap: 20px; }
.settings .panel { padding: 6px 18px 14px; }
.settings .panel h2 {
  font-family: var(--card-font); font-weight: 400; font-size: 1.3125rem; line-height: 1.25;
  text-transform: none; letter-spacing: -.005em; color: var(--text); margin: 14px 0 4px;
}

/* ---------- Filas ---------- */
.settings .setting {

  column-gap: 20px; row-gap: 6px; padding: 14px 0;
}
.setting-text { min-width: 0; }
.setting-text label, .setting-label { display: block; font-weight: 550; cursor: pointer; }
.setting-label { cursor: default; }
.setting-help { margin: 3px 0 0; color: var(--muted); font-size: .8125rem; line-height: 1.45; text-wrap: pretty; max-width: 60ch; }
.settings .setting input[type="number"], .settings .setting input[data-list] {
  width: 128px; text-align: right; font-variant-numeric: tabular-nums;
}
.settings .setting input[data-list] { width: 148px; }
.setting-msg { grid-column: 1 / -1; margin: 0; font-size: .8125rem; line-height: 1.4; color: var(--text); }
.setting-msg:empty { display: none; }
.setting-msg[data-kind="error"] { color: var(--danger); font-weight: 550; }
.settings .setting input[aria-invalid="true"] { border-color: var(--danger); }
.settings .setting input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent); }

/* ---------- Papel: paneles como hojas, con filete fino ---------- */
.settings .panel { background: var(--paper, var(--surface)); border-color: var(--hairline, var(--border)); }
.settings .setting, .danger-zone { border-top-color: var(--hairline, var(--border)); }

/* Lectura en lenguaje llano de los pasos y avisos suaves */
.setting-reading {
  grid-column: 1 / -1; margin: 0; font-family: var(--card-font); font-style: italic;
  font-size: .9375rem; line-height: 1.45; color: var(--muted); text-wrap: pretty;
}
.setting-help.is-warn { color: var(--text); }
.setting-help.is-warn::before { content: "Atención · "; color: var(--danger); font-weight: 600; }

/* ---------- Tema: opciones con contorno de tinta, 44px ---------- */
.settings .theme-pick { background: transparent; padding: 0; gap: 6px; border-radius: 0; }
.settings .segmented input { width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; }
.settings .theme-pick span {
  display: flex; align-items: center; min-height: 44px; padding: 0 14px;
  border: 1px solid var(--hairline, var(--border)); border-radius: 10px;
  background: transparent; color: var(--text); font-weight: 500; box-shadow: none;
  transition: background-color .15s ease-out, border-color .15s ease-out;
}
.settings .theme-pick span:hover { background: var(--surface-2); }
.settings .theme-pick input:checked + span {
  background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 600; box-shadow: none;
}
.settings .theme-pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Avanzado: titular real + desplegable ---------- */
.adv-intro { margin: 0 0 6px; }
.advanced > summary {
  list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
  min-height: 44px; padding: 0 2px; color: var(--accent); font-weight: 550; border-radius: 8px;
}
.advanced > summary::-webkit-details-marker { display: none; }
.advanced > summary::after {
  content: ""; width: 7px; height: 7px; margin-top: -3px;
  border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: rotate(45deg); transition: transform .2s ease;
}
.advanced[open] > summary::after { transform: rotate(-135deg); margin-top: 3px; }
.advanced .adv-hide, .advanced[open] .adv-show { display: none; }
.advanced[open] .adv-hide { display: inline; }
.advanced > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Botón pequeño y botón de borrar desactivado ---------- */
.btn.btn-sm { min-height: 40px; padding: 0 12px; font-size: .875rem; gap: 6px; border-radius: 10px; }
.btn.btn-sm svg { width: 16px; height: 16px; }
#modal .btn-danger:disabled {
  background: var(--danger); border-color: var(--danger); color: var(--danger-ink, #fff);
  opacity: .42; cursor: not-allowed; filter: none; transform: none;
}
.dz-hint { margin-top: 6px; }
.dz-hint.is-error { color: var(--danger); font-weight: 550; }
.settings .setting-reset { display: flex; justify-content: flex-start; }
@media (prefers-reduced-motion: reduce) { .advanced > summary::after { transition: none; } }

/* ---------- Datos ---------- */
.data-note { margin: 2px 0 16px; }
.data-backup { display: grid; gap: 8px; }
.data-backup .btn { justify-content: center; }
.data-secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.data-secondary .btn { justify-content: center; }
.data-count { margin-top: 12px; font-variant-numeric: tabular-nums; }
.danger-zone { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); }
.danger-zone h3 { font-family: var(--card-font); font-weight: 400; font-size: 1.0625rem; color: var(--text); }
.danger-zone .setting-help { margin-bottom: 12px; }
.settings .about { margin: 4px 0 8px; text-align: center; color: var(--muted); font-size: .8125rem; }

/* ---------- Pantallas estrechas: el campo baja bajo su etiqueta ---------- */
@media (max-width: 480px) {
  .settings .panel { padding: 4px 14px 12px; }
  .settings .setting:not(.setting-inline):not(.setting-reset) { grid-template-columns: minmax(0, 1fr); }
  .settings .setting input[type="number"], .settings .setting input[data-list] { width: 100%; text-align: left; }
  .data-secondary { grid-template-columns: 1fr; }
  .setting-help { font-size: .875rem; }
}

/*
 * Configuración global de la app.
 * El nombre de la app está solo aquí (y en manifest.webmanifest / index.html <title>).
 */
window.App = window.App || {};

App.config = {
  appName: 'Recallo',
  version: '0.1.0',
  // Como en Anki: el "día" de estudio empieza a las 4:00, no a medianoche.
  dayStartsAtHour: 4,
  defaults: {
    newPerDay: 20,            // tarjetas nuevas por día
    reviewsPerDay: 200,       // repasos máximos por día
    learningSteps: [1, 10],   // minutos (tarjetas nuevas)
    relearningSteps: [10],    // minutos (tarjetas olvidadas)
    graduatingInterval: 1,    // días al terminar los pasos con "Bien"
    easyInterval: 4,          // días al pulsar "Fácil" en una nueva
    startingEase: 2.5,        // factor de facilidad inicial
    learnAheadMinutes: 20,    // adelantar tarjetas en aprendizaje si no queda nada más
    burySiblings: true,       // posponer a mañana las tarjetas hermanas (misma nota) de una ya respondida hoy
    theme: 'system'           // system | light | dark

  <script>
/* Utilidades generales: ids, fechas, formato, saneado de HTML. Sin dependencias de UI. */
(function (App) {
  'use strict';
  const U = (App.util = {});

  // ---------- Identificadores ----------
  // Ids numéricos basados en milisegundos (mismo criterio que Anki), siempre crecientes.
  let lastId = 0;
  U.bumpId = (id) => { if (typeof id === 'number' && id > lastId) lastId = id; };
  U.newId = () => {
    let t = Date.now();
    if (t <= lastId) t = lastId + 1;
    lastId = t;
    return t;
  };

  const GUID_CHARS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!#$%&()*+,-./:;<=>?@[]^_`{|}~';
  U.newGuid = () => {
    const a = new Uint8Array(10);
    crypto.getRandomValues(a);
    return Array.from(a, (b) => GUID_CHARS[b % GUID_CHARS.length]).join('');
  };

  // ---------- Texto ----------
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  U.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);

  U.stripHtml = (html) => {
    const t = document.createElement('template');
    t.innerHTML = String(html || '')
      .replace(/<br\s*\/?>/gi, ' ')
      .replace(/<\/(div|p|li|tr|h\d)>/gi, ' ');
    return (t.content.textContent || '').replace(/\s+/g, ' ').trim();
  };

  U.truncate = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

  // ---------- Fechas (día de estudio con corte a las 4:00) ----------
  const cutoff = () => App.config.dayStartsAtHour;

  /** Marca de tiempo (ms) del inicio del día de estudio actual + offsetDays. */
  U.dayStart = (offsetDays = 0, now = Date.now()) => {
    const d = new Date(now);
    if (d.getHours() < cutoff()) d.setDate(d.getDate() - 1);
    d.setHours(cutoff(), 0, 0, 0);
    d.setDate(d.getDate() + offsetDays);
    return d.getTime();
  };

  /** Número de día absoluto (útil para restar fechas sin problemas de horario de verano). */
  U.dayIndex = (ts) => {
    const d = new Date(ts);
    if (d.getHours() < cutoff()) d.setDate(d.getDate() - 1);
    return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  };

  const num = (x) => String(+x.toFixed(1)).replace('.', ',');
  U.fmtDays = (d) => {
    if (d < 30) return `${Math.round(d)} d`;
    const [n, one, many] = d < 360 ? [d / 30, 'mes', 'meses'] : [d / 365, 'año', 'años'];
    const s = num(n);
    return `${s} ${s === '1' ? one : many}`;
  };
  U.fmtMinutes = (m) =>
    m < 60 ? `${Math.max(1, Math.round(m))} min` : m < 1440 ? `${num(m / 60)} h` : U.fmtDays(m / 1440);
  U.fmtDate = (ts) => new Date(ts).toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });

  // ---------- Saneado de HTML (los mazos importados pueden traer cualquier cosa) ----------
  const ALLOWED_TAGS = new Set([
    'a', 'b', 'i', 'u', 's', 'em', 'strong', 'mark', 'small', 'sub', 'sup', 'br', 'hr', 'p', 'div', 'span',
    'ul', 'ol', 'li', 'img', 'audio', 'table', 'thead', 'tbody', 'tr', 'td', 'th', 'font', 'code', 'pre',
    'blockquote', 'h1', 'h2', 'h3', 'h4', 'strike', 'ruby', 'rt', 'rp', 'center', 'figure', 'figcaption'
  ]);
  const DROP_TAGS = new Set([
    'script', 'style', 'iframe', 'object', 'embed', 'link', 'meta', 'template', 'svg', 'math', 'form',
    'input', 'button', 'textarea', 'select', 'video', 'frame', 'frameset', 'base', 'title', 'head'
  ]);
  const ALLOWED_ATTRS = new Set([
    'style', 'class', 'src', 'href', 'alt', 'title', 'colspan', 'rowspan', 'width', 'height',
    'color', 'face', 'size', 'controls', 'align', 'dir', 'lang'
  ]);

  U.sanitize = (html) => {
    const t = document.createElement('template');
    t.innerHTML = String(html || '');
    const walk = (node) => {
      for (const child of [...node.childNodes]) {
        if (child.nodeType === 1) {
          const tag = child.tagName.toLowerCase();
          if (DROP_TAGS.has(tag)) { child.remove(); continue; }
          if (!ALLOWED_TAGS.has(tag)) { walk(child); child.replaceWith(...child.childNodes); continue; }
          for (const attr of [...child.attributes]) {
            const n = attr.name.toLowerCase();
            const v = attr.value.trim();
            if (!ALLOWED_ATTRS.has(n)) child.removeAttribute(attr.name);
            else if ((n === 'src' || n === 'href') && /^(javascript|vbscript|data:(?!image\/))/i.test(v)) child.removeAttribute(attr.name);
            else if (n === 'style' && /expression|url\s*\(|position\s*:\s*(fixed|absolute)/i.test(v)) child.removeAttribute(attr.name);
          }
          if (tag === 'a') { child.setAttribute('target', '_blank'); child.setAttribute('rel', 'noopener noreferrer'); }
          walk(child);
        } else if (child.nodeType !== 3) {
          child.remove();
        }
      }
    };
    walk(t.content);
    return t.innerHTML;
  };

  // ---------- Archivos ----------
  U.download = (blob, filename) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 15000);
  };

  U.safeFilename = (s) => String(s).replace(/[\\/:*?"<>|\x00-\x1f]+/g, '_').trim() || 'mazo';

  const MIME = {
    jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp',
    svg: 'image/svg+xml', bmp: 'image/bmp', mp3: 'audio/mpeg', ogg: 'audio/ogg', wav: 'audio/wav',
    m4a: 'audio/mp4', opus: 'audio/ogg', flac: 'audio/flac'
  };
  U.mimeFor = (name) => MIME[String(name).split('.').pop().toLowerCase()] || 'application/octet-stream';

  U.blobToDataUrl = (blob) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
  U.dataUrlToBlob = async (url) => (await fetch(url)).blob();

  U.loadScript = (src) => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.crossOrigin = 'anonymous';
    s.onload = res;
    s.onerror = () => rej(new Error('No se pudo cargar una librería necesaria. ¿Tienes conexión a internet?'));
    document.head.appendChild(s);
  });

  /** Checksum de Anki: primeros 8 dígitos hex del SHA-1 del texto. */
  U.ankiChecksum = async (text) => {
    try {
      const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(text));
      const hex = [...new Uint8Array(buf)].slice(0, 4).map((b) => b.toString(16).padStart(2, '0')).join('');
      return parseInt(hex, 16);
    } catch {
      return 0;
    }
  };

  U.debounce = (fn, ms) => {
    let h;
    return (...args) => { clearTimeout(h); h = setTimeout(() => fn(...args), ms); };
  };

  /**
   * Texto «plegado» para buscar: sin tildes ni diéresis y en minúsculas («París» -> «paris»),
   * pero la ñ sigue siendo ñ («año» no coincide con «ano»).
   */
  U.fold = (s) => String(s ?? '').normalize('NFD')
    .replace(/([nN])̃/g, '$1')   // protege la virgulilla de la ñ
    .replace(/\p{M}+/gu, '')
    .replace(/n/g, 'ñ').replace(/N/g, 'Ñ')
    .toLowerCase();

  /** Texto plegado carácter a carácter + mapa de cada posición plegada a su posición original. */
  function foldMap(src) {
    let folded = '';
    const map = [];
    let i = 0;
    for (const ch of src) {
      const f = U.fold(ch);
      for (let k = 0; k < f.length; k++) map.push(i);
      folded += f;
      i += ch.length;
    }
    map.push(src.length);
    return { folded, map };
  }

  /**
   * Fragmento de una línea alrededor de la primera coincidencia de `terms` (ya plegados) en `text`,
   * con la coincidencia resaltada. Devuelve HTML escapado o '' si no hay coincidencia.
   */
  U.excerpt = (text, terms, before = 36, after = 64) => {
    const src = String(text ?? '').replace(/\s+/g, ' ').trim();
    if (!src || !terms || !terms.length) return '';
    const { folded, map } = foldMap(src);
    let p = -1;
    for (const t of terms) {
      const q = t ? folded.indexOf(t) : -1;
      if (q !== -1 && (p === -1 || q < p)) p = q;
    }
    if (p === -1) return '';
    let a = map[Math.max(0, p - before)];
    let b = map[Math.min(folded.length, p + after)];
    if (a > 0) { const sp = src.lastIndexOf(' ', a); a = sp > 0 && a - sp < 12 ? sp + 1 : a; }
    if (b < src.length) { const sp = src.indexOf(' ', b); b = sp !== -1 && sp - b < 12 ? sp : b; }
    return `${a > 0 ? '…' : ''}${U.highlight(src.slice(a, b), terms)}${b < src.length ? '…' : ''}`;
  };

  /**
   * Resalta (con <mark>) las apariciones de `terms` (ya plegados) en `text`, sin distinguir tildes
   * ni mayúsculas. Devuelve HTML escapado.
   */
  U.highlight = (text, terms) => {
    const src = String(text ?? '');
    if (!terms || !terms.length) return U.esc(src);
    const { folded, map } = foldMap(src);
    const marks = new Array(src.length).fill(false);
    for (const t of terms) {
      if (!t) continue;
      let p = folded.indexOf(t);
      while (p !== -1) {
        for (let k = map[p]; k < map[p + t.length]; k++) marks[k] = true;
        p = folded.indexOf(t, p + t.length);
      }
    }
    let out = '', open = false;
    for (let k = 0; k < src.length; k++) {
      if (marks[k] && !open) { out += '<mark>'; open = true; }
      if (!marks[k] && open) { out += '</mark>'; open = false; }
      out += U.esc(src[k]);
    }
    return out + (open ? '</mark>' : '');
  };
})(window.App);

</script>

/*
 * Persistencia local con IndexedDB.
 * En Flutter esto se sustituye por SQLite (paquete drift o sqflite) con las mismas "tablas".
 */
(function (App) {
  'use strict';
  const DB = (App.db = {});
  const DB_NAME = 'recallo';
  const VERSION = 1;
  const STORES = { decks: 'id', notes: 'id', cards: 'id', revlog: 'id', media: 'name', meta: 'key' };
  DB.STORES = Object.keys(STORES);

  let dbp = null;
  function open() {
    if (!dbp) {
      dbp = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          for (const [name, keyPath] of Object.entries(STORES)) {
            if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath });
          }
        };
        // Otra pestaña con una versión antigua abierta impide actualizar: se avisa a la app
        // (la petición sigue esperando y se resuelve sola si la otra pestaña se cierra).
        req.onblocked = () => { if (typeof DB.onblocked === 'function') DB.onblocked(); };
        req.onsuccess = () => {
          const db = req.result;
          // Si otra pestaña necesita actualizar la base de datos, cedemos la conexión.
          db.onversionchange = () => { db.close(); dbp = null; };
          resolve(db);
        };
        req.onerror = () => { dbp = null; reject(req.error); };
      });
    }
    return dbp;
  }

  const done = (t) => new Promise((res, rej) => {
    t.oncomplete = () => res();
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('Transacción abortada'));
  });

  DB.getAll = async (store) => {
    const db = await open();
    return new Promise((res, rej) => {
      const r = db.transaction(store).objectStore(store).getAll();
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  };

  DB.put = async (store, items) => {
    items = [].concat(items);
    if (!items.length) return;
    const db = await open();
    const t = db.transaction(store, 'readwrite');
    const os = t.objectStore(store);
    for (const it of items) os.put(it);
    return done(t);
  };

  DB.del = async (store, keys) => {
    keys = [].concat(keys);
    if (!keys.length) return;
    const db = await open();
    const t = db.transaction(store, 'readwrite');
    const os = t.objectStore(store);
    for (const k of keys) os.delete(k);
    return done(t);
  };

  DB.clear = async (stores = DB.STORES) => {
    const db = await open();
    const t = db.transaction(stores, 'readwrite');
    for (const s of stores) t.objectStore(s).clear();
    return done(t);
  };
})(window.App);

  <script>
/*
 * Algoritmo de repaso espaciado (variante de SM-2, como el planificador clásico de Anki).
 * Es lógica pura: recibe una tarjeta + ajustes y devuelve el nuevo estado.
 *
 * Estados: new -> learning -> review <-> relearning
 * Valoraciones: 1 = Otra vez, 2 = Difícil, 3 = Bien, 4 = Fácil
 */
(function (App) {
  'use strict';
  const U = App.util;
  const Sch = (App.scheduler = {});
  const MIN = 60000;

  Sch.RATINGS = [
    { value: 1, label: 'Otra vez', key: '1' },
    { value: 2, label: 'Difícil', key: '2' },
    { value: 3, label: 'Bien', key: '3' },
    { value: 4, label: 'Fácil', key: '4' }
  ];

  const capIvl = (x) => Math.min(36500, Math.max(1, Math.round(x)));

  function graduate(card, ivl, s, now) {
    return { state: 'review', step: 0, interval: ivl, ease: card.ease || s.startingEase, due: U.dayStart(ivl, now) };
  }

  /** Calcula el resultado de las 4 valoraciones posibles para una tarjeta. */
  function outcomes(card, s, now) {
    const r = {};

    if (card.state === 'new' || card.state === 'learning') {
      const steps = s.learningSteps;
      if (!steps.length) {
        r[1] = r[2] = r[3] = graduate(card, s.graduatingInterval, s, now);
        r[4] = graduate(card, s.easyInterval, s, now);
        return r;
      }
      const step = card.state === 'new' ? 0 : Math.min(card.step || 0, steps.length - 1);
      const hardDelay =
        step === 0 && steps.length > 1 ? (steps[0] + steps[1]) / 2 : steps.length === 1 ? steps[0] * 1.5 : steps[step];
      r[1] = { state: 'learning', step: 0, due: now + steps[0] * MIN };
      r[2] = { state: 'learning', step, due: now + hardDelay * MIN };
      r[3] = step + 1 < steps.length
        ? { state: 'learning', step: step + 1, due: now + steps[step + 1] * MIN }
        : graduate(card, s.graduatingInterval, s, now);
      r[4] = graduate(card, s.easyInterval, s, now);
      return r;
    }

    if (card.state === 'relearning') {
      const rs = s.relearningSteps;
      const base = Math.max(1, card.interval || 1);
      const back = (extra) => ({ state: 'review', step: 0, interval: base + extra, ease: card.ease, due: U.dayStart(base + extra, now) });
      if (!rs.length) {
        r[1] = r[2] = r[3] = back(0);
        r[4] = back(1);
        return r;
      }
      const step = Math.min(card.step || 0, rs.length - 1);
      r[1] = { state: 'relearning', step: 0, due: now + rs[0] * MIN };
      r[2] = { state: 'relearning', step, due: now + (rs.length === 1 ? rs[0] * 1.5 : rs[step]) * MIN };
      r[3] = step + 1 < rs.length ? { state: 'relearning', step: step + 1, due: now + rs[step + 1] * MIN } : back(0);
      r[4] = back(1);
      return r;
    }

    // Estado "review"
    const ivl = Math.max(1, card.interval || 1);
    const ease = card.ease || s.startingEase;
    const overdue = Math.max(0, U.dayIndex(now) - U.dayIndex(card.due));
    const hard = capIvl(Math.max(ivl + 1, ivl * 1.2));
    const good = capIvl(Math.max(hard + 1, (ivl + overdue / 2) * ease));
    const easy = capIvl(Math.max(good + 1, (ivl + overdue) * ease * 1.3));
    const lapseEase = Math.max(1.3, ease - 0.2);

    r[1] = s.relearningSteps.length
      ? { state: 'relearning', step: 0, interval: 1, ease: lapseEase, due: now + s.relearningSteps[0] * MIN, lapse: true }
      : { state: 'review', step: 0, interval: 1, ease: lapseEase, due: U.dayStart(1, now), lapse: true };
    r[2] = { state: 'review', interval: hard, ease: Math.max(1.3, ease - 0.15), due: U.dayStart(hard, now) };
    r[3] = { state: 'review', interval: good, ease, due: U.dayStart(good, now) };
    r[4] = { state: 'review', interval: easy, ease: ease + 0.15, due: U.dayStart(easy, now) };
    return r;
  }

  /** Texto corto para cada botón: "1 min", "10 min", "4 d", "1,2 mes"... */
  Sch.preview = (card, s, now = Date.now()) => {
    const o = outcomes(card, s, now);
    const labels = {};
    for (const k of [1, 2, 3, 4]) {
      labels[k] = o[k].state === 'review' ? U.fmtDays(o[k].interval) : U.fmtMinutes((o[k].due - now) / MIN);
    }
    return labels;
  };

  /** Devuelve los campos a actualizar en la tarjeta tras responder. */
  Sch.answer = (card, rating, s, now = Date.now()) => {
    const res = { ...outcomes(card, s, now)[rating] };
    // Pequeña aleatoriedad (±5 %) para que las tarjetas no se agrupen el mismo día.
    if (res.state === 'review' && res.interval >= 3) {
      const fuzz = Math.max(1, Math.round(res.interval * 0.05));
      res.interval = capIvl(res.interval + Math.floor(Math.random() * (2 * fuzz + 1)) - fuzz);
      res.due = U.dayStart(res.interval, now);
    }
    const lapses = (card.lapses || 0) + (res.lapse ? 1 : 0);
    delete res.lapse;
    return { ...res, lapses, reps: (card.reps || 0) + 1 };
  };
})(window.App);

  <script>
/*
 * Tipos de nota y generación/renderizado de tarjetas.
 *
 * Modelo (igual que Anki): una NOTA guarda la información; de cada nota salen una o varias TARJETAS.
 *  - basic:   1 tarjeta (anverso -> reverso)
 *  - reverse: 2 tarjetas (anverso -> reverso y reverso -> anverso)
 *  - cloze:   1 tarjeta por cada hueco {{c1::...}}, {{c2::...}}...
 */
(function (App) {
  'use strict';
  const U = App.util;
  const C = (App.cards = {});

  C.TYPES = {
    basic: { label: 'Básica', fields: [['front', 'Anverso'], ['back', 'Reverso']] },
    reverse: { label: 'Básica y reverso', fields: [['front', 'Anverso'], ['back', 'Reverso']] },
    cloze: { label: 'Rellenar huecos', fields: [['text', 'Texto'], ['extra', 'Extra']] }
  };

  C.primaryField = (type) => C.TYPES[type].fields[0][0];

  const clozeRe = () => /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;

  C.clozeNumbers = (text) => {
    const set = new Set();
    for (const m of String(text || '').matchAll(clozeRe())) set.add(+m[1]);
    return [...set].sort((a, b) => a - b);
  };

  /** Qué tarjetas (ord) debe tener una nota. */
  C.ordsFor = (note) => {
    if (note.type === 'reverse') return [0, 1];
    if (note.type === 'cloze') {
      const nums = C.clozeNumbers(note.fields.text).filter((n) => n > 0);
      return nums.length ? nums.map((n) => n - 1) : [0];
    }
    return [0];
  };

  function renderCloze(text, ord, reveal) {
    return String(text || '').replace(clozeRe(), (m, n, content, hint) => {
      if (+n !== ord + 1) return content;
      if (reveal) return `<span class="cloze">${content}</span>`;
      return `<span class="cloze">[${hint ? hint : '…'}]</span>`;
    });
  }

  /** HTML (sin sanear) de la pregunta y de la respuesta completa. */
  C.render = (card, note) => {
    const f = note.fields;
    if (note.type === 'cloze') {
      const extra = f.extra && U.stripHtml(f.extra) !== '' || /<img/i.test(f.extra || '') ? `<hr class="extra-sep"><div class="extra">${f.extra}</div>` : '';
      return { q: renderCloze(f.text, card.ord, false), a: renderCloze(f.text, card.ord, true) + extra };
    }
    const flipped = note.type === 'reverse' && card.ord === 1;
    const [q, a] = flipped ? [f.back, f.front] : [f.front, f.back];
    // Señal discreta de dirección solo en la tarjeta invertida (las básicas quedan limpias).
    const dir = flipped ? '<div class="card-dir">Reverso → Anverso</div>' : '';
    // Al revelar, la pregunta se repite en un tono secundario para que la respuesta mande.
    return { q: dir + q, a: `${dir}<div class="echo-q">${q}</div><hr class="answer-sep"><div class="answer-body">${a}</div>` };
  };

  C.sortText = (note) => U.stripHtml(note.fields[C.primaryField(note.type)] || '').replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g, '$1');

  // ---------- HTML de tarjetas: saneado + archivos multimedia locales ----------
  const isExternal = (src) => /^(https?:|blob:|data:)/i.test(src);

  /** Para mostrar una tarjeta: sanea, convierte [sound:x] y resuelve imágenes/audio guardados. */
  C.toDisplayHtml = (html) => {
    const withAudio = String(html || '').replace(/\[sound:([^\]]+)\]/g, (m, name) => `<audio controls src="${U.esc(name)}"></audio>`);
    const t = document.createElement('template');
    t.innerHTML = U.sanitize(withAudio);
    t.content.querySelectorAll('img[src], audio[src]').forEach((el) => {
      const src = el.getAttribute('src');
      if (isExternal(src)) return;
      const url = App.store.mediaUrl(safeDecode(src));
      if (url) el.setAttribute('src', url);
    });
    return t.innerHTML;
  };

  /** Para el editor: igual, pero recordando el nombre original de cada imagen. */
  C.toEditHtml = (html) => {
    const t = document.createElement('template');
    t.innerHTML = U.sanitize(html);
    t.content.querySelectorAll('img[src]').forEach((el) => {
      const name = safeDecode(el.getAttribute('src'));
      const url = App.store.mediaUrl(name);
      if (url) { el.setAttribute('data-media', name); el.setAttribute('src', url); }
    });
    return t.innerHTML;
  };

  /** Del editor al formato guardado. */
  C.fromEditHtml = (html) => {
    const t = document.createElement('template');
    t.innerHTML = html;
    t.content.querySelectorAll('img[data-media]').forEach((el) => {
      el.setAttribute('src', el.getAttribute('data-media'));
      el.removeAttribute('data-media');
    });
    let out = U.sanitize(t.innerHTML).trim();
    out = out.replace(/(<br\s*\/?>|<div><br\s*\/?><\/div>|\s|&nbsp;)+$/gi, '');
    // También al principio: líneas vacías y espacios duros que deja el campo editable.
    out = out.replace(/^(<br\s*\/?>|<div>(?:\s|&nbsp;)*(?:<br\s*\/?>)?<\/div>|\s|&nbsp;)+/gi, '');
    out = out.replace(/^(<(?:div|p)>)(?:\s|&nbsp;)+/i, '$1');
    if (!U.stripHtml(out) && !/<(img|audio)/i.test(out)) return '';
    return out;
  };

  /** Nombres de archivos multimedia que usa un HTML. */
  C.mediaRefs = (html) => {
    const refs = new Set();
    const s = String(html || '');
    for (const m of s.matchAll(/<(?:img|audio)[^>]*?\ssrc=["']([^"']+)["']/gi)) if (!isExternal(m[1])) refs.add(safeDecode(m[1]));
    for (const m of s.matchAll(/\[sound:([^\]]+)\]/g)) refs.add(m[1]);
    return refs;
  };

  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch { return s; }
  }
})(window.App);

</script>
  <script>
/*
 * Colección en memoria + persistencia. Es la "capa de datos" de la app:
 * la interfaz solo habla con App.store, nunca con IndexedDB directamente.
 *
 * Entidades:
 *  Deck   { id, name ("Padre::Hijo"), created, mod }
 *  Note   { id, guid, deckId, type, fields{}, tags[], created, mod }
 *  Card   { id, noteId, deckId, ord, state, due, interval, ease, step, reps, lapses, position, suspended, mod }
 *  Review { id (= fecha ms), cardId, deckId, rating, prevState, state, interval, prevInterval, ease, timeMs }
 *  Media  { name, blob }
 */
(function (App) {
  'use strict';
  const U = App.util;
  const DB = App.db;
  const S = (App.store = {});

  const decks = new Map();
  const notes = new Map();
  const cards = new Map();
  const media = new Map(); // name -> { blob, url }
  let revlog = [];
  let settings = {};
  let nextPosition = 1;

  // ---------- Arranque ----------
  S.init = async () => {
    const [d, n, c, r, m, meta] = await Promise.all(DB.STORES.map((s) => DB.getAll(s)));
    for (const x of d) { decks.set(x.id, x); U.bumpId(x.id); }
    for (const x of n) { notes.set(x.id, x); U.bumpId(x.id); }
    for (const x of c) {
      cards.set(x.id, x);
      U.bumpId(x.id);
      if ((x.position || 0) >= nextPosition) nextPosition = x.position + 1;
    }
    revlog = r.sort((a, b) => a.id - b.id);
    for (const x of revlog) U.bumpId(x.id);
    for (const x of m) media.set(x.name, { blob: x.blob, url: null });
    const metaMap = Object.fromEntries(meta.map((x) => [x.key, x.value]));
    settings = { ...App.config.defaults, ...(metaMap.settings || {}) };
    if (!decks.size && !metaMap.seeded) await seed();
  };

  // ---------- Ajustes ----------
  S.settings = () => ({ ...settings });
  S.saveSettings = async (patch) => {
    settings = { ...settings, ...patch };
    await DB.put('meta', { key: 'settings', value: settings });
  };

  // ---------- Mazos ----------
  const nameParts = (name) => name.split('::').map((p) => p.trim());
  const cmpNames = (a, b) => {
    const pa = nameParts(a), pb = nameParts(b);
    for (let i = 0; i < Math.min(pa.length, pb.length); i++) {
      const c = pa[i].localeCompare(pb[i], 'es', { sensitivity: 'base', numeric: true });
      if (c) return c;
    }
    return pa.length - pb.length;
  };
  const cleanName = (name) => nameParts(String(name)).filter(Boolean).join('::');

  S.decks = () => [...decks.values()].sort((a, b) => cmpNames(a.name, b.name));
  S.deck = (id) => decks.get(id);
  S.deckByName = (name) => {
    const n = cleanName(name).toLowerCase();
    for (const d of decks.values()) if (d.name.toLowerCase() === n) return d;
    return null;
  };
  S.shortName = (deck) => nameParts(deck.name).pop();

  /** Devuelve el mazo con ese nombre, creándolo (y a sus padres) si no existe. */
  S.ensureDeck = async (name) => {
    const clean = cleanName(name) || 'Sin nombre';
    const parts = nameParts(clean);
    const created = [];
    let deck = null;
    for (let i = 1; i <= parts.length; i++) {
      const partial = parts.slice(0, i).join('::');
      deck = S.deckByName(partial);
      if (!deck) {
        deck = { id: U.newId(), name: partial, created: Date.now(), mod: Date.now() };
        decks.set(deck.id, deck);
        created.push(deck);
      }
    }
    await DB.put('decks', created);
    return deck;
  };

  S.renameDeck = async (id, newName) => {
    const deck = decks.get(id);
    const clean = cleanName(newName);
    if (!deck || !clean) return;
    const other = S.deckByName(clean);
    if (other && other.id !== id) throw new Error('Ya existe un mazo con ese nombre.');
    const old = deck.name;
    const changed = [];
    for (const d of decks.values()) {
      if (d.id === id || d.name.startsWith(old + '::')) {
        d.name = clean + d.name.slice(old.length);
        d.mod = Date.now();
        changed.push(d);
      }
    }
    await DB.put('decks', changed);
    // Crea los padres si el nuevo nombre los necesita.
    if (clean.includes('::')) await S.ensureDeck(nameParts(clean).slice(0, -1).join('::'));
  };

  /** Ids del mazo y todos sus submazos. */
  S.deckFamilyIds = (id) => {
    const deck = decks.get(id);
    const ids = new Set();
    if (!deck) return ids;
    for (const d of decks.values()) if (d.id === id || d.name.startsWith(deck.name + '::')) ids.add(d.id);
    return ids;
  };

  S.deleteDeck = async (id) => {
    const ids = S.deckFamilyIds(id);
    const noteIds = [...notes.values()].filter((n) => ids.has(n.deckId)).map((n) => n.id);
    await S.deleteNotes(noteIds);
    // Tarjetas sueltas de otras notas que estuvieran en estos mazos -> se borran también.
    const orphan = [...cards.values()].filter((c) => ids.has(c.deckId)).map((c) => c.id);
    orphan.forEach((cid) => cards.delete(cid));
    await DB.del('cards', orphan);
    ids.forEach((d) => decks.delete(d));
    await DB.del('decks', [...ids]);
  };

  S.deckCardCount = (id) => {
    const ids = S.deckFamilyIds(id);
    let n = 0;
    for (const c of cards.values()) if (ids.has(c.deckId)) n++;
    return n;
  };

  // ---------- Notas y tarjetas ----------
  S.note = (id) => notes.get(id);
  S.card = (id) => cards.get(id);
  S.allNotes = () => [...notes.values()];
  S.allCards = () => [...cards.values()];
  S.noteCount = () => notes.size;
  S.cardCount = () => cards.size;
  S.cardsOfNote = (noteId) => [...cards.values()].filter((c) => c.noteId === noteId);
  S.cardsByNote = () => {
    const map = new Map();
    for (const c of cards.values()) {
      if (!map.has(c.noteId)) map.set(c.noteId, []);
      map.get(c.noteId).push(c);
    }
    return map;
  };

  /** Crea una tarjeta nueva (sin guardar). */
  S.makeCard = (note, ord) => ({
    id: U.newId(),
    noteId: note.id,
    deckId: note.deckId,
    ord,
    state: 'new',
    due: 0,
    interval: 0,
    ease: settings.startingEase,
    step: 0,
    reps: 0,
    lapses: 0,
    position: nextPosition++,
    suspended: false,
    mod: Date.now()
  });

  /** Crea o actualiza una nota y sincroniza sus tarjetas. */
  S.saveNote = async ({ id, deckId, type, fields, tags }) => {
    const now = Date.now();
    let note = id ? notes.get(id) : null;
    const deckChanged = note && note.deckId !== deckId;
    if (note) {
      Object.assign(note, { deckId, type, fields, tags, mod: now });
    } else {
      note = { id: U.newId(), guid: U.newGuid(), deckId, type, fields, tags, created: now, mod: now };
      notes.set(note.id, note);
    }
    const wanted = new Set(App.cards.ordsFor(note));
    const existing = S.cardsOfNote(note.id);
    const toDelete = existing.filter((c) => !wanted.has(c.ord));
    const have = new Set(existing.map((c) => c.ord));
    const toAdd = [...wanted].filter((o) => !have.has(o)).map((o) => S.makeCard(note, o));
    const toUpdate = deckChanged ? existing.filter((c) => wanted.has(c.ord)) : [];
    toUpdate.forEach((c) => { c.deckId = deckId; c.mod = now; });
    toDelete.forEach((c) => cards.delete(c.id));
    toAdd.forEach((c) => cards.set(c.id, c));
    await DB.put('notes', note);
    await DB.put('cards', [...toAdd, ...toUpdate]);
    await DB.del('cards', toDelete.map((c) => c.id));
    return note;
  };

  S.deleteNotes = async (ids) => {
    const set = new Set(ids);
    const cardIds = [...cards.values()].filter((c) => set.has(c.noteId)).map((c) => c.id);
    cardIds.forEach((c) => cards.delete(c));
    ids.forEach((n) => notes.delete(n));
    await DB.del('cards', cardIds);
    await DB.del('notes', ids);
  };

  /** Pospone una tarjeta hasta el próximo día de estudio (sin tocar su programación). */
  S.buryCard = async (cardId) => {
    const c = cards.get(cardId);
    if (!c) return;
    c.buriedUntil = U.dayStart(1);
    c.mod = Date.now();
    await DB.put('cards', c);
  };

  S.setSuspended = async (noteId, suspended) => {
    const cs = S.cardsOfNote(noteId);
    cs.forEach((c) => { c.suspended = suspended; c.mod = Date.now(); });
    await DB.put('cards', cs);
  };

  /** Inserción masiva (importaciones). */
  S.importBatch = async ({ notes: ns = [], cards: cs = [], media: ms = [] }) => {
    ns.forEach((n) => notes.set(n.id, n));
    cs.forEach((c) => {
      cards.set(c.id, c);
      if ((c.position || 0) >= nextPosition) nextPosition = c.position + 1;
    });
    ms.forEach((m) => media.set(m.name, { blob: m.blob, url: null }));
    await DB.put('notes', ns);
    await DB.put('cards', cs);
    await DB.put('media', ms);

  S.hasGuid = (() => {
    let cache = null, size = -1;
    return (guid) => {
      if (!cache || size !== notes.size) {
        cache = new Set([...notes.values()].map((n) => n.guid));
        size = notes.size;
      }

  // ---------- Estudio ----------
  /** Colas de estudio de un mazo (incluye submazos) respetando los límites diarios. */
  S.studyState = (deckId, now = Date.now()) => {
    const ids = S.deckFamilyIds(deckId);
    const todayStart = U.dayStart(0, now);
    const tomorrow = U.dayStart(1, now);

    let newDone = 0, revDone = 0;
    // Hermanas: si hoy ya respondiste una tarjeta de una nota, las demás tarjetas
    // nuevas/de repaso de esa nota se posponen a mañana (como «enterrar» en Anki).
    const bury = settings.burySiblings !== false;
    const answeredNotes = new Set(), answeredCards = new Set();
    for (let i = revlog.length - 1; i >= 0; i--) {
      const l = revlog[i];
      if (l.id < todayStart) break;
      if (bury) {
        const ac = cards.get(l.cardId);
        if (ac) { answeredNotes.add(ac.noteId); answeredCards.add(ac.id); }
      }
      if (!ids.has(l.deckId)) continue;
      if (l.prevState === 'new') newDone++;
      else if (l.prevState === 'review') revDone++;
    }

    const learnDue = [], learnLater = [], reviews = [], news = [];
    for (const c of cards.values()) {
      if (!ids.has(c.deckId) || c.suspended) continue;
      if (c.buriedUntil && c.buriedUntil > now) continue; // pospuesta a mano hasta mañana
      const buried = bury && (c.state === 'new' || c.state === 'review') &&
        answeredNotes.has(c.noteId) && !answeredCards.has(c.id);
      if (buried) continue;
      if (c.state === 'new') news.push(c);
      else if (c.state === 'learning' || c.state === 'relearning') {
        if (c.due <= now) learnDue.push(c);
        else if (c.due < tomorrow) learnLater.push(c);
      } else if (c.state === 'review' && c.due < tomorrow) reviews.push(c);
    }
    learnDue.sort((a, b) => a.due - b.due);
    learnLater.sort((a, b) => a.due - b.due);
    reviews.sort((a, b) => a.due - b.due || a.id - b.id);
    news.sort((a, b) => a.position - b.position);

    const newLimited = news.slice(0, Math.max(0, settings.newPerDay - newDone));
    const revLimited = reviews.slice(0, Math.max(0, settings.reviewsPerDay - revDone));

    return {
      learnDue,
      learnLater,
      reviews: revLimited,

    if (st.learnDue.length) { card = st.learnDue[0]; queue = 'learn'; }
    else if (st.reviews.length) { card = st.reviews[0]; queue = 'review'; }
    else if (st.news.length) { card = st.news[0]; queue = 'new'; }
    else if (st.learnLater.length && st.learnLater[0].due - now <= settings.learnAheadMinutes * 60000) {

  };

  S.answer = async (cardId, rating, timeMs) => {
    const card = cards.get(cardId);

    const now = Date.now();
    Object.assign(card, App.scheduler.answer(card, rating, settings, now), { mod: now });
    const log = {
      id: U.newId(), cardId, deckId: card.deckId, rating,
      prevState: prev.state, state: card.state,
      interval: card.interval, prevInterval: prev.interval, ease: card.ease,
      timeMs: Math.min(timeMs, 60000)

      await DB.put('cards', card);
      await DB.put('revlog', log);

    const card = cards.get(prev.id);
    if (!card) return;

    revlog = revlog.filter((l) => l.id !== log.id);
    await DB.put('cards', card);
    await DB.del('revlog', log.id);
  };

  S.todayStats = (now = Date.now()) => {
    const start = U.dayStart(0, now);
    let reviews = 0, timeMs = 0;
    for (let i = revlog.length - 1; i >= 0 && revlog[i].id >= start; i--) { reviews++; timeMs += revlog[i].timeMs || 0; }
    return { reviews, timeMs };
  };

  // ---------- Multimedia ----------
  S.mediaUrl = (name) => {
    const m = media.get(name);
    if (!m) return null;
    if (!m.url) m.url = URL.createObjectURL(m.blob);
    return m.url;
  };
  S.mediaBlob = (name) => media.get(name)?.blob || null;
  S.hasMedia = (name) => media.has(name);

  /** Guarda un archivo y devuelve el nombre definitivo (único). */
  S.addMedia = async (blob, preferredName) => {
    let name = U.safeFilename(preferredName || 'archivo').replace(/\s+/g, '_');
    if (media.has(name)) {
      const dot = name.lastIndexOf('.');
      const [base, ext] = dot > 0 ? [name.slice(0, dot), name.slice(dot)] : [name, ''];
      name = `${base}-${U.newId().toString(36)}${ext}`;
    }
    media.set(name, { blob, url: null });
    await DB.put('media', { name, blob });
    return name;
  };

  // ---------- Copias de seguridad (JSON) ----------
  S.exportBackup = async () => {
    const mediaOut = [];
    for (const [name, m] of media) mediaOut.push({ name, dataUrl: await U.blobToDataUrl(m.blob) });
    return {
      app: App.config.appName,
      format: 1,
      exportedAt: new Date().toISOString(),
      settings,
      decks: [...decks.values()],
      notes: [...notes.values()],
      cards: [...cards.values()],
      revlog,
      media: mediaOut
    };
  };

  S.importBackup = async (data) => {
    if (!data || data.format !== 1 || !Array.isArray(data.notes)) throw new Error('El archivo no es una copia de seguridad válida.');
    const mediaIn = [];
    for (const m of data.media || []) mediaIn.push({ name: m.name, blob: await U.dataUrlToBlob(m.dataUrl) });
    await DB.clear();
    await DB.put('decks', data.decks || []);
    await DB.put('notes', data.notes);
    await DB.put('cards', data.cards || []);
    await DB.put('revlog', data.revlog || []);
    await DB.put('media', mediaIn);
    await DB.put('meta', [{ key: 'settings', value: data.settings || {} }, { key: 'seeded', value: true }]);
  };

  S.resetAll = async () => {
    await DB.clear();
    await DB.put('meta', { key: 'seeded', value: true });
  };

  // ---------- Mazo de ejemplo ----------
  async function seed() {
    const deck = await S.ensureDeck('Bienvenida');
    const samples = [
      { type: 'basic', fields: { front: '¿Qué es el <b>repaso espaciado</b>?', back: 'Una técnica que te muestra cada tarjeta justo antes de que la olvides: cuanto mejor la sabes, más tarda en volver.' } },
      { type: 'basic', fields: { front: '¿Qué significan los botones <i>Otra vez · Difícil · Bien · Fácil</i>?', back: 'Indican lo bien que recordabas la respuesta. Según lo que pulses, la tarjeta vuelve en minutos o en días.' } },
      { type: 'reverse', fields: { front: 'Capital de Japón', back: 'Tokio' } },
      { type: 'cloze', fields: { text: 'El {{c1::corazón}} bombea la sangre y los {{c2::pulmones}} la oxigenan.', extra: 'Las notas de tipo <i>Rellenar huecos</i> crean una tarjeta por cada hueco.' } }
    ];
    for (const s of samples) await S.saveNote({ deckId: deck.id, tags: ['ejemplo'], ...s });
    await DB.put('meta', { key: 'seeded', value: true });
  }

  /** Respuestas registradas desde `ts` en los mazos `deckIds` (Set). Las deshechas ya no están. */
  S.reviewsSince = (ts, deckIds) => {
    const out = [];
    for (let i = revlog.length - 1; i >= 0 && revlog[i].id >= ts; i--) {
      if (!deckIds || deckIds.has(revlog[i].deckId)) out.push(revlog[i]);
    }
    return out.reverse();
  };

  /** Tarjetas hermanas que studyState ha pospuesto hoy (misma regla de «enterrar»). */
  S.buriedSiblingsCount = (deckId, now = Date.now()) => {
    if (settings.burySiblings === false) return 0;
    const ids = S.deckFamilyIds(deckId);
    const todayStart = U.dayStart(0, now);
    const tomorrow = U.dayStart(1, now);
    const answeredNotes = new Set(), answeredCards = new Set();
    for (let i = revlog.length - 1; i >= 0 && revlog[i].id >= todayStart; i--) {
      const ac = cards.get(revlog[i].cardId);
      if (ac) { answeredNotes.add(ac.noteId); answeredCards.add(ac.id); }
    }
    let n = 0;
    for (const c of cards.values()) {
      if (!ids.has(c.deckId) || c.suspended || answeredCards.has(c.id) || !answeredNotes.has(c.noteId)) continue;
      if (c.state === 'new' || (c.state === 'review' && c.due < tomorrow)) n++;
    }
    return n;
  };

  // ---------- Acciones masivas (explorador) ----------
  /** Suspende o reactiva todas las tarjetas de varias notas. */
  S.setSuspendedMany = async (noteIds, suspended) => {
    const set = new Set(noteIds);
    const now = Date.now();
    const cs = [...cards.values()].filter((c) => set.has(c.noteId));
    cs.forEach((c) => { c.suspended = suspended; c.mod = now; });
    await DB.put('cards', cs);
    return cs.length;
  };

  /** Mueve varias notas (y sus tarjetas) a otro mazo. */
  S.moveNotes = async (noteIds, deckId) => {
    if (!decks.has(deckId)) throw new Error('El mazo de destino no existe.');
    const set = new Set(noteIds);
    const now = Date.now();
    const ns = [...notes.values()].filter((n) => set.has(n.id) && n.deckId !== deckId);
    ns.forEach((n) => { n.deckId = deckId; n.mod = now; });
    const moved = new Set(ns.map((n) => n.id));
    const cs = [...cards.values()].filter((c) => moved.has(c.noteId));
    cs.forEach((c) => { c.deckId = deckId; c.mod = now; });
    await DB.put('notes', ns);
    await DB.put('cards', cs);
    return ns.length;
  };

  /** Foto del mazo y la suspensión de varias notas y sus tarjetas (para «Deshacer»). */
  S.snapshotNotes = (noteIds) => {
    const set = new Set(noteIds);
    return {
      notes: [...notes.values()].filter((n) => set.has(n.id)).map((n) => [n.id, n.deckId]),
      cards: [...cards.values()].filter((c) => set.has(c.noteId)).map((c) => [c.id, c.deckId, !!c.suspended])
    };
  };

  /** Restaura una foto de S.snapshotNotes (las notas o mazos ya borrados se ignoran). */
  S.restoreNotes = async (snap) => {
    const now = Date.now();
    const ns = [], cs = [];
    for (const [id, deckId] of snap.notes) {
      const n = notes.get(id);
      if (n && decks.has(deckId) && n.deckId !== deckId) { n.deckId = deckId; n.mod = now; ns.push(n); }
    }
    for (const [id, deckId, susp] of snap.cards) {
      const c = cards.get(id);
      if (!c) continue;
      const d = decks.has(deckId) ? deckId : c.deckId;
      if (c.deckId !== d || !!c.suspended !== susp) { c.deckId = d; c.suspended = susp; c.mod = now; cs.push(c); }
    }
    await DB.put('notes', ns);
    await DB.put('cards', cs);
  };

  /** Número de archivos multimedia guardados (para avisos de borrado). */
  S.mediaCount = () => media.size;
})(window.App);

  <script>
/*
 * Importar / exportar mazos de Anki (.apkg y .colpkg).
 *
 * Un .apkg es un ZIP con:
 *   - collection.anki2 / collection.anki21  -> base de datos SQLite (esquema 11)
 *   - collection.anki21b                    -> SQLite comprimido con zstd (esquema 18, Anki 2.1.50+)
 *   - media                                 -> índice de archivos (JSON, o protobuf+zstd en el formato nuevo)
 *   - 0, 1, 2...                            -> los archivos multimedia
 *
 * Las librerías (JSZip, sql.js, fzstd) se cargan solo cuando hacen falta.
 * Exportamos en formato clásico (collection.anki2), que cualquier versión de Anki importa.
 */
(function (App) {
  'use strict';
  const U = App.util;
  const S = App.store;
  const C = App.cards;
  const A = (App.anki = {});

  const LIBS = {
    jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
    sqljsBase: 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/',
    fzstd: 'https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js'
  };

  let SQL = null;
  async function ensureLibs({ zstd = false } = {}) {
    if (!window.JSZip) await U.loadScript(LIBS.jszip);
    if (!SQL) {
      if (!window.initSqlJs) await U.loadScript(LIBS.sqljsBase + 'sql-wasm.js');
      SQL = await window.initSqlJs({ locateFile: (f) => LIBS.sqljsBase + f });
    }
    if (zstd && !window.fzstd) await U.loadScript(LIBS.fzstd);
  }

  function rows(db, sql, params) {
    const stmt = db.prepare(sql);
    if (params) stmt.bind(params);
    const out = [];
    while (stmt.step()) out.push(stmt.getAsObject());
    stmt.free();
    return out;
  }

  // ---------- Mini lector de protobuf (para el formato nuevo de Anki) ----------
  function readVarint(buf, pos) {
    let result = 0, shift = 0, b;
    do {
      b = buf[pos++];
      result += (b & 0x7f) * Math.pow(2, shift);
      shift += 7;
    } while (b & 0x80 && pos < buf.length);
    return [result, pos];
  }

  /** Recorre los campos de un mensaje protobuf: cb(numCampo, tipo, valor) */
  function protoFields(buf, cb) {
    let pos = 0;
    while (pos < buf.length) {
      let key;
      [key, pos] = readVarint(buf, pos);
      const field = Math.floor(key / 8), wt = key % 8;
      if (wt === 0) { let v; [v, pos] = readVarint(buf, pos); cb(field, wt, v); }
      else if (wt === 2) { let len; [len, pos] = readVarint(buf, pos); cb(field, wt, buf.subarray(pos, pos + len)); pos += len; }
      else if (wt === 5) pos += 4;
      else if (wt === 1) pos += 8;
      else break;
    }
  }

  function parseMediaEntries(buf) {
    const names = [];
    const dec = new TextDecoder();
    protoFields(buf, (f, wt, v) => {
      if (f === 1 && wt === 2) {
        let name = '';
        protoFields(v, (f2, wt2, v2) => { if (f2 === 1 && wt2 === 2) name = dec.decode(v2); });
        names.push(name);
      }
    });
    return names;
  }

  function isClozeConfig(buf) {
    let kind = 0;
    if (buf && buf.length) protoFields(buf, (f, wt, v) => { if (f === 1 && wt === 0) kind = v; });
    return kind === 1;
  }

  // ================= IMPORTAR =================
  /**
   * @param {File} file  .apkg o .colpkg
   * @param {{keepProgress?: boolean}} opts
   * @returns resumen de la importación
   */
  A.importApkg = async (file, { keepProgress = true } = {}) => {
    await ensureLibs();
    const zip = await window.JSZip.loadAsync(file);
    let entry = zip.file('collection.anki21b');
    const zstd = !!entry;
    if (!entry) entry = zip.file('collection.anki21') || zip.file('collection.anki2');
    if (!entry) throw new Error('El archivo no parece un mazo de Anki (.apkg o .colpkg).');
    if (zstd) await ensureLibs({ zstd: true });

    let bytes = await entry.async('uint8array');
    if (zstd) bytes = window.fzstd.decompress(bytes);

    const db = new SQL.Database(bytes);
    let parsed;
    try {
      parsed = readCollection(db);
    } finally {
      db.close();
    }

    const mediaMap = {};
    const mf = zip.file('media');

      try {
        if (zstd) parseMediaEntries(window.fzstd.decompress(await mf.async('uint8array'))).forEach((n, i) => { if (n) mediaMap[String(i)] = n; });
