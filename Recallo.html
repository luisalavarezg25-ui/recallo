    if (!UI.icons.pause) UI.icons.pause = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>';
    // Fechas sin el año cuando es el actual.
    const fmtDay = (ts) => {
      const d = new Date(ts);
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return d.toLocaleDateString('es-ES', sameYear ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
    };

    function collect() {
      elFields.querySelectorAll('.rich').forEach((r) => (values[r.dataset.key] = C.fromEditHtml(r.innerHTML)));
    }

    // ---------- Estado «sin guardar» ----------
    const tagsOf = () => view.querySelector('#ed-tags').value.trim().split(/[\s,]+/).filter(Boolean);
    function snapshot() {
      collect();
      const f = {};
      C.TYPES[type].fields.forEach(([k]) => (f[k] = values[k] || ''));
      // Un formulario nuevo sin texto no queda «sin guardar» solo por cambiar tipo o mazo.
      if (!editing && !Object.values(f).some(Boolean)) return JSON.stringify({ tags: tagsOf() });
      return JSON.stringify({ type, deck: +view.querySelector('#ed-deck').value, f, tags: tagsOf() });
    }
    let clean = '';
    let discarding = false;
    const markClean = () => { clean = snapshot(); };
    const isDirty = () => snapshot() !== clean;

    async function leave(target) {
      if (isDirty() && !(await UI.confirm('¿Descartar los cambios?', 'Has hecho cambios que no se han guardado. Si sales ahora, se perderán.', 'Descartar cambios', true))) return;
      discarding = true;
      draftDel(draftKey);
      location.hash = target;
    }

    const onBeforeUnload = (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', onBeforeUnload);
    UI.onLeave(() => {
      window.removeEventListener('beforeunload', onBeforeUnload);
      // Salida por un enlace o por el Atrás del navegador: se guarda un borrador para recuperarlo.
      if (!discarding && view.querySelector('#ed-form') && isDirty()) {
        draftSet(draftKey, { type, deck: +view.querySelector('#ed-deck').value, values: { ...values }, tags: tagsOf(), at: Date.now() });
      }
    });

    function updateMeta() {
      const m = view.querySelector('#ed-meta');
      if (!m) return;
      m.textContent = `${cards.length} tarjeta${cards.length === 1 ? '' : 's'} · creada el ${fmtDay(note.created)}`;
      const sb = view.querySelector('#ed-suspended');
      if (sb) sb.hidden = !suspended;
    }

    function renderFields() {
      view.querySelector('#ed-type-hint').innerHTML = hints[type];
      // Orden del DOM: título, campo, barra de formato (el foco llega antes al texto que a la barra);
      // la barra se coloca visualmente junto al título con CSS.
      elFields.innerHTML = C.TYPES[type].fields.map(([key, label]) => {
        const isClozeText = type === 'cloze' && key === 'text';
        const describedBy = fieldHelp[key] ? `help-${key}` : '';
        return `
        <div class="field ed-field" data-field="${key}">
          <div class="field-title">
            <span class="field-label" id="lbl-${key}">${label}</span>
            ${fieldHelp[key] ? `<small class="field-help" id="help-${key}">${fieldHelp[key]}</small>` : ''}
          </div>
          <div class="rich" contenteditable="true" data-key="${key}" role="textbox" aria-multiline="true" aria-labelledby="lbl-${key}"${describedBy ? ` aria-describedby="${describedBy}"` : ''} data-describedby="${describedBy}" spellcheck="true"></div>
          <div class="toolbar" role="toolbar" aria-label="Formato de ${label}">
            <button type="button" data-cmd="bold" aria-label="Negrita" aria-pressed="false" title="Negrita (Ctrl+B)" tabindex="0"><span class="tb-b" aria-hidden="true">B</span></button>
            <button type="button" data-cmd="italic" aria-label="Cursiva" aria-pressed="false" title="Cursiva (Ctrl+I)" tabindex="-1"><span class="tb-i" aria-hidden="true">I</span></button>
            <button type="button" data-cmd="underline" aria-label="Subrayado" aria-pressed="false" title="Subrayado (Ctrl+U)" tabindex="-1"><span class="tb-u" aria-hidden="true">U</span></button>
            <button type="button" data-cmd="image" aria-label="Insertar imagen" title="Insertar imagen" tabindex="-1">${UI.icons.image}</button>
            ${isClozeText ? `
            <button type="button" data-cmd="cloze" class="cloze-btn" aria-label="Ocultar selección como hueco nuevo" title="Hueco nuevo (Ctrl+Alt+C)" tabindex="-1"><span aria-hidden="true">[ … ]</span></button>
            <button type="button" data-cmd="cloze-same" class="cloze-btn cloze-same" aria-label="Ocultar selección con el mismo número que el último hueco" title="Mismo número que el último hueco (Ctrl+Alt+Mayús+C)" tabindex="-1"><span aria-hidden="true">Mismo nº</span></button>` : ''}
          </div>
          <p class="field-error" id="err-${key}" hidden></p>
          ${isClozeText ? '<div class="cloze-list" id="cloze-list" aria-label="Huecos de la nota"></div>' : ''}
        </div>`;
      }).join('');
      elFields.querySelectorAll('.rich').forEach((r) => {
        r.innerHTML = C.toEditHtml(values[r.dataset.key] || '');
        r.addEventListener('paste', onPaste);
        r.addEventListener('input', () => { clearError(r.dataset.key); highlightClozes(); });
        r.addEventListener('keyup', syncPressed);
        r.addEventListener('mouseup', syncPressed);
        r.addEventListener('focus', syncPressed);
      });
      elFields.querySelectorAll('.toolbar').forEach((tb) => {
        const btns = [...tb.querySelectorAll('button')];
        // Una sola parada de tabulación por barra; las flechas recorren los botones.
        tb.addEventListener('keydown', (e) => {
          const i = btns.indexOf(document.activeElement);
          if (i < 0) return;
          let j = null;
          if (e.key === 'ArrowRight') j = (i + 1) % btns.length;
          else if (e.key === 'ArrowLeft') j = (i - 1 + btns.length) % btns.length;
          else if (e.key === 'Home') j = 0;
          else if (e.key === 'End') j = btns.length - 1;
          if (j == null) return;
          e.preventDefault();
          btns.forEach((b, k) => (b.tabIndex = k === j ? 0 : -1));
          btns[j].focus();
        });
        btns.forEach((b) => {
          b.addEventListener('mousedown', (e) => e.preventDefault()); // conserva la selección
          b.addEventListener('click', (e) => runCmd(b.dataset.cmd, b.closest('.field').querySelector('.rich'), { same: b.dataset.cmd === 'cloze-same' || e.shiftKey || e.altKey }));
        });
      });
      highlightClozes();
    }

    // Estado pulsado de B/I/U según la selección.
    function syncPressed() {
      const rich = document.activeElement && document.activeElement.closest && document.activeElement.closest('.rich');
      if (!rich) return;
      rich.closest('.field').querySelectorAll('[data-cmd=bold],[data-cmd=italic],[data-cmd=underline]').forEach((b) => {
        let on = false;
        try { on = document.queryCommandState(b.dataset.cmd); } catch (e) { /* no disponible */ }
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    // Texto plano de un campo con un mapa posición → (nodo, desplazamiento).
    function textMap(rich) {
      const nodes = [];
      let text = '';
      const w = document.createTreeWalker(rich, NodeFilter.SHOW_TEXT);
      for (let n = w.nextNode(); n; n = w.nextNode()) { nodes.push([n, text.length]); text += n.data; }
      const at = (pos) => {
        for (let i = nodes.length - 1; i >= 0; i--) if (nodes[i][1] <= pos) return [nodes[i][0], Math.min(pos - nodes[i][1], nodes[i][0].data.length)];
        return null;
      };
      const range = (from, to) => {
        const a = at(from), b = at(to);
        if (!a || !b) return null;
        const r = new Range();
        try { r.setStart(a[0], a[1]); r.setEnd(b[0], b[1]); return r; } catch (e) { return null; }
      };
      return { text, at, range };
    }

    // Huecos como fichas de tinta, sin tocar el HTML guardado (CSS Custom Highlight API):
    // fondo en todo el hueco, la sintaxis «{{ :: }}» casi invisible y el número como sello.
    const HL = ['recallo-cloze', 'recallo-cloze-syntax', 'recallo-cloze-num'];
    function highlightClozes() {
      const hasApi = window.CSS && CSS.highlights && window.Highlight;
      const whole = [], syntax = [], nums = [];
      const rich = elFields.querySelector('.rich[data-key="text"]');
      const gaps = [];
      if (rich && type === 'cloze') {
        const tm = textMap(rich);
        for (const m of tm.text.matchAll(CLOZE_RE)) {
          const start = m.index, end = m.index + m[0].length;
          const openLen = `{{c${m[1]}::`.length;
          const ansEnd = start + openLen + m[2].length;
          gaps.push({ n: +m[1], answer: m[2], hint: m[3] || '', ansStart: start + openLen });
          if (!hasApi) continue;
          [tm.range(start, end)].forEach((r) => r && whole.push(r));
          [tm.range(start, start + 2), tm.range(start + 2 + 1 + m[1].length, start + openLen), tm.range(ansEnd, end)].forEach((r) => r && syntax.push(r));
          const rn = tm.range(start + 2, start + 3 + m[1].length);
          if (rn) nums.push(rn);
        }
      }
      if (hasApi) {
        const h0 = new Highlight(...whole), h1 = new Highlight(...syntax), h2 = new Highlight(...nums);
        h1.priority = 1; h2.priority = 2;
        CSS.highlights.set(HL[0], h0); CSS.highlights.set(HL[1], h1); CSS.highlights.set(HL[2], h2);
      }
      renderClozeList(gaps);
    }
    UI.onLeave(() => { if (window.CSS && CSS.highlights) HL.forEach((k) => CSS.highlights.delete(k)); });

    // Lista de huecos bajo el texto: número, respuesta y × para quitar el hueco (deja el texto).
    function renderClozeList(gaps) {
      const box = view.querySelector('#cloze-list');
      if (!box) return;
      box.hidden = !gaps.length;
      box.innerHTML = gaps.map((g, i) => {
        const ans = g.answer.trim() || 'vacío';
        return `<span class="cloze-chip${g.answer.trim() ? '' : ' is-empty'}">
          <span class="cloze-chip-n" aria-hidden="true">${g.n}</span>
          <span class="cloze-chip-t">${U.esc(ans)}${g.hint ? ` <i>· ${U.esc(g.hint)}</i>` : ''}</span>
          <button type="button" class="cloze-chip-x" data-i="${i}" aria-label="Quitar el hueco ${g.n} (${U.esc(ans)}) y dejar el texto">×</button>
        </span>`;
      }).join('');
      box.querySelectorAll('.cloze-chip-x').forEach((b) => (b.onclick = () => removeCloze(+b.dataset.i)));
    }
    function removeCloze(index) {
      const rich = elFields.querySelector('.rich[data-key="text"]');
      if (!rich) return;
      const html = C.fromEditHtml(rich.innerHTML);
      let i = -1;
      const next = html.replace(CLOZE_RE, (all, n, ans) => (++i === index ? ans : all));
      values.text = next;
      rich.innerHTML = C.toEditHtml(next);
      clearError('text');
      highlightClozes();
      rich.focus();
    }

    // ---------- Errores en línea ----------
    // caretAt: posición (en el texto plano del campo) donde dejar el cursor.
    function setError(key, msg, caretAt = null) {
      const rich = elFields.querySelector(`.rich[data-key="${key}"]`);
      const err = view.querySelector(`#err-${key}`);
      if (!rich || !err) return UI.toast(msg);
      err.textContent = msg;
      err.hidden = false;
      rich.setAttribute('aria-invalid', 'true');
      rich.setAttribute('aria-describedby', [`err-${key}`, rich.dataset.describedby].filter(Boolean).join(' '));
      rich.focus();
      if (caretAt != null) {
        const pos = textMap(rich).at(caretAt);
        if (pos) { const sel = window.getSelection(); sel.removeAllRanges(); const r = new Range(); r.setStart(pos[0], pos[1]); sel.addRange(r); }
      }
    }
    function clearError(key) {
      const rich = elFields.querySelector(`.rich[data-key="${key}"]`);
      const err = view.querySelector(`#err-${key}`);
      if (err && !err.hidden) { err.hidden = true; err.textContent = ''; }
      if (rich) {
        rich.removeAttribute('aria-invalid');
        if (rich.dataset.describedby) rich.setAttribute('aria-describedby', rich.dataset.describedby);
        else rich.removeAttribute('aria-describedby');
      }
    }

    // Campos equivalentes al cambiar de tipo (sin arrastrar la sintaxis de huecos a una básica).
    view.querySelector('#ed-type').onchange = (e) => {
      collect();
      const nt = e.target.value;
      // Lo que se ve ahora manda: se copia siempre desde los campos del tipo actual.
      if (nt === 'cloze' && type !== 'cloze') { values.text = values.front || ''; values.extra = values.back || ''; }
      if (nt !== 'cloze' && type === 'cloze') { values.front = unCloze(values.text); values.back = values.extra || ''; }
      type = nt;
      renderFields();
    };

    let savedRange = null;
    function saveRange(rich) {
      const sel = window.getSelection();
      savedRange = sel.rangeCount && rich.contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null;
    }
    function restoreRange(rich) {
      rich.focus();
      if (savedRange) {
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }

    async function insertImage(file, rich) {
      const ext = (file.type.split('/')[1] || 'png').replace('jpeg', 'jpg').replace('svg+xml', 'svg');
      const base = file.name && file.name !== 'image.png' ? file.name : `imagen-${Date.now()}.${ext}`;
      const name = await S.addMedia(file, base);
      restoreRange(rich);
      document.execCommand('insertHTML', false, `<img src="${S.mediaUrl(name)}" data-media="${U.esc(name)}" alt="">`);
    }

    function insertCloze(rich, same) {
      rich.focus();
      const nums = C.clozeNumbers(C.fromEditHtml(rich.innerHTML));
      const last = nums.length ? Math.max(...nums) : 0;
      const n = same ? Math.max(1, last) : last + 1;
      const sel = window.getSelection();
      const range = sel.rangeCount && rich.contains(sel.anchorNode) ? sel.getRangeAt(0) : null;
      if (range && !range.collapsed) {
        // Conserva el formato de la selección (negrita, etc.) dentro del hueco.
        const box = document.createElement('div');
        box.appendChild(range.cloneContents());
        const html = box.innerHTML;
        if (html === U.esc(sel.toString())) document.execCommand('insertText', false, `{{c${n}::${sel.toString()}}}`);
        else document.execCommand('insertHTML', false, `{{c${n}::${html}}}`);
      } else {
        // Sin selección: hueco vacío con el cursor dentro, listo para escribir la respuesta.
        document.execCommand('insertText', false, `{{c${n}::}}`);
        const s = window.getSelection();
        if (s.modify) { s.modify('move', 'backward', 'character'); s.modify('move', 'backward', 'character'); }
      }
      highlightClozes();
    }

    async function runCmd(cmd, rich, opts = {}) {
      if (cmd === 'image') {
        saveRange(rich);
        const file = await UI.pickFile('image/*');
        if (file) await insertImage(file, rich);
        return;
      }
      if (cmd === 'cloze' || cmd === 'cloze-same') return insertCloze(rich, opts.same);
      rich.focus();
      document.execCommand(cmd);
      syncPressed();
    }

    async function onPaste(e) {
      const items = [...(e.clipboardData?.items || [])];
      const img = items.find((i) => i.kind === 'file' && i.type.startsWith('image/'));
      e.preventDefault();
      if (img) {
        saveRange(e.currentTarget);
        await insertImage(img.getAsFile(), e.currentTarget);
      } else {
        document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
      }
    }

    let saving = false;
    async function save() {
      if (saving) return;
      collect();
      const deckSel = +view.querySelector('#ed-deck').value;
      const fields = {};
      C.TYPES[type].fields.forEach(([k]) => (fields[k] = values[k] || ''));
      const pk = C.primaryField(type);
      const primary = fields[pk];
      if (!primary) return setError(pk, type === 'cloze' ? 'Escribe el texto y oculta al menos una palabra con [ … ].' : 'Escribe el anverso: es lo que verás al estudiar.');
      if (type === 'cloze') {
        const all = [...primary.matchAll(CLOZE_RE)];
        if (!all.length) return setError(pk, 'Marca al menos un hueco: selecciona una palabra y pulsa [ … ].');
        const empty = all.find((m) => !U.stripHtml(m[2]).trim() && !/<img/i.test(m[2]));
        if (empty) {
          // El cursor queda dentro del hueco vacío, listo para escribir la respuesta.
          const rich = elFields.querySelector('.rich[data-key="text"]');
          const hit = rich && [...textMap(rich).text.matchAll(CLOZE_RE)].find((m) => !m[2].trim());
          return setError(pk, `El hueco ${empty[1]} está vacío: escribe la respuesta o quítalo.`, hit ? hit.index + `{{c${hit[1]}::`.length : null);
        }
      }
      const tags = tagsOf();

      // Cambiar el tipo (o quitar huecos) de una nota guardada puede borrar tarjetas: se avisa antes.
      if (editing) {
        const wanted = new Set(C.ordsFor({ ...note, type, fields }));
        const lost = S.cardsOfNote(note.id).filter((c) => !wanted.has(c.ord));
        if (lost.length) {
          const ok = await UI.confirm('¿Eliminar tarjetas?', `Con este cambio se eliminará${lost.length === 1 ? '' : 'n'} ${lost.length} tarjeta${lost.length === 1 ? '' : 's'} con su progreso. No se puede deshacer.`, `Eliminar ${lost.length} y guardar`, true);
          if (!ok) return;
        }
      }

      saving = true;
      let saved;
      try {
        saved = await S.saveNote({ id: note?.id, deckId: deckSel, type, fields, tags });
      } catch (err) {
        console.error(err);
        return UI.toast('No se pudo guardar. Inténtalo de nuevo.');
      } finally {
        saving = false;
      }
      draftDel(draftKey);
      if (editing) {
        discarding = true;
        UI.toast('Cambios guardados');
        location.hash = backTarget;
      } else {
        await S.saveSettings({ lastType: type, lastDeckId: deckSel, lastTags: tags });
        // Se vacían TODOS los campos (también los de otros tipos), para que no reaparezcan.
        Object.keys(values).forEach((k) => (values[k] = ''));
        renderFields();
        markClean();
        elFields.querySelector('.rich').focus();
        const n = saved ? S.cardsOfNote(saved.id).length : 1;
        UI.toast(`${n === 1 ? 'Añadida 1 tarjeta' : `Añadidas ${n} tarjetas`} a «${S.shortName(S.deck(deckSel))}»`);
      }
    }

    view.querySelector('#ed-form').onsubmit = (e) => { e.preventDefault(); save(); };

    // Eliminar y suspender viven en «Más» (no junto a Guardar).
    function moreActions() {
      UI.sheet('Nota', [
        { label: suspended ? 'Reactivar: volver a estudiarla' : 'Suspender: no estudiarla por ahora', icon: suspended ? 'play' : 'pause', onClick: toggleSuspend },
        { label: 'Eliminar nota', icon: 'trash', danger: true, onClick: removeNote }
      ]);
    }
    async function toggleSuspend() {
      await S.setSuspended(note.id, !suspended);
      suspended = !suspended;
      const hadFocus = document.activeElement && document.activeElement.id === 'ed-reactivate';
      updateMeta(); // en el sitio: no se vuelve a pintar el formulario ni se pierden cambios
      if (hadFocus) elFields.querySelector('.rich').focus();
      UI.toast(suspended ? 'Nota suspendida: sus tarjetas no aparecerán al estudiar' : 'Nota reactivada');
    }
    async function removeNote() {
      const ok = await UI.confirm('Eliminar nota', `Se eliminará esta nota y su${cards.length === 1 ? '' : 's'} ${cards.length} tarjeta${cards.length === 1 ? '' : 's'}, con su progreso. No se puede deshacer.`, 'Eliminar', true);
      if (!ok) return;
      await S.deleteNotes([note.id]);
      discarding = true;
      draftDel(draftKey);
      UI.toast('Nota eliminada');
      location.hash = /^#\/(study|edit)\//.test(backTarget) ? `#/deck/${note.deckId}` : backTarget;
    }

    function onKey(e) {
      if (document.querySelector('#modal[open]')) return;
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); save(); }
      // Ctrl+Alt+C: hueco nuevo; Ctrl+Alt+Mayús+C: mismo número (Ctrl+Mayús+C lo reservan las herramientas del navegador).
      if (e.ctrlKey && e.altKey && e.code === 'KeyC' && type === 'cloze') {
        const rich = elFields.querySelector('.rich[data-key="text"]');
        if (rich && rich.contains(document.activeElement)) { e.preventDefault(); insertCloze(rich, e.shiftKey); }
      }
    }
    document.addEventListener('keydown', onKey);
    UI.onLeave(() => document.removeEventListener('keydown', onKey));

    renderFields();
    updateMeta();
    markClean();
    const reBtn = view.querySelector('#ed-reactivate');
    if (reBtn) reBtn.onclick = toggleSuspend;

    // ¿Borrador pendiente de una salida anterior sin guardar?
    const draft = draftGet(draftKey);
    if (draft && draft.values) {
      const box = view.querySelector('#ed-draft');
      box.hidden = false;
      view.querySelector('#ed-draft-restore').onclick = () => {
        type = C.TYPES[draft.type] ? draft.type : type;
        view.querySelector('#ed-type').value = type;
        if (S.deck(draft.deck)) view.querySelector('#ed-deck').value = draft.deck;
        Object.assign(values, draft.values);
        view.querySelector('#ed-tags').value = (draft.tags || []).join(' ');
        renderFields();
        box.hidden = true;
        draftDel(draftKey);
        elFields.querySelector('.rich').focus();
      };
      view.querySelector('#ed-draft-discard').onclick = () => { box.hidden = true; draftDel(draftKey); };
    }
    if (!editing) elFields.querySelector('.rich').focus();
  };
})(window.App);

</script>
  <script>
/* Explorador: lista, búsqueda, filtros y acciones masivas sobre las notas de un mazo (o de todos). */
(function (App) {
  'use strict';
  const U = App.util, S = App.store, UI = App.ui, C = App.cards;
  const V = App.views;
  const PAGE = 50;
  const DAY = 86400000;
  const CLOZE = /\{\{c\d+::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g;

  const FILTERS = [
    ['all', 'Todas'], ['new', 'Nuevas'], ['learn', 'Aprendiendo'], ['review', 'Repaso'], ['suspended', 'Suspendidas']
  ];
  const SORTS = [['recent', 'Más recientes'], ['alpha', 'Alfabético'], ['due', 'Próximo repaso']];

  // ---------- Estado guardado por mazo (sobrevive a la ida y vuelta al editor) ----------
  const keyFor = (deckId) => `recallo.browse.${deckId ?? 'all'}`;
  const ss = {
    get(k) { try { return JSON.parse(sessionStorage.getItem(k) || 'null'); } catch { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* sin almacenamiento */ } },
    del(k) { try { sessionStorage.removeItem(k); } catch { /* sin almacenamiento */ } }
  };
  const RESTORE = 'recallo.browse.restore';

  /**
   * La posición solo se restaura en la ida y vuelta explorador -> editor -> explorador.
   * Al abrir una nota se instala este vigilante, que se retira solo: si desde el editor se va
   * a cualquier otra pantalla, olvida la marca de restauración.
   */
  function watchReturn() {
    const onHash = () => {
      if (/^#\/edit\//.test(location.hash)) return;
      if (!/^#\/browse\//.test(location.hash)) ss.del(RESTORE);
      window.removeEventListener('hashchange', onHash);
    };
    // Se instala después del cambio a #/edit (que ya está en curso) para no retirarse en él.
    setTimeout(() => window.addEventListener('hashchange', onHash), 0);
  }

  /** «en 8 min», «en 2 h», «ahora» para tarjetas en aprendizaje. */
  function fmtSoon(ts) {
    const m = (ts - Date.now()) / 60000;
    if (m <= 0) return 'ahora';
    if (m < 1440) return `en ${U.fmtMinutes(m)}`;
    return fmtDue(ts);
  }

  /** Fecha corta: «hoy», «mañana», «16 nov» (el año solo si no es el actual). */
  function fmtDue(ts) {
    const today = U.dayStart(0);
    if (ts < today + DAY) return 'hoy';
    if (ts < today + 2 * DAY) return 'mañana';
    const d = new Date(ts);
    const opts = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString('es', opts).replace('.', '');
  }

  /** Segmentos del título: texto normal y huecos (cloze) resueltos. */
  function titleSegments(note) {
    const raw = U.stripHtml(note.fields[C.primaryField(note.type)] || '');
    if (note.type !== 'cloze') return [{ t: raw, gap: false }];
    const out = [];
    let last = 0;
    for (const m of raw.matchAll(CLOZE)) {
      if (m.index > last) out.push({ t: raw.slice(last, m.index), gap: false });
      out.push({ t: m[1], gap: true });
      last = m.index + m[0].length;
    }
    if (last < raw.length) out.push({ t: raw.slice(last), gap: false });
    return out;
  }

  /** Estado resumido de una nota a partir de sus tarjetas. */
  function noteStatus(cs) {
    const active = cs.filter((c) => !c.suspended);
    const info = { key: 'new', due: Infinity, partial: active.length > 0 && active.length < cs.length, susp: cs.length - active.length, total: cs.length };
    if (!cs.length) return info;
    if (!active.length) return { ...info, key: 'suspended' };
    const learn = active.filter((c) => c.state === 'learning' || c.state === 'relearning');
    if (learn.length) return { ...info, key: 'learn', due: Math.min(...learn.map((c) => c.due)) };
    const rev = active.filter((c) => c.state === 'review');
    if (rev.length) return { ...info, key: 'review', due: Math.min(...rev.map((c) => c.due)) };
    return info;
  }

  V.browse = (deckId) => {
    const deck = deckId ? S.deck(deckId) : null;
    if (deckId && !deck) return void (location.hash = '#/');
    const key = keyFor(deckId);
    const addHref = deck ? `#/add/${deckId}` : '#/add';

    UI.setHeader({
      title: deck ? S.shortName(deck) : 'Todas las notas',
      back: deck ? `#/deck/${deckId}` : '#/',
      actions: [{ icon: 'plus', label: 'Añadir tarjeta', onClick: () => (location.hash = addHref) }]
    });

    // ---------- Datos ----------
    const ids = deck ? S.deckFamilyIds(deckId) : null;
    let all = [];
    function load() {
      const byNote = S.cardsByNote();
      all = S.allNotes()
        .filter((n) => !ids || ids.has(n.deckId))
        .map((n) => {
          const cs = byNote.get(n.id) || [];
          const segs = titleSegments(n);
          const title = segs.map((s) => s.t).join('').trim();
          const text = Object.values(n.fields).map((f) => U.stripHtml(f).replace(CLOZE, '$1')).join(' ');
          const pk = C.primaryField(n.type);
          const body = Object.entries(n.fields).filter(([k]) => k !== pk)
            .map(([, f]) => U.stripHtml(f).replace(CLOZE, '$1')).join(' · ');
          return {
            note: n, cards: cs, segs, title, body,
            titleFold: U.fold(`${title} ${(n.tags || []).join(' ')}`),
            st: noteStatus(cs),
            sortTitle: U.fold(title),
            search: U.fold(`${text} ${(n.tags || []).join(' ')}`)
          };
        });
    }
    load();

    // ---------- Estado de la vista ----------
    const saved = ss.get(key) || {};
    const restoring = ss.get(RESTORE) === key;
    const state = {
      q: restoring ? saved.q || '' : '',
      f: restoring ? saved.f || 'all' : 'all',
      sort: saved.sort || 'recent',
      shown: 0,
      selecting: false
    };
    const selected = new Set();
    let matched = [];   // tras la búsqueda (antes del filtro de estado)
    let filtered = [];  // tras búsqueda + filtro + orden

    const view = UI.render(`
      <div class="browse">
        <div class="browse-empty" id="b-empty" hidden></div>
        <div id="b-main">
          <div class="search-box">
            <input type="search" id="q" placeholder="Buscar en el texto o en las etiquetas" aria-label="Buscar notas"
              spellcheck="false" autocomplete="off" enterkeyhint="search">
          </div>
          <div class="browse-tools">
            <div class="filter-chips" role="group" aria-label="Filtrar por estado" id="b-filters"></div>
            <div class="browse-tools-row">
              <label class="sort-field"><span>Ordenar</span>
                <select id="b-sort">${SORTS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
              </label>
              <button type="button" class="btn btn-quiet" id="b-select" aria-pressed="false">Seleccionar</button>
            </div>
          </div>
          <p class="browse-count" id="b-count" aria-live="polite"></p>
          <h2 class="visually-hidden" id="b-heading">Notas</h2>
          <ul class="note-list" id="b-list" aria-labelledby="b-heading"></ul>
          <button type="button" class="btn btn-block btn-more" id="b-more" hidden></button>
        </div>
        <div class="bulk-bar" id="b-bulk" role="region" aria-label="Acciones de selección" hidden>
          <div class="bulk-inner">
            <p class="bulk-count"><span id="b-bulk-count" tabindex="-1" aria-live="polite"></span>
              <button type="button" class="link-btn" id="b-rest" hidden></button></p>
            <div class="bulk-actions">
              <button type="button" class="btn btn-quiet" id="b-all">Visibles</button>
              <button type="button" class="btn" id="b-susp" disabled>Suspender</button>
              <button type="button" class="btn" id="b-move" disabled>Mover…</button>
              <button type="button" class="btn btn-danger-ghost" id="b-del" disabled>Eliminar</button>
            </div>
          </div>
        </div>
        <div class="browse-undo" id="b-undo" role="status" hidden>
          <span id="b-undo-msg"></span>
          <button type="button" class="link-btn" id="b-undo-btn">Deshacer</button>
        </div>
        <button type="button" class="to-top" id="b-top" aria-label="Volver arriba" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>`);

    const $ = (s) => view.querySelector(s);
    const elQ = $('#q'), elList = $('#b-list'), elMore = $('#b-more'), elCount = $('#b-count');
    const elFilters = $('#b-filters'), elSort = $('#b-sort'), elSel = $('#b-select');
    const elBulk = $('#b-bulk'), elTop = $('#b-top');
    elQ.value = state.q;
    elSort.value = state.sort;

    function persist(extra = {}) {
      const prev = ss.get(key) || {};
      ss.set(key, { anchor: prev.anchor, offset: prev.offset, q: state.q, f: state.f, sort: state.sort, shown: state.shown, ...extra });
    }
    /** El usuario ha cambiado la vista: ya no hay posición que restaurar. */
    function forget() {
      ss.del(RESTORE);
      const p = ss.get(key) || {};
      delete p.anchor; delete p.offset;
      ss.set(key, p);
    }

    // ---------- Filtrado y orden ----------
    function compute() {
      const terms = U.fold(state.q).split(/\s+/).filter(Boolean);
      matched = terms.length ? all.filter((x) => terms.every((t) => x.search.includes(t))) : all;
      filtered = state.f === 'all' ? matched.slice() : matched.filter((x) => x.st.key === state.f);
      const byId = (a, b) => b.note.id - a.note.id;
      if (state.sort === 'alpha') {
        filtered.sort((a, b) => a.sortTitle.localeCompare(b.sortTitle, 'es', { numeric: true }) || a.note.id - b.note.id);
      } else if (state.sort === 'due') {
        const rank = (x) => (x.st.key === 'suspended' ? 2 : x.st.due === Infinity ? 1 : 0);
        filtered.sort((a, b) => rank(a) - rank(b) || (rank(a) === 0 ? a.st.due - b.st.due : 0) || a.note.id - b.note.id);
      } else {
        filtered.sort((a, b) => (b.note.created || 0) - (a.note.created || 0) || byId(a, b));
      }
      return terms;
    }

    function renderFilters() {
      const counts = { all: matched.length, new: 0, learn: 0, review: 0, suspended: 0 };
      matched.forEach((x) => counts[x.st.key]++);
      elFilters.innerHTML = FILTERS.map(([v, l]) => `
        <button type="button" class="chip" data-f="${v}" aria-pressed="${state.f === v}">
          <span>${l}</span> <span class="chip-n">${counts[v]}</span>
        </button>`).join('');
      chipFade();
    }

    function pill(st) {
      if (st.key === 'suspended') return '<span class="tag tag-susp">Suspendida</span>';
      if (st.key === 'learn') return `<span class="tag tag-learn">Aprendiendo · ${fmtSoon(st.due)}</span>`;
      if (st.key === 'review') return `<span class="tag tag-due">Repaso ${fmtDue(st.due)}</span>`;
      return '<span class="tag tag-new">Nueva</span>';
    }

    let terms = [];
    function titleHtml(x) {
      if (!x.title) return '<span class="note-empty">(vacía)</span>';
      let budget = 160;
      let out = '';
      for (const s of x.segs) {
        if (budget <= 0) break;
        let t = s.t;
        if (t.length > budget) t = t.slice(0, budget - 1) + '…';
        budget -= t.length;
        const h = U.highlight(t, terms);
        out += s.gap ? `<span class="gap">${h}</span>` : h;
      }
      return out;
    }

    function rowHtml(x) {
      const n = x.note;
      const meta = [`<span class="meta-type">${C.TYPES[n.type].label}</span>`];
      if (!deck || n.deckId !== deckId) {
        const d = S.deck(n.deckId);
        if (d) meta.push(`<span class="meta-item">${U.esc(S.shortName(d))}</span>`);
      }
      if ((n.tags || []).length) meta.push(`<span class="meta-item">${U.highlight(n.tags.join(', '), terms)}</span>`);
      if (x.st.partial) {
        meta.push(`<span class="meta-item meta-partial">${x.st.susp} de ${x.st.total} tarjetas suspendida${x.st.susp === 1 ? '' : 's'}</span>`);
      }
      // Si la búsqueda coincide fuera del título (reverso, extra…), una línea de contexto.
      let hit = '';
      if (terms.length && x.body && !terms.every((t) => x.titleFold.includes(t))) {
        const ex = U.excerpt(x.body, terms);
        if (ex) hit = `<span class="note-hit">${ex}</span>`;
      }
      const body = `<span class="note-title">${titleHtml(x)}</span>${hit}
          <span class="note-meta">${pill(x.st)}${meta.join('')}</span>`;
      if (state.selecting) {
        const on = selected.has(n.id);
        return `<li data-id="${n.id}"><label class="note-row is-selectable${on ? ' is-selected' : ''}">
          <input type="checkbox" class="note-check" value="${n.id}"${on ? ' checked' : ''}>
          <span class="note-body">${body}</span></label></li>`;
      }
      return `<li data-id="${n.id}"><a href="#/edit/${n.id}" class="note-row">${body}</a></li>`;
    }

    function updateCount() {
      const total = filtered.length;
      if (!total) { elCount.textContent = ''; return; }
      if (state.shown < total) {
        elCount.textContent = `Mostrando ${state.shown} de ${total} nota${total === 1 ? '' : 's'}`;
      } else {
        const nc = filtered.reduce((s, x) => s + x.cards.length, 0);
        elCount.textContent = `${total} nota${total === 1 ? '' : 's'} · ${nc} tarjeta${nc === 1 ? '' : 's'}`;
      }
      const rem = total - state.shown;
      elMore.hidden = rem <= 0;
      if (rem > 0) elMore.textContent = rem <= PAGE ? `Mostrar ${rem === 1 ? "la última" : `las ${rem} restantes`}` : `Mostrar ${PAGE} más (quedan ${rem})`;
    }

    function appendRows(n) {
      const slice = filtered.slice(state.shown, state.shown + n);
      elList.insertAdjacentHTML('beforeend', slice.map(rowHtml).join(''));
      state.shown += slice.length;
      updateCount();
      return slice;
    }

    function noResultsHtml() {
      const label = (FILTERS.find(([v]) => v === state.f) || [])[1];
      if (state.q) {
        return `<li class="browse-none"><p>Ninguna nota coincide con «${U.esc(state.q)}»${state.f !== 'all' ? ` en ${U.esc(label.toLowerCase())}` : ''}.</p>
          <button type="button" class="btn" data-act="clear-q">Borrar búsqueda</button></li>`;
      }
      return `<li class="browse-none"><p>No hay notas en «${U.esc(label)}».</p>
        <button type="button" class="btn" data-act="clear-f">Ver todas</button></li>`;
    }

    /** Vuelve a pintar la lista. keep: cuántas filas mostrar como mínimo. */
    function apply({ keep = PAGE } = {}) {
      const empty = !all.length;
      $('#b-empty').hidden = !empty;
      $('#b-main').hidden = empty;
      if (empty) {
        $('#b-empty').innerHTML = `<div class="empty">
          ${UI.icons.cards || ''}
          <h2>Aún no hay notas aquí</h2>
          <p>Las tarjetas que crees aparecerán en esta lista.</p>
          <a class="btn btn-primary" href="${addHref}">${UI.icons.plus}<span>Añadir tarjeta</span></a></div>`;
        exitSelect(false);
        return;
      }
      terms = compute();
      renderFilters();
      state.shown = 0;
      elList.innerHTML = '';
      if (!filtered.length) {
        elList.innerHTML = noResultsHtml();
        elMore.hidden = true;
        elCount.textContent = state.q ? 'Sin resultados' : '';
      } else {
        appendRows(Math.max(PAGE, keep));
      }
      persist();
      updateBulk();
    }

    // ---------- Selección y acciones masivas ----------
    function updateBulk() {
      elBulk.hidden = !state.selecting;
      view.classList.toggle('is-selecting', state.selecting);
      if (!state.selecting) return;
      const n = selected.size;
      const visibleIds = filtered.slice(0, state.shown).map((x) => x.note.id);
      const visibleSet = new Set(visibleIds);
      const hidden = [...selected].filter((id) => !visibleSet.has(id)).length;
      $('#b-bulk-count').textContent = !n ? 'Ninguna nota seleccionada'
        : `${n} seleccionada${n === 1 ? '' : 's'}${hidden ? ` (${hidden} sin mostrar)` : ''}`;
      const byId = new Map(all.map((x) => [x.note.id, x]));
      const allSusp = n > 0 && [...selected].every((id) => byId.get(id)?.st.key === 'suspended');
      const bS = $('#b-susp');
      bS.textContent = allSusp ? 'Reactivar' : 'Suspender';
      bS.dataset.mode = allSusp ? 'on' : 'off';
      ['#b-susp', '#b-move', '#b-del'].forEach((s) => ($(s).disabled = !n));
      // «Visibles» solo marca las filas pintadas; las demás se ofrecen aparte, de forma explícita.
      const allVisibleOn = visibleIds.length > 0 && visibleIds.every((id) => selected.has(id));
      const bAll = $('#b-all');
      bAll.textContent = n ? 'Ninguna' : `Visibles (${visibleIds.length})`;
      bAll.setAttribute('aria-label', n ? 'Quitar la selección' : `Seleccionar las ${visibleIds.length} notas visibles`);
      const rest = filtered.filter((x) => !selected.has(x.note.id)).length;
      const bRest = $('#b-rest');
      bRest.hidden = !(allVisibleOn && rest > 0);
      bRest.textContent = `Seleccionar también las ${rest} sin mostrar`;
    }

    // ---------- Deshacer (suspender, reactivar, mover) ----------
    let undoTimer = null;
    function offerUndo(msg, snap) {
      const box = $('#b-undo');
      $('#b-undo-msg').textContent = msg;
      box.hidden = false;
      clearTimeout(undoTimer);
      undoTimer = setTimeout(() => { box.hidden = true; }, 9000);
      $('#b-undo-btn').onclick = async () => {
        clearTimeout(undoTimer);
        box.hidden = true;
        await S.restoreNotes(snap);
        load();
        apply({ keep: state.shown });
        UI.toast('Cambio deshecho');
        focusBulk();
      };
    }

    /** Tras una acción o un diálogo cancelado, el foco vuelve a la barra (nunca al <body>). */
    function focusBulk(fallback) {
      const el = state.selecting ? (fallback && !fallback.disabled ? fallback : $('#b-bulk-count')) : elSel;
      // Tras cerrar un <dialog> el navegador devuelve el foco por su cuenta: se corrige en el siguiente cuadro.
      requestAnimationFrame(() => el?.focus({ preventScroll: true }));
    }

    function enterSelect() {
      state.selecting = true;
      elSel.setAttribute('aria-pressed', 'true');
      elSel.textContent = 'Listo';
      apply({ keep: state.shown });
      const first = elList.querySelector('.note-check');
      if (first) first.focus({ preventScroll: true });
    }

    function exitSelect(rerender = true) {
      if (!state.selecting) return;
      state.selecting = false;
      selected.clear();
      elSel.setAttribute('aria-pressed', 'false');
      elSel.textContent = 'Seleccionar';
      if (rerender) apply({ keep: state.shown });
      updateBulk();
    }

    function afterBulk() {
      load();
      selected.clear();
      apply({ keep: state.shown });
      focusBulk();
    }
    const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;

    async function bulkSuspend() {
      const on = $('#b-susp').dataset.mode !== 'on';
      const ids = [...selected];
      const snap = S.snapshotNotes(ids);
      await S.setSuspendedMany(ids, on);
      afterBulk();
      offerUndo(on ? `${pl(ids.length, 'nota suspendida', 'notas suspendidas')}` : `${pl(ids.length, 'nota reactivada', 'notas reactivadas')}`, snap);
    }

    async function bulkMove() {
      const ids = [...selected];
      const sel = all.filter((x) => selected.has(x.note.id));
      const from = new Set(sel.map((x) => x.note.deckId));
      const only = from.size === 1 ? [...from][0] : null;
      const options = S.decks().map((d) => {
        const cur = d.id === only;
        return `<option value="${d.id}"${cur ? ' disabled' : ''}>${U.esc(d.name.split('::').join(' › '))}${cur ? ' (mazo actual)' : ''}</option>`;
      }).join('');
      const dest = await UI.modal({
        title: `Mover ${pl(ids.length, 'nota', 'notas')}`,
        body: `<label class="field"><span>Mazo de destino</span>
          <select name="d" required><option value="" disabled selected>Elige un mazo</option>${options}</select></label>`,
        actions: [
          { label: 'Mover', primary: true, collect: (d) => +d.querySelector('[name=d]').value || null },
          { label: 'Cancelar', value: null }
        ],
        onOpen: (d) => d.querySelector('select').focus()
      });
      if (!dest) return focusBulk($('#b-move'));
      const already = sel.filter((x) => x.note.deckId === dest).length;
      const snap = S.snapshotNotes(ids);
      const moved = await S.moveNotes(ids, dest);
      const name = S.shortName(S.deck(dest));
      afterBulk();
      const msg = `${pl(moved, 'nota movida', 'notas movidas')} a «${name}»${already ? ` · ${already} ya estaba${already === 1 ? '' : 'n'} allí` : ''}`;
      if (moved) offerUndo(msg, snap); else UI.toast(msg);
    }

    async function bulkDelete() {
      const n = selected.size;
      const nc = all.filter((x) => selected.has(x.note.id)).reduce((s, x) => s + x.cards.length, 0);
      const ok = await UI.confirm(
        `¿Eliminar ${pl(n, 'nota', 'notas')}?`,
        `Se eliminarán ${pl(n, 'nota', 'notas')} y ${pl(nc, 'tarjeta', 'tarjetas')}, con su progreso. No se puede deshacer.`,
        'Eliminar', true);
      if (!ok) return focusBulk($('#b-del'));
      await S.deleteNotes([...selected]);
      afterBulk();
      UI.toast(`${pl(n, 'nota eliminada', 'notas eliminadas')}`);
    }

    // ---------- Eventos ----------
    elQ.addEventListener('input', U.debounce(() => { state.q = elQ.value.trim(); forget(); apply(); }, 150));
    elSort.onchange = () => { state.sort = elSort.value; forget(); apply({ keep: state.shown }); };
    elSel.onclick = () => (state.selecting ? exitSelect() : enterSelect());

    elFilters.addEventListener('click', (e) => {
      const b = e.target.closest('[data-f]');
      if (!b || b.dataset.f === state.f) return;
      state.f = b.dataset.f;
      forget();
      apply();
      elFilters.querySelector(`[data-f="${state.f}"]`)?.focus();
    });

    elList.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]');
      if (act) {
        forget();
        if (act.dataset.act === 'clear-q') { elQ.value = ''; state.q = ''; }
        else state.f = 'all';
        apply();
        elQ.focus();
        return;
      }
      const a = e.target.closest('a.note-row');
      if (a) {
        // Recordar dónde estábamos para volver aquí desde el editor.
        const li = a.closest('li');
        persist({ anchor: +li.dataset.id, offset: Math.round(li.getBoundingClientRect().top) });
        ss.set(RESTORE, key);
        watchReturn();
        try { sessionStorage.setItem('recallo.returnTo', location.hash); } catch { /* sin almacenamiento */ }
      }
    });

    elList.addEventListener('change', (e) => {
      const cb = e.target.closest('.note-check');
      if (!cb) return;
      const id = +cb.value;
      cb.checked ? selected.add(id) : selected.delete(id);
      cb.closest('.note-row').classList.toggle('is-selected', cb.checked);
      updateBulk();
    });

    elMore.onclick = () => {
      const slice = appendRows(PAGE);
      persist();
      const first = slice[0] && elList.querySelector(`li[data-id="${slice[0].note.id}"] a, li[data-id="${slice[0].note.id}"] input`);
      if (first) first.focus();
    };

    function syncChecks() {
      elList.querySelectorAll('.note-check').forEach((cb) => {
        cb.checked = selected.has(+cb.value);
        cb.closest('.note-row').classList.toggle('is-selected', cb.checked);
      });
      updateBulk();
    }
    $('#b-all').onclick = () => {
      if (selected.size) selected.clear();
      else filtered.slice(0, state.shown).forEach((x) => selected.add(x.note.id));
      syncChecks();
    };
    $('#b-rest').onclick = () => {
      filtered.forEach((x) => selected.add(x.note.id));
      syncChecks();
      $('#b-bulk-count').focus({ preventScroll: true });
    };
    $('#b-susp').onclick = bulkSuspend;
    $('#b-move').onclick = bulkMove;
    $('#b-del').onclick = bulkDelete;

    elTop.onclick = () => {
      window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      elQ.focus({ preventScroll: true });
    };
    const onScroll = () => { elTop.hidden = window.scrollY < 1200; };
    window.addEventListener('scroll', onScroll, { passive: true });

    const onKey = (e) => {
      if (document.querySelector('#modal[open]')) return;
      const typing = e.target instanceof Element && e.target.closest('input, textarea, select, [contenteditable]');
      if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); elQ.focus(); elQ.select(); }
      else if (e.key === 'Escape' && state.selecting) { e.preventDefault(); exitSelect(); elSel.focus(); }
    };
    document.addEventListener('keydown', onKey);

    // Fila de filtros desplazable: degradado en el borde que aún tiene contenido.
    const chipFade = () => {
      const el = elFilters;
      el.classList.toggle('fade-start', el.scrollLeft > 2);
      el.classList.toggle('fade-end', el.scrollLeft + el.clientWidth < el.scrollWidth - 2);
    };
    elFilters.addEventListener('scroll', chipFade, { passive: true });
    window.addEventListener('resize', chipFade);

    UI.onLeave(() => {
      clearTimeout(undoTimer);
      window.removeEventListener('resize', chipFade);
      window.removeEventListener('scroll', onScroll);
      document.removeEventListener('keydown', onKey);
      view.classList.remove('is-selecting');
    });

    // ---------- Primera pintura (restaurando posición si volvemos del editor) ----------
    if (restoring && saved.anchor) {
      const idx = (() => { compute(); return filtered.findIndex((x) => x.note.id === saved.anchor); })();
      apply({ keep: Math.max(saved.shown || PAGE, idx + 1) });
      const li = elList.querySelector(`li[data-id="${saved.anchor}"]`);
      if (li) {
        window.scrollTo(0, Math.max(0, li.getBoundingClientRect().top + window.scrollY - (saved.offset ?? 120)));
        li.querySelector('a')?.focus({ preventScroll: true });
      }
    } else {
      apply();
    }
    onScroll();
  };
})(window.App);

</script>
  <script>
/* Ajustes: límites de estudio, pasos de aprendizaje, tema y gestión de datos. */
(function (App) {
  'use strict';
  const U = App.util, S = App.store, UI = App.ui;
  const V = App.views;

  // ---------- Pasos: «1m 10m 1h 1d» ⇄ minutos ----------
  const UNIT = { '': 1, m: 1, min: 1, s: 1 / 60, h: 60, d: 1440 };
  const MAX_STEP = 30 * 1440;                          // 30 días
  /** Devuelve { ok: [minutos], capped } , { bad: 'token' } o { zero: 'token' }. */
  function parseSteps(text) {
    const out = [];
    let capped = false;
    for (const tok of text.trim().split(/[\s,;]+/).filter(Boolean)) {
      const m = /^([-−]?\d+(?:[.,]\d+)?)\s*(min|m|s|h|d)?$/i.exec(tok);
      if (!m) return { bad: tok };
      const n = parseFloat(m[1].replace('−', '-').replace(',', '.')) * UNIT[(m[2] || '').toLowerCase()];
      if (!(n > 0)) return { zero: tok };
      if (n > MAX_STEP) capped = true;
      out.push(Math.min(MAX_STEP, Math.round(n * 100) / 100));
    }
    return { ok: out, capped };
  }

  /** «al minuto», «a los 10 minutos», «a la hora», «a los 2 días»… */
  function stepPhrase(min) {
    const [n, one, many] = min < 1 ? [Math.round(min * 60), 'segundo', 'segundos']
      : min >= 1440 && min % 1440 === 0 ? [min / 1440, 'día', 'días']
      : min >= 60 && min % 60 === 0 ? [min / 60, 'hora', 'horas'] : [min, 'minuto', 'minutos'];
    if (n === 1) return one === 'hora' ? 'a la hora' : one === 'día' ? 'al día siguiente' : `al ${one}`;
    return `a ${one === 'hora' ? 'las' : 'los'} ${String(n).replace('.', ',')} ${many}`;
  }
  const joinEs = (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} y ${xs[xs.length - 1]}`);
  /** Lectura en lenguaje llano de una lista de pasos. */
  function stepsReading(k, list, grad) {
    const after = k === 'learningSteps'
      ? (grad === 1 ? 'un día más tarde' : `${grad} días más tarde`)
      : 'retoma su ritmo de repaso';
    if (!list.length) return k === 'learningSteps' ? `Sin pasos: pasa directamente al repaso, ${after}.` : 'Sin pasos: vuelve directamente a su ritmo de repaso.';
    return `Volverá ${joinEs(list.map(stepPhrase))}; después, ${after}.`;
  }
  const fmtStep = (min) =>
    min < 1 ? `${Math.round(min * 60)}s` : min >= 1440 && min % 1440 === 0 ? `${min / 1440}d` : min >= 60 && min % 60 === 0 ? `${min / 60}h` : `${min}m`;
  const fmtSteps = (list) => list.map(fmtStep).join(' ');

  function lastBackupText(ts) {
    if (!ts) return 'Aún no has descargado ninguna copia.';
    const days = Math.floor((U.dayStart(0) - U.dayStart(0, ts)) / 86400000 + 0.5);
    const when = days <= 0 ? 'hoy' : days === 1 ? 'ayer' : `hace ${days} días`;
    return `Última copia: ${when}.`;
  }
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  // Claves que «Restablecer valores» devuelve a su valor inicial (el tema y la fecha de copia se respetan).
  const STUDY_KEYS = ['newPerDay', 'reviewsPerDay', 'learningSteps', 'relearningSteps', 'graduatingInterval', 'easyInterval', 'burySiblings'];

  V.settings = (opts = {}) => {
    UI.setHeader({ title: 'Ajustes', back: '#/' });
    const s = S.settings();

    const help = {
      newPerDay: (n) => n ? `Con ${n} al día, cuenta con unos ${n * 10} repasos diarios al cabo de un mes.` : 'Con 0 no entra ninguna tarjeta nueva: solo repasas lo que ya conoces.',
      reviewsPerDay: (n) => n ? `Si un día te tocan más de ${n}, el resto espera a mañana.` : 'Con 0 no repasarás nada y las tarjetas pendientes se irán acumulando.'
    };
    const numRow = (k, label, min, max, helpText) => `
      <div class="setting" data-row="${k}">
        <div class="setting-text">
          <label for="s-${k}">${label}</label>
          <p class="setting-help${k === 'reviewsPerDay' && s[k] === 0 ? ' is-warn' : ''}" id="h-${k}">${helpText}</p>
        </div>
        <input id="s-${k}" type="number" inputmode="numeric" min="${min}" max="${max}" step="1" data-k="${k}" value="${s[k]}" aria-describedby="h-${k} m-${k}">
        <p class="setting-msg" id="m-${k}" aria-live="polite"></p>
      </div>`;
    const stepRow = (k, label, helpText) => `
      <div class="setting" data-row="${k}">
        <div class="setting-text">
          <label for="s-${k}">${label}</label>
          <p class="setting-help" id="h-${k}">${helpText}</p>
        </div>
        <input id="s-${k}" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" data-k="${k}" data-list value="${fmtSteps(s[k])}" aria-describedby="h-${k} r-${k} m-${k}">
        <p class="setting-reading" id="r-${k}">${stepsReading(k, s[k], s.graduatingInterval)}</p>
        <p class="setting-msg" id="m-${k}" aria-live="polite"></p>
      </div>`;

    const view = UI.render(`
      <div class="settings">
        <section class="panel" aria-labelledby="sec-pace">
          <h2 id="sec-pace">Ritmo diario</h2>
          ${numRow('newPerDay', 'Tarjetas nuevas por día', 0, 9999, help.newPerDay(s.newPerDay))}
          ${numRow('reviewsPerDay', 'Repasos máximos por día', 0, 99999, help.reviewsPerDay(s.reviewsPerDay))}
        </section>

        <section class="panel" aria-labelledby="sec-look">
          <h2 id="sec-look">Apariencia</h2>
          <div class="setting setting-inline">
            <div class="setting-text"><span class="setting-label" id="l-theme">Tema</span></div>
            <div class="segmented theme-pick" role="radiogroup" aria-labelledby="l-theme">
              ${[['system', 'Sistema'], ['light', 'Claro'], ['dark', 'Oscuro']].map(([v, l]) => `
                <label><input type="radio" name="theme" value="${v}" ${s.theme === v ? 'checked' : ''}><span>${l}</span></label>`).join('')}
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="sec-adv">
          <h2 id="sec-adv">Avanzado</h2>
          <p class="setting-help adv-intro">Cómo vuelven las tarjetas mientras las aprendes.</p>
          <details class="advanced" id="s-advanced" ${opts.openAdvanced ? 'open' : ''}>
          <summary><span class="adv-show">Mostrar ajustes avanzados</span><span class="adv-hide">Ocultar ajustes avanzados</span></summary>
          ${stepRow('learningSteps', 'Pasos de aprendizaje', 'Cuándo vuelve a salir una tarjeta nueva hasta que la aprendes. Por ejemplo: 1m 10m.')}
          ${stepRow('relearningSteps', 'Pasos al olvidar una tarjeta', 'Cuándo vuelve una tarjeta que habías olvidado. Por ejemplo: 10m.')}
          ${numRow('graduatingInterval', 'Intervalo al aprender', 1, 365, 'Días hasta el primer repaso tras pulsar «Bien» en el último paso.')}
          ${numRow('easyInterval', 'Intervalo «Fácil»', 1, 365, 'Días hasta el primer repaso al pulsar «Fácil» en una tarjeta nueva.')}
          <div class="setting setting-inline setting-switch">
            <div class="setting-text">
              <label for="s-bury">Posponer tarjetas hermanas</label>
              <p class="setting-help" id="h-bury">Al responder una tarjeta, las demás de la misma nota (la inversa, otros huecos) esperan a mañana para no desvelar la respuesta.</p>
            </div>
            <input id="s-bury" type="checkbox" role="switch" data-flag="burySiblings" aria-describedby="h-bury" ${s.burySiblings !== false ? 'checked' : ''}>
          </div>
          <div class="setting setting-reset">
            <button type="button" class="btn" id="s-defaults">Restablecer valores</button>
          </div>
          </details>
        </section>

        <section class="panel" aria-labelledby="sec-data">
          <h2 id="sec-data">Tus datos</h2>
          <p class="setting-help data-note">Tus tarjetas se guardan solo en este dispositivo y navegador. Una copia de vez en cuando te protege si cambias de equipo o se borra el navegador.</p>
          <div class="data-backup">
            <button class="btn btn-primary btn-block" id="s-backup">${UI.icons.download}<span>Descargar copia de seguridad</span></button>
            <p class="setting-help" id="s-lastbackup">${lastBackupText(s.lastBackupAt)}</p>
          </div>
          <div class="data-secondary">
            <button class="btn" id="s-restore">${UI.icons.upload}<span>Restaurar una copia</span></button>
            <button class="btn" id="s-export">${UI.icons.cards}<span>Exportar a Anki (.apkg)</span></button>
          </div>
          <p class="setting-help data-count">${plural(S.decks().length, 'mazo', 'mazos')} · ${plural(S.noteCount(), 'nota', 'notas')} · ${plural(S.cardCount(), 'tarjeta', 'tarjetas')}</p>

          <div class="danger-zone">
            <h3>Zona de riesgo</h3>
            <p class="setting-help">Borra todos los mazos, tarjetas, imágenes y el progreso de este dispositivo.</p>
            <button class="btn btn-danger-ghost" id="s-reset">${UI.icons.trash}<span>Borrar todos los datos</span></button>
          </div>
        </section>

        <p class="about">${U.esc(App.config.appName)} · versión ${App.config.version}</p>
      </div>`);

    // ---------- Validación en línea ----------
    const last = {};                                   // último valor válido guardado por clave
    STUDY_KEYS.forEach((k) => (last[k] = s[k]));
    const msgEl = (k) => view.querySelector(`#m-${k}`);
    function setMsg(input, text, kind) {             // kind: 'error' | 'note' | ''
      const el = msgEl(input.dataset.k);
      el.textContent = text || '';
      el.dataset.kind = kind || '';
      if (kind === 'error') input.setAttribute('aria-invalid', 'true');
      else input.removeAttribute('aria-invalid');
    }

    async function commitNumber(input) {
      const k = input.dataset.k;
      const raw = input.value.trim();
      const min = +input.min, max = +input.max;
      if (raw === '' && input.validity.badInput) return setMsg(input, 'Escribe solo un número entero.', 'error');
      if (raw === '') {
        input.value = last[k];
        return setMsg(input, `El campo no puede quedar vacío: se mantiene ${last[k]}.`, 'note');
      }
      const n = Number(raw);
      if (!Number.isFinite(n)) return setMsg(input, 'Escribe solo un número entero.', 'error');
      let v = Math.round(n);
      let note = '';
      if (v < min) { v = min; note = `Ajustado a ${min} (el mínimo).`; }
      else if (v > max) { v = max; note = `Ajustado a ${max} (el máximo).`; }
      else if (v !== n) note = `Redondeado a ${v}.`;
      // Regla cruzada: «Fácil» nunca antes que «Bien».
      const grad = k === 'graduatingInterval' ? v : last.graduatingInterval;
      const easy = k === 'easyInterval' ? v : last.easyInterval;
      if ((k === 'graduatingInterval' || k === 'easyInterval') && grad > easy) {
        return setMsg(input, k === 'easyInterval'
          ? `Debe ser al menos ${grad} día${grad === 1 ? '' : 's'}, el intervalo al aprender.`
          : `No puede superar el intervalo «Fácil» (${easy} día${easy === 1 ? '' : 's'}).`, 'error');
      }
      input.value = v;
      if (v === last[k]) return setMsg(input, note, note ? 'note' : '');
      await S.saveSettings({ [k]: v });
      last[k] = v;
      // Si esta corrección arregla el error del otro intervalo, límpialo.
      ['graduatingInterval', 'easyInterval'].forEach((o) => {
        const other = view.querySelector(`[data-k=${o}]`);
        if (o !== k && other.getAttribute('aria-invalid')) commitNumber(other);
      });
      const h = help[k];
      if (h) {
        const el = view.querySelector(`#h-${k}`);
        el.textContent = h(v);
        el.classList.toggle('is-warn', k === 'reviewsPerDay' && v === 0);
      }
      if (k === 'graduatingInterval') refreshReading('learningSteps');
      setMsg(input, note, note ? 'note' : '');
      if (!note) UI.toast('Guardado');
    }

    async function commitSteps(input) {
      const k = input.dataset.k;
      const raw = input.value.trim();
      if (raw === '') {
        input.value = fmtSteps(last[k]);
        return setMsg(input, `El campo no puede quedar vacío: se mantiene «${fmtSteps(last[k])}».`, 'note');
      }
      const r = parseSteps(raw);
      if (r.bad) return setMsg(input, `No entiendo «${r.bad}». Usa números con s, m, h o d, separados por espacios: 1m 10m 1d.`, 'error');
      if (r.zero) return setMsg(input, `Cada paso debe ser mayor que 0 («${r.zero}» no vale).`, 'error');
      const note = r.capped ? 'Ajustado a 30 días (el paso más largo posible).' : '';
      const pretty = fmtSteps(r.ok);
      input.value = pretty;
      refreshReading(k, r.ok);
      if (pretty === fmtSteps(last[k])) return setMsg(input, note, note ? 'note' : '');
      await S.saveSettings({ [k]: r.ok });
      last[k] = r.ok;
      setMsg(input, note, note ? 'note' : '');
      if (!note) UI.toast('Guardado');
    }

    /** Lectura en lenguaje llano bajo el campo de pasos (en vivo mientras se escribe). */
    function refreshReading(k, list) {
      const el = view.querySelector(`#r-${k}`);
      if (el) el.textContent = stepsReading(k, list || last[k], last.graduatingInterval);
    }
    view.querySelectorAll('[data-list]').forEach((input) => input.addEventListener('input', () => {
      const r = parseSteps(input.value);
      if (r.ok && r.ok.length) refreshReading(input.dataset.k, r.ok);
    }));

    view.querySelectorAll('[data-k]').forEach((input) => {
      input.addEventListener('change', () => ('list' in input.dataset ? commitSteps : commitNumber)(input));
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.dispatchEvent(new Event('change')); });
    });

    view.querySelectorAll('[data-flag]').forEach((input) => input.addEventListener('change', async () => {
      await S.saveSettings({ [input.dataset.flag]: input.checked });
      UI.toast('Guardado');
    }));

    // Regla única de avisos: «Guardado» cada vez que un cambio se guarda tal cual;
    // si hubo que ajustarlo, lo explica la nota bajo el campo y no hay aviso flotante.
    view.querySelectorAll('[name=theme]').forEach((r) => r.addEventListener('change', async () => {
      await S.saveSettings({ theme: r.value });
      UI.applyTheme();
      UI.toast('Guardado');
    }));

    view.querySelector('#s-defaults').onclick = async () => {
      const ok = await UI.confirm('Restablecer valores',
        'El ritmo diario y los ajustes avanzados vuelven a sus valores iniciales. Tus tarjetas, el tema y tus copias no cambian.', 'Restablecer', true);
      if (!ok) return;
      const d = App.config.defaults;
      await S.saveSettings(Object.fromEntries(STUDY_KEYS.map((k) => [k, Array.isArray(d[k]) ? [...d[k]] : d[k]])));
      V.settings({ openAdvanced: true });
      UI.toast('Valores restablecidos');
    };

    // ---------- Datos ----------
    async function downloadBackup() {
      const busy = UI.busy('Preparando copia…');
      try {
        const data = await S.exportBackup();
        const stamp = new Date().toISOString().slice(0, 10);
        U.download(new Blob([JSON.stringify(data)], { type: 'application/json' }), `${App.config.appName}-copia-${stamp}.json`);
        await S.saveSettings({ lastBackupAt: Date.now() });
        const el = view.querySelector('#s-lastbackup');
        if (el) el.textContent = lastBackupText(Date.now());
        return true;
      } catch (e) {
        UI.alert('No se pudo preparar la copia', e.message);
        return false;
      } finally {
        busy.close();
      }
    }
    view.querySelector('#s-backup').onclick = downloadBackup;

    view.querySelector('#s-restore').onclick = async () => {
      const file = await UI.pickFile('.json,application/json');
      if (!file) return;
      let data;
      try {
        data = JSON.parse(await file.text());
        if (!data || data.format !== 1 || !Array.isArray(data.notes)) throw new Error('bad');
      } catch {
        return UI.alert('No es una copia válida', 'El archivo elegido no es una copia de seguridad de ' + App.config.appName + '. No se ha cambiado nada.');
      }
      const when = data.exportedAt ? ` del ${U.fmtDate(Date.parse(data.exportedAt))}` : '';
      const ok = await UI.confirm('Restaurar copia',
        `Tus ${plural(S.decks().length, 'mazo', 'mazos')} y ${plural(S.noteCount(), 'nota', 'notas')} actuales se sustituirán por los de la copia${when}: `
        + `${plural((data.decks || []).length, 'mazo', 'mazos')} y ${plural(data.notes.length, 'nota', 'notas')}. Lo actual no se podrá recuperar.`,
        'Restaurar', true);
      if (!ok) return;
      const busy = UI.busy('Restaurando…');
      try {
        await S.importBackup(data);
        location.hash = '#/';
        location.reload();
      } catch (e) {
        busy.close();
        UI.alert('No se pudo restaurar', e.message);
      }
    };

    view.querySelector('#s-export').onclick = () => App.views.exportFlow(null);

    view.querySelector('#s-reset').onclick = async () => {
      const WORD = 'BORRAR';
      const ok = await UI.modal({
        title: 'Borrar todos los datos',
        body: `<p>Se borrarán ${plural(S.decks().length, 'mazo', 'mazos')}, ${plural(S.noteCount(), 'nota', 'notas')}, ${plural(S.cardCount(), 'tarjeta', 'tarjetas')}${S.mediaCount && S.mediaCount() ? `, ${plural(S.mediaCount(), 'archivo multimedia', 'archivos multimedia')}` : ''} y todo tu progreso de este dispositivo. No se puede deshacer.</p>
          <p><button type="button" class="btn btn-sm" id="dz-backup">${UI.icons.download}<span>Descargar copia antes</span></button></p>
          <label class="field"><span>Escribe ${WORD} para confirmar</span>
            <input name="confirm" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="dz-hint">
          </label>
          <p class="setting-help dz-hint" id="dz-hint" aria-live="polite">El botón se activa al escribir la palabra.</p>`,
        actions: [
          { label: 'Borrar todo', primary: true, danger: true, collect: (d) => d.querySelector('[name=confirm]').value.trim().toUpperCase() === WORD },
          { label: 'Cancelar', value: false }
        ],
        onOpen: (d) => {
          const input = d.querySelector('[name=confirm]');
          const go = d.querySelector('.btn-danger');
          const hint = d.querySelector('#dz-hint');
          const valid = () => input.value.trim().toUpperCase() === WORD;
          const sync = () => {
            go.disabled = !valid();
            hint.textContent = valid() ? 'Listo: pulsa «Borrar todo» para confirmar.' : 'El botón se activa al escribir la palabra.';
            hint.classList.remove('is-error');
          };
          sync();
          input.addEventListener('input', sync);
          // Enter en el campo nunca cierra el diálogo: lleva al botón o explica qué falta.
          input.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            if (valid()) go.focus();
            else { hint.textContent = `Escribe ${WORD} exactamente para activar el botón.`; hint.classList.add('is-error'); }
          });
          d.querySelector('#dz-backup').onclick = async (e) => {
            const b = e.currentTarget;
            if (await downloadBackup()) { b.querySelector('span').textContent = 'Copia descargada'; b.disabled = true; }
          };
          input.focus();
        }
      });
      if (ok !== true) return;
      await S.resetAll();
      location.hash = '#/';
      location.reload();
    };
  };
})(window.App);

</script>
  <script>
/* Arranque y navegación (rutas con #). */
(function (App) {
  'use strict';
  const UI = App.ui;
  const V = App.views;

  const routes = [
    [/^$/, () => V.home()],
    [/^deck\/(\d+)$/, (m) => V.deck(+m[1])],
    [/^study\/(\d+)$/, (m) => V.study(+m[1])],
    [/^add(?:\/(\d+))?$/, (m) => V.editor({ deckId: m[1] ? +m[1] : null })],
    [/^edit\/(\d+)$/, (m) => V.editor({ noteId: +m[1] })],
    [/^browse\/(\d+|all)$/, (m) => V.browse(m[1] === 'all' ? null : +m[1])],
    [/^settings$/, () => V.settings()]
  ];

  async function route() {
    UI.runCleanups();
    const dlg = document.getElementById('modal');
    if (dlg.open) dlg.close();
    const path = location.hash.replace(/^#\/?/, '');
    // El deshacer del estudio solo se conserva en la ida y vuelta al editor.
    if (App.session && !/^(edit|study)\//.test(path)) App.session.undoKeep = null;
    for (const [re, fn] of routes) {
      const m = path.match(re);
      if (m) {
        try {
          await fn(m);
        } catch (e) {
          console.error(e);
          UI.render(`<div class="empty"><h2>Algo ha fallado</h2><p>${App.util.esc(e.message)}</p><a class="btn" href="#/">Volver al inicio</a></div>`);
        }
        return;
      }
    }
    location.hash = '#/';
  }

  App.refresh = route;

  // Mensajes de arranque (carga, pestaña que bloquea, tiempo agotado, error).
  function bootMessage(title, text, retry) {
    const v = UI.render(`<div class="empty boot-state" role="alert">
      <h2>${App.util.esc(title)}</h2><p>${App.util.esc(text)}</p>
      ${retry ? '<button type="button" class="btn btn-primary" id="boot-retry">Reintentar</button>' : ''}
    </div>`);
    const b = v.querySelector('#boot-retry');
    if (b) { b.onclick = () => location.reload(); b.focus(); }
  }

  async function boot() {
    let ready = false;
    UI.render(`<div class="empty boot-state" aria-busy="true"><div class="spinner" aria-hidden="true"></div><p>Abriendo tus mazos…</p></div>`);
    App.db.onblocked = () => {
      if (!ready) bootMessage('Recallo está abierta en otra pestaña',
        'Otra pestaña con una versión anterior de Recallo está usando tus datos. Ciérrala y pulsa «Reintentar».', true);
    };
    const slow = setTimeout(() => {
      if (!ready) bootMessage('Tus datos están tardando en abrirse',
        'Puede que Recallo esté abierta en otra pestaña o que el navegador esté ocupado. Cierra otras pestañas de Recallo y pulsa «Reintentar».', true);
    }, 8000);
    try {
      await App.store.init();
    } catch (e) {
      console.error(e);
      clearTimeout(slow);
      bootMessage('No se pudo abrir el almacenamiento',
        `Tu navegador no permite guardar datos (¿modo privado?). ${e.message || ''}`, true);
      return;
    }
    ready = true;
    clearTimeout(slow);
    UI.applyTheme();
    window.addEventListener('hashchange', route);
    route();

    // Instalable como app (PWA) cuando se sirve por http(s).
    if (location.protocol.startsWith('http')) {
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'manifest.webmanifest';
      document.head.appendChild(link);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }

  boot();
})(window.App);

</script>
