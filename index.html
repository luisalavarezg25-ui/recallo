<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#23406f">
  <meta name="description" content="Tarjetas de estudio con repaso espaciado, compatibles con Anki.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Recallo</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/harden.css">
  <link rel="stylesheet" href="css/adapt.css">
  <link rel="stylesheet" href="css/a11y.css">
  <link rel="stylesheet" href="css/delight.css">
  <link rel="stylesheet" href="css/onboard.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/browse.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn" id="hdr-back" aria-label="Volver" hidden></button>
      <h1 id="hdr-title">Recallo</h1>
      <div class="topbar-actions" id="hdr-actions"></div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="busy" hidden><div class="busy-box" tabindex="-1" role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div><p id="busy-msg">Cargando…</p></div></div>
  <dialog id="modal"></dialog>

  <script src="js/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/db.js"></script>
  <script src="js/core/scheduler.js"></script>
  <script src="js/core/cards.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/anki.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/ui/home.js"></script>
  <script src="js/ui/study.js"></script>
  <script src="js/ui/editor.js"></script>
  <script src="js/ui/browse.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
